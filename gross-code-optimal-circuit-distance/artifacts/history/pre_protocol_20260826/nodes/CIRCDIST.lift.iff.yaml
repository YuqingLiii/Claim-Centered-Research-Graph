id: CIRCDIST.lift.iff
role: proof
aliases:
- LIFT-IFF
claim: >-
  In graph-like detector error models with fixed boundaries, for memory experiments C_R(M) with R
  >= d_sec (the spatial distance of the sector's own logical class: d_X for the Z-memory, d_Z for
  the X-memory), d_circ equals the minimum over nontrivial effective logicals gamma of the length
  of the shortest closed spacetime lift of gamma, with an intrinsic zero-voltage/monodromy
  condition characterizing same-weight liftability at minimum weight — and the voltage is
  computable without constructing the full multi-round circuit (non-vacuity bar).
assumptions:
  model-fact-v:
    kind: model-fact
    statement: '(V): U(empty) subset {0} union {e_b} — the empty-residual voltage inventory
      contains only the zero vector and single-basis vectors. Load-bearing ("(V) is
      everything", proof §7.3); ESTABLISHED, not assumed: attacked by the base review §4.2
      numerically (440/440 empty-residual voltage vectors of weight <= 1) and structurally (a
      2-qubit fault lives on one CNOT whose two qubits are never two Z-ancillas, so no
      elementary fault puts X on two Z-ancillas at once — a derivation from the frozen 公共定义
      fault menu).'
    source:
      path: artifacts/circdist_lift_proofs_review_20260820.md
      kind: review
      locator: Section 4.2
assessment:
  level: PROVED
  caveats:
  - 'The d_X != d_Z regime, previously never probed (all 282 base-review instances had
    d_X = d_Z), is now TRIPLY swept: 194 (wave 22) + 128 (wave 23) + 405 (wave-29 end-to-end
    review, on two families no prior sweep touched — hypergraph-product + rectangular Shor),
    0 ceiling violations in all three; the old constant fails 43/128 and 63/405.'
  - 'Shared model design is not independence (wave-29, standing campaign limitation): every
    independent implementation re-implements the frozen 公共定义 Definition 1.8 DESIGN (which
    locations exist, which Paulis are available), so a systematic mismatch between the frozen
    model and a real compiler would survive all of them — a stim cross-check now exists but is
    NARROW: artifacts/circdist_stim_crossval_20260823.md (stim 1.16.0) confirms d_circ = d_eff
    on six repair-0 (non-interleaved) sector-instances across [[4,2,2]], Steane and rotated
    surface, and separately shows the frozen inventory to be DEM-column-complete against
    reset/measure idle locations and against a noisy terminal readout. This is a REPAIR-0 SPOT
    CHECK ONLY: the criterion at repair >= 1 (the node''s own load-bearing regime) has NO stim
    cross-check, and d_eff there was imported rather than recomputed.'
  - 'The dossier is a FIVE-FILE append-only composition (base + Amendments 1-4, with
    Amendment 2 §3.2 a discharged no-op), byte-verified but not consolidated; a consolidation
    pass is recommended, non-blocking.'
  - 'EXCLUSION (adjudicated 2026-08-23, artifacts/circdist_iff_scope_adjudication_20260823.md):
    the general lift-length formula for repair >= 3 and its min-cost-covering replacement lie
    OUTSIDE this claim. All three conjuncts are repair-0-scoped: conjunct 1 is Theorem 5.6(a),
    in which no repair term occurs; conjunct 2 is Theorem 5.7, whose (=>) needs no hypothesis
    on repair and whose (<=) uses only min(repair,2) >= 1; conjunct 3''s "voltage" is the
    (LIFT'')/repair data of Definition 5.2, one-round computable unconditionally, with 5.10(2)
    supplying a repair-free decision procedure for d_circ. The hash-bound review states the
    same boundary (§7.1: repair >= 3 "outside this claim/review"). This REVERSES the wave-11
    reading of the repair >= 3 gap as a scope caveat.'
  - Certification is for the exact current node claim and the reviewed minimum-weight
    repair-0/closed-lift criterion, not for stronger formulas mentioned as future work.
  - Large proposer scans (98811 surface schedules, 3855/3855, the 321059/321059 symmetry) were
    not independently reproduced; the reviewer reproduced 282 instances at repair in {0,1} only.
  - The pre-existing 5.6(d) concern is unreviewed but is NOT a premise of this claim (hash-bound
    review limitations item 2 states this explicitly; adjudication confirms).
  - Model fact (V) is registered in this node's assumptions block (lead-approved §2 amendment
    2026-08-23, node-level assumptions for direct-proof nodes) with its establishing evidence.
  - Per-sector scope — everything is stated for one memory sector.
  summary: 'Promoted CERTIFIED* -> PROVED 2026-08-23: the wave-29 END-TO-END claim-level
    review (artifacts/circdist_iff_endtoend_review_20260823.md) attacked the assembled
    five-file dossier against the exact claim (hash 0c4c466b) — all three conjuncts HOLD
    (conjunct 1 re-derived incl. Lemma A and the corrected Lemma B chain, 405 fresh instances
    0 violations; conjunct 2 biconditional 363/363 with the (false,false) side reached by
    hill-climb; conjunct 3''s (LIFT'') program 139/139 at W = d_sec while the original W = d
    fails 49 — reproducing the wave-17 refutation on untouched families); FOUR holes filled by
    the reviewer with own derivations (H1 L_eff finiteness, H2 terminal-detector monotonicity,
    H3 hook rigidity closing voltage realizability, H4 minimum-weight finiteness); 1.9/1.11/
    1.13/(V) re-derived on an own full-symplectic simulator, 113728 checks 0 violations;
    composition audit CLEAN (and Amendment 2 §3.2 shown to be a never-executable ASCII quote,
    soundly absorbed by A4-R2). D1/D2 dispatcher repairs executed at promotion. History:
    promoted NUMERICAL -> CERTIFIED* after the independent Amendment-2 completion review.
    COMPLETE proposer-level proofs are on disk for the two core theorems
    (artifacts/circdist_lift_iff_proof_20260820.md, round 4, 2026-08-20). THEOREM 1 (overlap
    criterion): a hook of X-check a is a vertical edge on Z-check b only if
    |supp(a) ∩ supp(b)| >= 4 — four lines from one parity identity under (MC), UPGRADED to an iff
    at overlap exactly 2 (voltage iff (MC) fails on that pair; measurement consistency is
    load-bearing, not hygienic), with (MC) itself derived both directions. THEOREM 2:
    |gamma| + min(repair(gamma), 2) <= lift-length <= |gamma| + repair(gamma), equality whenever
    repair <= 2, repair computed from ONE round; and the headline iff holds UNCONDITIONALLY —
    d_circ = d_eff iff some minimum-weight effective logical has repair(gamma) = 0. The
    non-interleaved corollary falls out in six lines (repair identically 0). NEITHER theorem uses
    graph-likeness (the campaign''s own Steane witness is not graph-like). Non-vacuity bar met:
    the voltage/repair data is intrinsic and one-round computable, and the CONTIGUITY THEOREM
    (min-weight undetectable logicals occupy contiguous rounds with span <= weight <= d_sec per
    sector, the Amendment-3 corrected constant) gives a finite-window decision for d_circ;
    together with monotonicity and d_R <= d UNDER THE WHOLE-CIRCUIT READING (Lemma B-prime),
    Amendment 2 gives the exact R_sat dichotomy {1,infinity}. Temporal boundary shown free (finite-R complex embeds isometrically in
    the bulk) — the boundary-ramification formalization plan is retired as unnecessary. The
    orientation crux of the voltage-monodromy plan is resolved as a formulation defect (G_circ is
    a derived graph of a MULTIGRAPH over G_eff via the voltage spectrum U(E)). LOCATED GAP: the
    clean formula is probably FALSE for repair >= 3 (a weight-2 pair gadget reproduces |s(E'')|
    measurement flips); the extension target is the min-cost-covering form. Numerics: 3855/3855
    minimum-weight logicals satisfy (LIFT'') and the weight accounting; d3-gate Steane numbers
    independently reproduced. Amendment 2 (SHA-256 0ab3ce43...) applies the rereviewer''s
    schedule-independent L1 collision argument, the exact R_sat=1 branch L2, and the
    minimum-weight qualifier L3; the focused independent rereview CLEAN-PASSED all three and the
    assembled dossier. Earlier
    records (d3-gate validation, the three recon-era formalization plans, and the killed
    cohomological criterion) live in this node''s events and the cited artifacts.'
