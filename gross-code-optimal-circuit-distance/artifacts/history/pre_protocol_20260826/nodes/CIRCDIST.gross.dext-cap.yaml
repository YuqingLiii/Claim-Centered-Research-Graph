id: CIRCDIST.gross.dext-cap
role: proof
aliases:
- GROSS-DEXT-CAP
claim: For the Gross code [[144,12,12]], every legal single-ancilla CNOT syndrome-extraction
  schedule M — interleaved or not — satisfies d_ext(E(M)) <= 11.
assessment:
  level: PROVED
  caveats:
  - 'Repaired-schedule scope (adjudicated 2026-08-23): the weight-6 multi-hook witness is
    carried on the REVIEWER''S repaired MC-valid non-interleaved depth-12 schedule (identical
    within-check orders), not on the originally cited translation-invariant schedule (which,
    with its entire 25920-member class, violates measurement consistency). This qualifies ONLY
    the refutation of the RETIRED parity-rigidity clause; the surviving claim d_ext <= 11 is
    schedule-independent, needs no detector determinism, and is untouched.'
  - 'The [[144,12,12]] label''s d = 12 is randomised-ISD evidence, not proof — and is NOT
    load-bearing: the argument needs only that explicit weight-12 zero-syndrome non-stabiliser
    operators exist, which is witness-certified.'
  - Absence-side readings of the G1 sweep (the "no smaller witness" histogram side; the
    70.7/26.1/15.6 percent figures) are NOT-REVIEWED and lie outside this claim.
  - 'Shared model design: proposer, reviewer, and adjudicator all read the frozen 公共定义 fault
    inventory; a systematic modelling error at that level would survive every implementation.
    (The adjudicator''s Gross-code rebuild is pure F2 linear algebra over the published
    polynomials and touches no circuit model.)'
  summary: 'Promoted CERTIFIED* -> PROVED 2026-08-23 under canonical DAG_PROTOCOL §3: the
    wave-11 re-adjudication (artifacts/circdist_readjudication_20260823.md §5, fresh independent
    session) rules PROVED-QUALIFIES — complete argument, every load-bearing input covered by the
    hash-bound adversarial review, no unresolved premise; the adjudicator independently rebuilt
    the code from the polynomials (own F2 bitmask stack, third implementation) reproducing
    k = 12, 72/72 translation automorphisms, single check orbit, and 15/15 pair coverage in both
    sectors with explicit verified witnesses, and re-derived the {i5,i6} suffix-residual
    propagation fact by hand. The retired same-stack ceiling was the only prior bar. Earlier
    history: promoted NUMERICAL -> CERTIFIED* 2026-08-20: independent adversarial review
    (artifacts/circdist_numerical_review_20260820.md, item 3) CONFIRMS the surviving claim
    (d_ext <= 11 universal: 1884-per-sector logical pool reproduced, 15/15 pair coverage in both
    CSS sectors, 6 explicit witnesses) and CONFIRMS the multi-hook mechanism refuting the retired
    parity-rigidity clause (weight-6 six-hook fault set reproduced exactly — 288 detectors silent,
    |E| = 24, E in ker(H_X) minus rowspace(H_Z), R = 1..4 — carried on the reviewer''s repaired
    schedule). CLAIM NARROWED 2026-08-20 after gate G1: the original stronger clause "d_ext in
    {10,11,12} by parity rigidity" was a SINGLE-HOOK-scope statement and is CONTRADICTED by G1''s
    multi-hook mechanism — k disjoint hook residuals inside one weight-12 logical give base weight
    12 - sum(|r_i| - 1), with an end-to-end verified weight-6 witness (six Z-check ancilla faults,
    no data or measurement faults; independent Pauli-frame simulator, no shared code); the cap
    |L ∩ supp(c)| <= 3 for every weight-12 logical bounds each hook''s gain at 2 and is the only
    reason the class stops at 6. The surviving claim (<= 11 universal) stands, now loosely: 70.7
    percent of translation-invariant minimum-depth schedules admit a weight-<=10 witness, 26.1
    percent <= 8. Round-1 groundwork remains valid WITHIN single-hook scope (90 residual sets all
    <= 11, exactly 45 <= 10, structural 5*3*3 explanation). Root consequence unchanged in
    direction but strengthened: D* = 12 requires a positive completion gap, and G1 shows only 15.6
    percent of TI schedules let the cheapest timing-free skeleton close — the gap mechanism is
    live at scale. REVIEW SCOPE for the pending independent review now includes the multi-hook
    correction (rule-7b regime lesson: the single-hook gate family was regime-incomplete and its
    absence claims over-certified).'
  basis:
    reviews:
    - path: artifacts/circdist_numerical_review_20260820.md
      kind: review
      scope: Adversarial independent review (fresh instance, told to refute, no desired verdicts)
        of the narrowed d_ext <= 11 claim and the multi-hook weight-6 mechanism, with the
        reviewer's own simulator; found and repaired the MC-invalidity of the cited schedule.
      locator: Item 3
      reviewed_hash: sha256:4bc0b5eb3b74b174e60f641357f5bea5b9e6a4240c390ced1bf8fd17746bff42
    - path: artifacts/circdist_readjudication_20260823.md
      kind: review
      scope: Canonical-semantics re-adjudication (fresh independent session, no authorship of
        any circdist artifact) — confirms complete argument and full review coverage of every
        load-bearing input; independently rebuilt the Gross code with its own F2 linear algebra
        (k = 12, 72/72 automorphisms, 15/15 pair coverage both sectors, explicit witnesses
        verified zero-syndrome and non-stabiliser) and re-derived the suffix-residual hook fact;
        rules the repaired-schedule caveat a scope note on the retired clause.
      locator: Section 5
      reviewed_hash: sha256:4bc0b5eb3b74b174e60f641357f5bea5b9e6a4240c390ced1bf8fd17746bff42
    runs:
    - path: artifacts/circdist_gross_recon_20260820.md
      kind: run
      scope: Witness-certified enumeration (code inline in the artifact, ~3s) over all 2-element
        subsets of all check supports and all 90 inequivalent residual sets.
      result: Every 2-element subset of every check support lies in a weight-12 logical, hence
        d_ext <= 11 for every schedule; 90 residual sets all <= 11, exactly 45 <= 10; all-ones in
        rowspace(H_X) gives parity rigidity d_ext in {10,11,12}.
    - path: artifacts/circdist_gross_g1_20260820.md
      kind: run
      scope: Full sweep of all 25920 translation-invariant minimum-depth schedules (979 s, code
        inline, translation quotient validated 0/12 mismatches, counts reproduced two ways) plus
        an independent Pauli-frame simulator adjudicating the multi-hook anomaly.
      result: Witness-certified upper-bound histogram 6/8/9/10/11/12 = 360/6408/2324/9232/6068/1528;
        end-to-end verified weight-6 witness; the original parity-rigidity clause refuted at
        NUMERICAL level; absence-side certifications recorded as scope-limited (no reading beyond
        "the TI class is bad" cashed).
    evidence:
    - path: artifacts/circdist_gross_recon_20260820.md
      kind: text
