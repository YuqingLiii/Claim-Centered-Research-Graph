  - {job: drive7.py, pid: 5675, note: inherited pre-FIX-2 driver, left running, since: '2026-08-22',
     status: 'not running; absence reconfirmed 2026-08-28 round 61'}
  # Budget tight: 2 sessions remain after round 2. Round 3 priority: one combined independent
  # review of the two NUMERICAL nodes (dext-cap, gap-example), then bankable write-ups only if
  # the lead raises the cap.
