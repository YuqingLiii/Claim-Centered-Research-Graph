                           # 25 (campaigns 1-3, closed) + 40 new. Per-problem stop-loss boxes:
                           # lift 6, gross 10, cplx 12, sat 10, reserve 2. A problem that
                           # exhausts its box without a level rise gets its minimal residual
                           # written as precise subnodes, downgraded honestly, and yields.
  spent_sessions: 96.0     # 73 previously settled + V3 exact review (round 47) + the
                           # instances-window-edge exact review (round 49) + the authored
                           # sat.window self-contained proof (round 50) + its fresh exact
