id: CIRCDIST.cplx.fixed-d
role: proof
aliases:
- EFFP-FIXED-D
claim: Eff-Preserve with a fixed small constant d is NP-complete under structural restrictions (bounded
  stabilizer weight, bounded Tanner degree, few allowed local CNOT orders per check) — with the restriction
  boundary corrected by the round-1 recon to (d = 3 with order-domain >= 3) or (d >= 4 with binary order-domain),
  since d = 3 with two allowed orders per check reduces to 2-SAT and is in P.
assessment:
  level: PROVED
  caveats:
  - PROVED is bound to the unchanged 390-character claim on sha256:7adfe7c8356f6151e0da203826f9868cb414f193a4dfd5d63721b20e900e91cf
    and the independently reviewed 999-character theorem on sha256:49cf956fe5afa49caa8707f15fd157ab27fedadc79c56bdec0a57c0a89a0e184
    under the frozen single-ancilla terminal-residual V1 model.
  - The disjunctive restriction boundary is met through the d=3, maximum-domain-three arm only. This proof
    does not establish the separate d>=4 binary-order arm.
  - The proved family has d_X=4, d_Z=3, X-generator weight at most 4, Z-generator weight at most 486, Tanner
    degree at most 20, no artificial conflict edges and no optional depth bound T; global serial execution
    realizes every allowed local-order tuple.
  - The canonical increasing block-contiguous Z order is explicitly refuted and is not used. The proof instead
    uses the independently reviewed private-sentinel transform and its singleton Z orders.
  - This result proves fixed-d NP-completeness only. CIRCDIST.cplx.sigma2 remains OPEN and CIRCDIST.cplx remains
    CONJECTURED; the conditional classification route grants no automatic inheritance.
  summary: Fresh independent round-67 exact review clears the complete 999-character private-sentinel theorem
    and proves that it entails the unchanged fixed-d claim through its d=3/domain-three arm. The review
    independently re-derived the terminal-column model, marker-path lemmas, complete one/two-fault Z case split,
    CSS/rank/k and quotient identities, exact distances, preservation of the reviewed X-safe iff, uniform
    constants, total Karp branches and NP membership. Only fixed-d is promoted; the cplx root remains unfinished
    because sigma2 is open.
  basis:
    reviews:
    - path: circdist/reviews/circdist_cplx_fixed_d_private_sentinel_exact_review_20260829.md
      kind: review
      scope: >-
        Fresh independent exact review of the sealed round-66 999-character private-sentinel theorem,
        including the raw block-order counterexample and caveat, terminal-column model, M1-M3 and every
        one/two-fault Z case, CSS/rank/k and both quotient isomorphisms, exact distances, preservation of
        the independently reviewed X-safe iff, uniform constants and explicit order semantics, total
        malformed/empty/nonempty Karp branches, NP membership, theorem-to-claim entailment, independent
        controls, and the no-inheritance boundary.
      locator: Finding F-FULL-FIXED-D
      reviewed_hash: sha256:7adfe7c8356f6151e0da203826f9868cb414f193a4dfd5d63721b20e900e91cf
    evidence:
    - path: circdist/artifacts/history/pre_protocol_20260826/nodes/CIRCDIST.cplx.fixed-d.yaml
      kind: text
      note: Immutable pre-migration record, including every original event, former summary and frontier;
        historical evidence, not an additional completion review.
    - path: circdist/reviews/circdist_islandv_review_20260820.md
      kind: text
      note: Historical event source; see the unchanged pre-migration node for the exact event and its
        scope.
