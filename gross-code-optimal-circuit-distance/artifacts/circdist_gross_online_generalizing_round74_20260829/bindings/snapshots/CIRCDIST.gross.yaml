id: CIRCDIST.gross
role: outcome
aliases:
- GROSS-DSTAR
claim: For the Gross code [[144,12,12]] with single-ancilla CNOT syndrome extraction (interleaving of
  X- and Z-check CNOTs allowed; each required CNOT exactly once; one two-qubit gate per qubit per time
  step; no flag ancillas, cat states, or generating-set changes; idle layers compressed), the optimum
  D*_Gross = max over legal schedules M of d_circ(C(M)) is determined with proof, as either an explicit
  interleaved schedule with certified d_circ = 12, or a proof that every legal schedule satisfies d_circ
  <= 11; and the published conjectured distance-11 circuit has a certified d_circ = 11.
assessment:
  level: CONJECTURED
  caveats:
  - >-
    Do not cite SBB26 Appendix H.2 as proving circuit distance 12 for the original Gross code. Shaw-Terhal
    Table I reports only tilde d_circ <= 12 for a different end-cycle “second gross” code; equality of n=144
    and k=12 (or of the 288-qubit total hardware count) is not code identity or S_Gross membership.
  summary: >-
    The optimal circuit-distance question remains CONJECTURED, with D* in {11,12} unresolved. The
    universal d_ext <= 11 cap is PROVED; the candidate-certification route is CERTIFIED*. The latest completion-gap
    candidate was killed by the missed two-prefix shape. The three recorded no-go classes and search machinery
    are scoped by-products, not a universal proof of D*=11. A fresh primary-source scope audit closes the
    Shaw-Terhal morphing lead negatively: its distance-12-labeled endpoint is a different weight-9 [[144,12,12]]
    “second gross” code with alternating code frames, outside frozen S_Gross, and Table I gives only a BP-OSD
    circuit-distance upper bound <=12. It supplies neither a legal distance-12 witness nor a universal <=11
    no-go. Round 61's proposer-level clean-room audit refutes two further completion screens: absence of all
    four individually gain-positive shapes does not exclude cancelling multi-check weight-10 mechanisms, and
    even a clean |V|=12 / at-most-four-check stratum with diagonal short hooks does not exclude repair-zero
    minimum mechanisms. It also finds that hunt2's j<=4 recursion did not enforce distinct contributing checks;
    the earlier candidate kill survives because its 144 decisive witnesses were separately rebuilt from raw
    schedules. These are filter no-go results, not a universal theorem, so D* remains in {11,12}.
    Round 62 installs a proposer-level unrestricted 864-edge/648-MC CEGAR package with direct-360
    effective and arbitrary-round repair adversaries plus raw replay. Its first 20 exact outer schedules
    are all legal, MC-valid and interleaved, and all are killed in Xerr by verified weight-10 mechanisms;
    20 sound order-region blocks and all 190 prior-block exclusions replay. This is quantitative search
    progress only: no effective-layer UNSAT, repair-layer UNSAT or outer exhaustion was obtained.
    Round 63 adds a proposer-level library of 1,440 globally valid deletion-minimal five-atom
    single-residual order clauses, exhaustively replayed over 103,680 local-order cases with 7,200
    atom-deletion controls. A separate ten-step experiment generated 15,874 witness-checked pair-pattern
    clauses but did not retain the raw ledgers needed for absence use. No checked DRUP/DRAT/LRAT proof
    exists, so the exact residual is unchanged. Round 68 emits complete direct-360 DIMACS for one unrestricted
    clause-saturated candidate, but both sectors are SAT and raw replay to weight-10 Xerr and weight-8 Zerr
    mechanisms. Five continuation candidates are likewise killed in both sectors. Twelve new sound blocks are
    retained, for 1,472 total; no direct absence, repair entry or outer exhaustion exists, so D* remains in
    {11,12}. Round 70's fresh exact review clears the round-69 positive-witness block library as proposer-level
    evidence and licenses strict continuation at outer iteration 6 with 6,212 installed sound blocks. It licenses
    no absence, repair, outer exhaustion, D* narrowing, route change or level change. Round 71 continues through
    iterations 6--29: all 24 outer candidates and all 48 complete direct sectors are SAT and raw-replayed, adding
    48 candidate-exact blocks. The next reviewed-by-dispatcher frontier is iteration 30 with 6,260 blocks; no
    absence, repair, exhaustion or D* narrowing exists. Round 73's fresh exact review clears the round-72
    566-term conservative positive library and iterations 30--41 as proposer-level evidence. The exact continuation
    frontier is iteration 42 with 6,850 installed blocks; no absence, repair, exhaustion, D* narrowing, route change
    or level change is licensed.
  basis:
    routes:
    - candidate-certification
    evidence:
    - path: circdist/artifacts/circdist_gross_round71_generalization_round72_20260829
      kind: run
      note: Sealed round-72 proposer package cleared by the fresh round-73 exact review. It reconstructs all 48
        round-71 mechanisms, 113 local-order catalogs, 607 conservative pair relations and 48 multi-check GF(2)
        relations, retaining 566 new sound generalized terms after exact deduplication/dominance. Iterations
        30--41 are twelve further dual-sector SAT/raw-replayed candidates. The package licenses continuation at
        iteration 42 / 6,850 blocks but no absence, repair, exhaustion, D* or level claim.
    - path: circdist/reviews/circdist_gross_round72_generalization_exact_review_20260829.md
      kind: review
      note: Fresh independent round-73 review with a non-importing 863-line clean-room checker. It validates
        314,668,800 pair cells, 32,031,216 retained physical-selector tuples, all 48 source assignments,
        semantic deduplication from 696 candidates to 566 retained terms, twelve outer schedules and twenty-four
        complete direct SAT/raw replays; verdict CLEAR-PROPOSER-LEVEL-CONTINUATION, with claim, routes, D* interval
        and level unchanged.
    - path: circdist/artifacts/circdist_gross_cegar_continuation_round71_20260829
      kind: run
      note: Sealed round-71 proposer package independently replayed by the dispatcher. Iterations 6--29 contain
        24 legal 864-edge/648-MC outer schedules; both complete unrestricted direct-360 sectors are SAT for every
