routes:
  candidate-certification:
    premises:
    - CIRCDIST.gross.dext-cap
    assumptions:
      sbb-thm1:
        kind: external-theorem
        statement: 'SBB Thm 1 (arXiv:2603.05481, Theorem 1): d_circ of the candidate circuit equals the
          minimum distance of the associated extended code (two 360-column codes, one per sector) — the
          reduction this route''s entire certification rides on. PROOF VERIFIED 2026-08-23 (wave 36, artifacts/circdist_gross_links_review_20260823.md):
          re-derived against the frozen model, scoped to claim (11), R = E, NON-INTERLEAVED schedules,
          no 公共定义 mismatch; two published-proof defects found and closed (double Prop-2-for-Prop-3 mis-citation
          — typo, the needed statement is proved in the paper; the partition-by-idling step false as drawn
          for an LRC, closed by an order-preserving re-timing argument, 0/144 qubits without a consistent
          order). UNUSABLE for interleaved schedules (only the paper''s claim (12) applies there). PDF
          on disk at <home>/Documents/ChatGPT/circcert/papers/.'
        source:
          note: arXiv:2603.05481 Theorem 1; local PDF under <home>/Documents/ChatGPT/circcert/papers/
            (outside this repository).
    implication: Via SBB26 Thm 1 the statement d_circ = 11 for the candidate circuit reduces to an exact
      minimum-distance certification on a 360-column extended code (not a circuit-level DEM search); combined
      with the universal d_ext cap this certifies the first half of the claim and pins the achievable
      floor at 11.
    proof:
      sketch: Finite exact computation with a distance certificate; risk is solver scaling and recovering
        the actual published schedule. Recon P 0.60, D 2 sessions.
      sources:
      - path: circdist/artifacts/circdist_gross_recon_20260820.md
        kind: text
      - path: circdist/artifacts/circdist_gross_sbbcert_20260820.md
        kind: text
    assessment:
      level: CERTIFIED*
      caveats:
      - UNSAT verdicts are solver-grade certificates, not LRAT-checked (no DRAT toolchain on this machine).
      - 'Reconstruction, not authorship: the candidate schedule is the phicert reading of SBB Figure 12
        (pixel-verified wave 13; legality-filter uniqueness re-derived wave 36 over a LARGER space — 72
        readings, one object), not a circuit published as machine-readable data by the authors.'
      - 'The shared colour-map constraint is LOAD-BEARING for uniqueness: with independent per-panel colour
        maps the reading space grows to 528 with 12 extra pairings (wave-36 finding); the frozen reading
        keeps the shared map, as the paper''s construction implies.'
      - SBB Thm 1 is VERIFIED (wave 36) scoped to claim (11), R = E, NON-INTERLEAVED schedules — it is
        unusable for interleaved schedules (only claim (12) applies there); the candidate is non-interleaved,
        so the route is unaffected, but no interleaved conclusion may cite it.
      - The implication text says "a 360-column extended code"; it is TWO 360-column codes, one per CSS
        sector (wave-36 precision note; rewording would rebind the implication hash and is left to a future
        fold).
      - 'Carried from wave 13: the verdict artifact''s cross-checking overstatement stands corrected (114
        truly multiply-decided, not 860; 1026 records, not 3000; max 3 real decisions per sub-query);
        Figure-12 fill-convention conflict recorded and harmless.'
      summary: 'Promoted NUMERICAL -> CERTIFIED* 2026-08-23 (wave 36, artifacts/circdist_gross_links_review_20260823.md):
        the two inherited proposer-grade links are CLOSED — link 3 (phicert legality filter) CONFIRMED
        STRENGTHENED with the reviewer''s own EXHAUSTIVE weight-12 pool (meet-in-the-middle C, 1884/sector
        — the artifacts'' heuristic ISD pool shown exactly complete) and uniqueness re-derived over all
        720 edge-maps per panel at t = 6,7,8 (72 readings, ONE object, pairing invariant, phi forced to
        a + b, no second reading; phicert §2.5''s "moderate" sublattice flag retires); link 4 (encoding
        fidelity) CONFIRMED as an exact reformulation of Def 2/3 (360 columns identical, 216/216 residual
        columns, 60/60 + 60/60 witness round-trips both sectors, 5/5 recorded CNF hashes rebuilt, W =
        11 UNSAT / W = 12 SAT control); and SBB Thm 1''s PROOF IS VERIFIED against the frozen model (scoped:
        claim (11), R = E, non-interleaved; no 公共定义 mismatch) with two published-proof defects found and
        closed — a double Prop-2-for-Prop-3 mis-citation (needed statement proved in the paper), and the
        partition-by-idling step false as drawn for an LRC, closed by the reviewer''s own re-timing argument
        (0/144 qubits lack a consistent order). Verdict clauses (d) d_circ = 11 and (f) D* >= 11 are thereby
        lifted from PARTIAL. HISTORY: promoted CONJECTURED -> NUMERICAL 2026-08-23 by the wave-13 adversarial
        review (990/990 UNSAT reproduced; Figure-12 pixel-verified; d_ext = 11 both sectors).'
      basis:
        reviews:
        - path: circdist/reviews/circdist_gross_links_review_20260823.md
          kind: review
          scope: Wave-36 closure of the two inherited links (exhaustive-pool legality-filter uniqueness;
            encoding-fidelity round-trips and CNF hash rebuilds) plus verification of the SBB Thm 1 proof
            against the frozen model with two published-proof defects closed; licenses the route at CERTIFIED*.
          locator: Section 5
          reviewed_hash: sha256:4f40673227208c58d21650b3d685670019f5460b44ee52c0440b22293eec1598
        - path: circdist/reviews/circdist_gross_verdict_review_20260823.md
          kind: review
          scope: Independent adversarial review of the final compute verdict — analytic 990-slot completeness
            re-derived, orbit partition + equivariance closed, slot bookkeeping recomputed from SHA256-verified
            logs, 3+ adversarial spot re-decisions with a different solver, 50/50 witness re-verification,
            Figure-12 pixel verification at 900 dpi, inherited-links audit, per-clause verdicts with an
            honest downgrade of the verdict artifact's cross-checking claim.
          locator: Per-clause verdicts
          reviewed_hash: sha256:4f40673227208c58d21650b3d685670019f5460b44ee52c0440b22293eec1598
        runs:
        - path: circdist/artifacts/circdist_gross_sbbcert_20260820.md
          kind: run
          scope: Full certification sweep of the group-tiled representative class of the SBB candidate
            on the 360-column extended code, both sectors, symmetry-quotiented SAT decision queries; 10/10
            eliminated-assignment witnesses audited end-to-end.
          result: d_ext <= 10 for all 8 survivors (hence all group-tiled assignments); d_ext(R) = 11 exactly
            for every <= 2-check subset; gross code d = 12 reproduced as method validation; no 6-layer
            gross SEC is measurement-consistent (exact SAT, 55 s).
        evidence:
        - path: circdist/reviews/circdist_sbbcert_review_20260820.md
          kind: text
  gap-via-lift:
    premises:
    - CIRCDIST.gross.dext-cap
    - CIRCDIST.lift.iff
    implication: Given the universal d_ext <= 11 cap, D* = 12 holds iff some interleaved schedule has
      completion gap >= 1 at weight 12; the closed-lift criterion turns this into a voltage/monodromy
      condition checkable per witness family, deciding the second half of the claim in either direction.
    proof:
      sketch: Cross-root import; inherits CIRCDIST.lift risk. Recon P 0.20, D 5 (about 2 sessions shared
        with the lift subtree).
      sources:
      - path: circdist/artifacts/circdist_gross_recon_20260820.md
        kind: text
    assessment:
      level: CONJECTURED
      summary: 'STAGE-2 VERDICT (wave 38): THE CANDIDATE IS DEAD IN BOTH SECTORS — d_eff <= 10, not 11
        (Z: 72 configs at j <= 3, 180 at j <= 4; X: 72/84; zero at weights 8-9; all 144 witnesses re-verified
        from raw CNOT times and re-derived inside the campaign''s 360-column model), killed by the FOURTH
        gain-positive residual shape (the 2-prefix {i1,i2}, = 4-suffix mod stabiliser) which wave 37''s
        d_eff filter missed (it tested 2 of 4 shapes); decisively, every X-memory weight-10 witness has
        exact repair = 1, so d_circ <= 11 for the candidate regardless. REPRICING: P(D* = 12) 0.30 ->
        0.10; P(D* = 11) 0.10 -> 0.15 — three no-go walls now stand at proposer level (check-serial class
        repair-0 PROVED; fully-TI cannot hold d_eff = 11 both sectors; all 297 interleaved re-timings
        of M_cand die on horizontal hooks, 100 percent repair-0). NEW LEMMA D (proposer): d_eff depends
        only on within-check orders, so M_cand''s certification TRANSFERS to its interleaved re-timings
        (up to 504/648 interleaved) for free. D* remains OPEN in {11, 12}, evidence direction tilted toward
        11. STAGE-1 HISTORY (candidate since killed): a 3-colour-tiled annealed schedule — legal, 0/648
        MC violations, 384/648 pairs interleaved, 72/72 hooks diagonal 0 vertical both sectors, no weight-<=10
        configs — has repair-0 on 0/144 (Z) and 0/360 (X) canonical minimum-weight gamma (same-round and
        2-group multi-round), the exact gap signature the PROVED criterion demands. Schedule recorded
        in the hunt artifact. BINDING REMAINING CHECK (stage 2): SAT-certify d_eff = 11 for this schedule
        in both sectors and close the two uncovered |gamma| = 11 shapes (weight-13 provably empty — all
        gross logicals have even weight). Stage-1 no-go by-products: the whole CHECK-SERIAL (global-potential)
        class is PROVED repair-0 (226/226 + 170/170, with the two-line u(S) argument) so cannot gap; no
        fully-TI schedule keeps d_eff = 11 in both sectors (353/400 and 357/400 die on d_eff <= 10) —
        the binding constraint for a gap witness is keeping d_eff UP, not making repair positive. Stage-2
        pricing: P(D* = 12 witness) 0.30, P(D* = 11 no-go) 0.10.'
      basis:
        runs:
        - path: circdist/artifacts/circdist_dstar_hunt2_20260823.md
          kind: run
          scope: 'Stage-2 certification attempt (logs: artifacts/logs_circdist_dstar_hunt2_20260823/,
            45 SHA-summed entries; predecessor logs re-verified 23/23): no SAT solver on the machine,
