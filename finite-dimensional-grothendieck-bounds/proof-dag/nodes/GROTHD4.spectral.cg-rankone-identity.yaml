id: GROTHD4.spectral.cg-rankone-identity
role: constraint
aliases:
- D4-CG-RANKONE-IDENTITY
claim: >-
  For every pure tensor z=e tensor f in E tensor F, if w_30,w_25,w_9 are
  its squared projection norms onto the three Hadamard tensor spectral
  blocks, then w_25-w_9=(1/4)||e||_2^2||f||_2^2. Consequently the pure-tensor
  Hadamard constant is at least c_*=(3 gamma_1+gamma_2)/4>1/720.
assessment:
  level: CONJECTURED
  summary: >-
    A complete author-side exact proof writes the three projectors as
    polynomials in the tensor Gram operator and verifies all 1360 polarized
    biquadratic coefficients over the exact number field. The checker replay
    passes. This strengthens the unrestricted tensor lower bound by more
    than a factor of fifteen, but awaits independent adversarial review.
