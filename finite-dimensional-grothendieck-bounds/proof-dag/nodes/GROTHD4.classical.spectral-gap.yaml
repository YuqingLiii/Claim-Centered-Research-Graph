id: GROTHD4.classical.spectral-gap
role: constraint
aliases:
- D4-SPECTRAL-SIGN-GAP
claim: >-
  For every x,y in {-1,+1}^300, with E=P/75,
  R=A-(5132744330206382+2356560241063596 sqrt(5))E, and
  C=2081044153087351400, one has
  lambda <Ex,Ey> + <(I-E)x,R(I-E)y> <= C.
assessment:
  level: OPEN
  summary: >-
    This is the exact discrete gap left after separating the strict
    four-dimensional top eigenspace. The generic operator-norm estimate for R
    is too weak, so no global sign-profile proof is currently present. The
    simplest top-space sign-lock ansatz is exactly false even on the archived
    equality witness: sign(P by) and sign(P ax) have respectively 37 and 40
    opposite coordinates, plus six zero coordinates each.
  basis:
    evidence:
