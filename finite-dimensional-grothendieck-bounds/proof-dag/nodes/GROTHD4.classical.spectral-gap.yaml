frontier:
  exact-profile-certificate:
    task: >-
      Construct a finite exact certificate for the joint H4 Fourier/projection
      profiles of sign vectors and prove the displayed inequality on every
      resulting cell; record any failed finite ansatz rather than extrapolating it.
    kind: task
    since: '2026-08-29'
  quantitative-hadamard-leakage:
    task: >-
      Supply the final less-than-one-percent spectral correction by coupling
      the nine-dimensional CG weight to the Bell objective, a degree-twelve
      nonradial invariant, or near-extremizer stability. Pure CG geometry now
      covers more than 99 percent, while support size alone is refuted.
    kind: task
    since: '2026-08-31'
  sharp-superlevel-stability:
    task: >-
      Extend the exact archived 217+83 fixed-support bound to all complementary
      support splits, or produce an exact support-changing B>C competitor. The
      archived p and q sign cells are both closed at author level, but the
      unrestricted support-changing case remains open.
    kind: task
    since: '2026-09-07'
