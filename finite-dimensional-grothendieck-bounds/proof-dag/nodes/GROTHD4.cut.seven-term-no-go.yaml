claim: >-
  No integer vector b with exactly seven nonzero coefficients in {-1,+1}
  satisfies b^T M b=307200 for the exact correlation matrix M of the 307200
  currently known C-level cuts. In particular no four-positive,
  three-negative seven-term hypermetric is tight on all those cuts.
