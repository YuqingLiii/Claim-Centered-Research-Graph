claim: >-
  The Boolean target C-x^T A y lies outside the characteristic-zero Gram
  coefficient image for each of the two H4 block sets {8,9,12,13,14} and
  {9,12,13,14,17}. Hence neither minimal five-block enlargement supports a
  degree-four SOS certificate.
assessment:
  level: CONJECTURED
  summary: >-
    Each party-parity Gram domain has 13316 parameters. Exact modular Schur
    ranks plus 467-dimensional true-coefficient residual minors give Gram
    rank 13316 and target-augmented rank 13317 for both block 8 and block 17.
    Thus the target is outside even the indefinite Gram images. The checker
    replay passes, but the author-side theorem awaits independent review and
    does not exclude the six-block or full twenty-block SOS problems.
