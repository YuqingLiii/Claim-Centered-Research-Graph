claim: In the linked Set Equality Lean development, the named analytic and combinatorial fields of SE.SEFrame.Cited
  are replaced by sorry-free theorems from the explicit product definitions, without adding a new quantitative
  estimate as an assumption. The operator layer and the hook-length, Specht-module, and Littlewood--Richardson
  results remain outside this formalization scope.
assessment:
  level: CERTIFIED*
  summary: 'CERTIFIED*. The independent review of 2026-08-17 (`se/reviews/se_lean_t2_review_20260817.md`,
    fresh non-author reviewer) returned PASS-WITH-FIXES with NO blocking mathematical or mechanization
    defect: it reproduced the clean build (exit 0, 3059 jobs), reproduced the 79-declaration axiom census
    byte-identically, verified all 37 SHA ledger entries, re-derived the hook-envelope log bound, the
    one-defect identity and the special-path maximum with exact arithmetic, and confirmed no statement
    was weakened. It also CORRECTED this node''s headline: the fields discharged WITH MATHEMATICAL CONTENT
    are TWO (`rho_ge_one`, `rho_le`), not three — `rhoConst_nonneg` was bookkeeping on a datum this change
    deletes — and the added `rho_hook` is EQUATIONAL, hence strictly stronger than the two inequalities
    it replaces, so the admissible-frame class shrank. Honest headline: net −2 interface fields, purchased
    with one stronger definitional assumption that cites Frame–Robinson–Thrall. PROVED is NOT licensed
    while the discharge rests on an external theorem absent from the Lean development. Underlying run
    evidence: Mechanized run evidence only: a clean, `sorry`-free rebuild (exit 0, 3059 jobs) in which
    `SE.SEFrame.Cited` carries 23 assumption fields instead of the tier-1 25 — `rho_ge_one`, `rho_le`
    and `rhoConst_nonneg` are theorems (`SE/Support/Hook.lean`, `SE/Support/RhoEnvelope.lean`), the carrier
    field `SEFrame.rhoConst` is gone in favour of the explicit `SE.rhoConst = 4`, and one DEFINITIONAL
    field, `rho_hook` (the hook-length evaluation of `rho_d`), was added in their place. `SE.denom.taper.Claim`
    now renders all three frozen conjuncts (ruling R2 discharged). Every `composition` theorem and `SE.goal.composition_via_br`
    still typecheck, and the three non-vacuity models still satisfy `Cited` with H1-H4. 79 declarations
    printed by `#print axioms`, all exactly [propext, Classical.choice, Quot.sound]. This level records
    mechanization, not mathematics: no completion tier may be written here until an INDEPENDENT reviewer
    has checked the no-weakening claim field by field against the tier-1 baseline (frontier task-005).
    It establishes nothing about H1-H4 and does not change the conditional status of Theorem B.


    TIER 2b (same day, frontier task-003/task-004/task-005, EXECUTOR-AUTHORED AND UNREVIEWED - see the
    scope caveat below). `Cited` went 23 -> 21 assumption fields. FOUR more fields became theorems, all
    with their tier-1 binders and conclusions verbatim: `omega_le` (the manuscript''s two-sided range
    eq:omega-range, which it calls "the reviewed-proved range"), `omega_pos`, `rtop_le_rho` and `rtop_pos`.
    They are proved from `p_0` DEFINED by its hook ratio in conjugate coordinates (`SE/Support/Omega.lean`:
    the top hook is 1, one telescoping over `Finset.Ico theta_1 (q-j-1)` reduces `1/p_0` to `q/(q-j-theta_1)
    * prod_{c<=theta_1}(1-1/h_c)`, and two further telescoping majorants give `j/q <= omega <= j/(q-2j)`,
    with equality at j = 1 so that no lossy MAJORANT STEP is admissible - a statement about the STEPS,
    not about both ends of the range: the UPPER end is attained (at j = 1, omega = 1/(q-2) exactly) while
    the LOWER bound j/q is attained in 0 cases in one exact-rational sweep (re-run and reproduced; independently
    corroborated by the task-013 reviewer''s own branching-rule sweep, 11219 triples, agreeing), and only
    its POSITIVITY is load-bearing (wording corrected 2026-08-17, frontier task-008)), and from the new
    theorem that the hook product is MAXIMIZED by the single row (`SE.rtopHook_le_rowShape`), which upgrades
    tier 2a''s attainment field `rho_hook` to the `IsGreatest` field `rho_isGreatest`. Two DEFINITIONAL
    fields were added: `sector_hook` (the sector''s shape datum is a shape of j, and its `r_top` and `omega`
    ARE the hook expressions) and `admissible_window` (`1 <= j` and `3j <= n`, the paper''s own standing
    window for admissible strict sectors). `SEFrame` gained two CARRIER data, `shapeLen`/`shapeCol` (the
    sector''s shape theta), 19 -> 21. All three SelfTest models were reworked onto genuine hook values
    and still satisfy `Cited` with H1-H4; `channelFrame` is still non-degenerate, now with its sector
    compression positive BECAUSE the lower half `j/q <= omega` is proved. Clean rebuild exit 0, 3061 jobs,
    no sorry, no added axiom, no native_decide, 124 declarations printed by `#print axioms`, all standard.
    Review fixes F1-F5 and F7 applied. `goal.Claim` is unchanged.'
