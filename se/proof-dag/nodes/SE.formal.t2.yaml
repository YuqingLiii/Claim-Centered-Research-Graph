  caveats:
  - The hook-length formula (Frame-Robinson-Thrall) is CITED, not formalized. It is the sole content of
    the added rho_hook field and therefore the sole thing the discharged estimates rest on.
  - rho_ge_one had its scope narrowed to d < K n, the hypothesis both call sites already carry. Declared,
    not silent.
  - c = 4 is fixed in denom/br/goal.Claim. Asymptotics unchanged (same constant 9/(18+4sqrt6+3sqrt10),
    same n >= 27, same eps_n -> 0), but the finite-n guarantee is 0.43x/0.71x/0.96x the c = 0 instance
    at n = 27/1e3/1e6. The smallest constant the data support is about 0.219, so 4 is valid but loose.
    (Review fix F2, recorded 2026-08-17.)
  - SE.denom.taper.Claim gained a conjunct, so denom.composition has a strictly stronger hypothesis than
    tier-1. Harmless because taper.holds is unconditional, but it is a statement change the executor report
    had omitted.
  - 'pending-review: authored by the executor; the current review-gated promotion rule bars a completion tier until
    an independent review is archived on disk and cited here.'
  - 'SCOPE OF THE CERTIFIED* LEVEL (2026-08-17, tier 2b). The archived independent review se/reviews/se_lean_t2_review_20260817.md
    examined the TIER-2a delivery (Cited 25 -> 23). The tier-2b increment of the same day (Cited 23 ->
    21: omega_le, omega_pos, rtop_le_rho and rtop_pos discharged; rho_hook sharpened to rho_isGreatest;
    sector_hook and admissible_window added; the three SelfTest models reworked) is EXECUTOR-AUTHORED
    AND NOT YET REVIEWED. Its own evidence is mechanized only (clean rebuild exit 0, 3061 jobs, 124 axiom-clean
    declarations), which the current evidence-level rules caps at NUMERICAL. The node level was left at CERTIFIED*
    on the commissioning instruction; read it as CERTIFIED* for the tier-2a delivery and NUMERICAL/pending-review
    for the tier-2b increment until frontier task-007 is discharged.'
  - 'TIER 2b, added assumption strength, declared. (i) rho_isGreatest is the IsGreatest form of tier 2a
    rho_hook on the wider window d < n: strictly stronger than the attainment form, so the admissible-frame
    class shrank again. It is satisfiable and satisfied: SE.rowShape is proved to be the maximizing shape
    (SE.isGreatest_rtopHookSet), and all three SelfTest models carry it. (ii) sector_hook is one field
    bundling three conjuncts (the sector shape datum is a shape of j; r_top and omega ARE their hook expressions).
    THE COUNT REPORTED IS THE FIELD COUNT: Cited carries 21 assumption fields (23 - 4 discharged + 2 added)
    and SEFrame carries 21 carrier data. The conjunct-level arithmetic previously offered beside it ("23
    - 4 + 4 = 23 conjunct by conjunct") is WITHDRAWN as of 2026-08-17 (tier-2b review fix 4, frontier
    task-008): it was not the conjunct count either, because sector_hook is not the only bundling field
    - rho_isGreatest unfolds to two conjuncts (IsGreatest S a = a in S AND a in upperBounds S) and admissible_window
    to two (1 <= j AND 3j <= n), and an honest conjunct ledger would have to unfold every surviving tier-1
    field as well. One number is reported, not two. What is invariant under any counting convention, and
    is the fact that matters: NO conjunct added at tier 2b is QUANTITATIVE - each is a definitional identification
    (sector_hook), a maximality statement about the same hook expressions (rho_isGreatest), or the manuscript''s
    own standing admissibility window (admissible_window). None is an estimate, a numerical constant,
    or a bound taken on trust. (iii) admissible_window assumes 1 <= j and 3j <= n for admissible sectors:
    n >= 3j is literally in the papers admissibility definition, and j = k-1 >= 1 is the displayed standing
    hypothesis of the project proof record where those sectors are defined. Without it omega_pos is FALSE
    under the hook evaluation, since omega = 0 at j = 0.'
  - 'TIER 2b, no weakening: all 18 tier-1 Cited fields that survive to tier 2b have BYTE-IDENTICAL statements
    (se/artifacts/logs_se_lean_t2b_20260817/interface_field_census.txt), and the four fields discharged at
    tier 2b became theorems with their tier-1 binders and conclusions unchanged - no scope narrowing was
    needed, because admissible_window supplies the window from admissibility itself. goal.Claim still
    concludes the same constant 9/(18+4sqrt6+3sqrt10) over the same range n >= 27 with the same eps_n
    -> 0 (goal.lean was not touched at tier 2b).'
  - 'The discharge rests on ONE cited external fact, named in the Lean interface: the Frame-Robinson-Thrall
    hook-length formula (absent from Mathlib v4.31.0), plus the attainment of a maximum over the partitions
    of d. Nothing quantitative is assumed.'
  - 'Declared scope narrowing: `rho_ge_one` was assumed for all (n,d) at tier 1 and is proved for d <
    K n at tier 2; both of its call sites already carry that hypothesis, so the tier-1 chain is unchanged.
    See se/artifacts/se_lean_t2_20260817.md section 3 item 5.'
frontier:
  task-012:
    task: 'The successor of task-010(b), registered rather than dropped when task-010 closed (2026-08-17).
      The 15 surviving check-4 WARNs of `tools/lean_dag_check.py --problem se` are the honest residue
      of rulings R3/R4 and are ACCEPTED as WARNs, not repaired: check 4 declares itself a TEXTUAL APPROXIMATION
      ("a sound check needs elaboration") and looks for a child''s name inside the composition theorem
      text, so a premise that legitimately arrives as an `Interface.Cited` field or as an imported grandchild
      has no such name to find. The DECISION taken today is that no severity change and no textual patch
      is defensible; what would actually close it is one of exactly two things, and this task is to do
      one of them: (a) elaboration-level checking - resolve each composition theorem''s binders through
      the Lean environment (e.g. a `lake env lean` script emitting the hypothesis types) and compare THOSE
      against the route premises, or (b) extend the task-006 declaration channel to check 4, i.e. a per-premise
      `premise-in-composition-as: <child> - <the Cited field or parameter that carries it>` entry, with
      the same anti-rubber-stamp hygiene the `rel` check already enforces. Option (b) is bookkeeping and
      would make the checker''s coverage honest without deciding anything mathematical; option (a) is
      the real check. Neither is a severity change.'
    kind: task
    since: '2026-08-17'
  task-014:
    task: 'Second-generation checker soft spots found by the task-013 review''s own probes (`se/reviews/se_frontier_review_20260817.md`,
      R1-R5; it would gate the next promotion on R1, R3, R5). R2/NEW-1: the F1 gate is a SYNTAX tax, not
      a substance gate - a mechanism of eight backticked `q`s clears 24 chars / 8 words / 8 anchors at
      0 FAIL, so fold NEW-1 into the F2 relevance disclosure instead of claiming F1 closed junk. R3/NEW-5:
      `descendants_of()` walks all route premises without consulting `route_disabled_reason()`, so an
      `import-not-child` licence can be earned across a section-4-DISABLED route (probe imported the REFUTED/DEAD
      `trace.r1` at 0 FAIL); gate it with the predicate the tool already factored out for checks 5/7c,
      or FAIL when the imported subject is REFUTED. Latent - no live instance today. R5 and the remaining
      items are enumerated in the review.'
    kind: task
    since: '2026-08-17'
  task-015:
    task: 'THE FUNDAMENTAL LIMIT of hash-based anti-drift, to be stated in the formalization synchronization rule rather
      than left as a review finding (task-013 review, probe NEW-4). A MEANING change can be laundered
      past the ENTIRE machinery with a fully self-consistent re-sync: the probe narrowed SE.br''s claim
      to n >= 10^6 and then updated `claim_hash`, `source_claim_hash`, the module''s FROZEN CLAIM text
      AND its header digest - 0 FAIL, exit 0. No hash check can catch this by construction, because every
      record agrees; only a human-or-independent-reviewer judgement on whether the claim still says the
      same thing can. Consequence to record: the section-7 hash gates prove SYNCHRONY, never FIDELITY,
      and a re-sync event must therefore always carry an explicit meaning-vs-wording judgement (which
      the two Class-A clearances of 2026-08-17 did carry, per commission - that discipline is now load-bearing,
      not optional).'
    kind: task
    since: '2026-08-17'
