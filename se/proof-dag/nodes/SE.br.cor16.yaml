    premises:
    - SE.br.def
    - SE.br.num
    - SE.denom.decomp
    - SE.denom.X
    - SE.denom.Y
    - SE.denom.Phi.ambient
    - SE.denom.Phi.legal.diag
    - SE.denom.crossk
    - SE.denom.familysplit
    - SE.denom.taper
    implication: For q=2n, the witness definition, numerator bound, legal three-channel decomposition,
      ambient and legal channel estimates, exact-defect regrouping, family identification, and taper arithmetic
      establish ||Gamma_n o Delta_i|| <= (sqrt(6)/2+o(1))n^(1/6) uniformly in i. Together with ||Gamma_n||>=K,
      this gives the quantified adversary lower bound stated by the parent node.
    proof:
      sketch: The repaired certification assembles the listed reviewed components into the uniform denominator
        estimate and divides the numerator by that estimate.
      sources:
