id: SE.br.cor16
role: outcome
aliases:
- COR
claim: For every epsilon>0 there exists N(epsilon)>=8 such that, for every n>=N(epsilon), the explicit
  legal witness Gamma_n at q=2n satisfies Adv+-(SE(n,2n)) >= (2/sqrt(6)-epsilon)n^(1/6). Consequently,
  Q(SE(n,2n))=Omega(n^(1/6)).
assessment:
  level: PROVED
  summary: The explicit Omega(n^(1/6)) witness and its quantified lower bound passed certification and
    an independent re-review after the recorded mathematical correction. The linked reviews cover normalization,
    numerator and denominator estimates, constants, symmetry, and quantifiers.
  basis:
    reviews:
    - path: se/reviews/se_cor16_certification_20260723.md
      kind: review
      scope: Certifies the explicit Omega(n^{1/6}) adversary ratio using the final A.2 and A.4 identities,
        including normalization, numerator, denominator, symmetry, constants, and quantifiers.
      locator: Phase A, Phase B, Verdict, and Amendments
      reviewed_hash: sha256:64c73e45aed6e2da1588506129d28c5e37530a1097ec3e96dd334d844eb3177a
    - path: se/reviews/se_external_rereview2_20260730.md
      kind: review
      scope: Rechecks the complete repaired Theorem-A proof chain and confirms the explicit Omega(n^{1/6})
        result without reservation; later findings concern notation and reproducibility metadata, not
        this theorem.
      locator: Section T3'.1
      reviewed_hash: sha256:64c73e45aed6e2da1588506129d28c5e37530a1097ec3e96dd334d844eb3177a
    routes:
    - assembled-witness
routes:
