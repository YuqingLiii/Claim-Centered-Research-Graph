id: SE.br.num
aliases:
- NUM
claim: For q=2n and K=floor(n^(1/3)), let Gamma_n be the legal tapered witness defined in SE.br.def, and
  let 1_N and 1_Y be the unit constant vectors. Then Gamma_n 1_N = K 1_Y, and hence ||Gamma_n|| >= K.
  This is proved directly at q=2n in the linked claim-level proof and review; no large-alphabet illegal-row-removal
  argument is used.
assessment:
  level: PROVED
  summary: The claim is supported by the linked evidence and independent review.
  basis:
