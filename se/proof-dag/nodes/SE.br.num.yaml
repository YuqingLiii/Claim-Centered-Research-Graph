    - path: se/reviews/se_cor16_review_20260718.md
      kind: review
      scope: Independently derives Gamma_n 1 = K 1 and hence the numerator norm lower bound, with the
        exact q=2n normalization separated from the large-alphabet citation.
      locator: Section 2 and Per-step verdict row 2
      reviewed_hash: sha256:4f7d3d64da92522f918a7dfc1f45bf4cb0a8a5f7ecd444bdd0b9216ed1773345
