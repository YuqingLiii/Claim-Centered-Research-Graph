id: SE.denom
aliases:
- DEN
claim: 'SE.denom — max_i ||Gamma o Delta_i|| = O(1) : THE OPEN PROBLEM (AND)'
routes:
  joint:
    premises:
    - SE.denom.decomp
    - SE.denom.X
    - SE.denom.Y
    - SE.denom.Phi
    - SE.denom.familysplit
    - SE.denom.crossk
    - SE.denom.taper
    - SE.denom.assembly
    implication: 'decomp AND X AND Y AND Phi AND familysplit AND crossk AND taper AND assembly imply denom:
      the legal diamond representative splits into the X/Y/Phi channels (decomp, familysplit); blocks
      of distinct alphabet defect are mutually orthogonal on both sides (crossk), so the norm is the maximum
      over defects of a per-defect sum bounded termwise by the channel estimates (X, Y, Phi) weighted
      by the taper coefficients (taper); the aggregation and the resulting absolute constant are the envelope
      calculus (assembly). Hence max_i ||Gamma o Delta_i|| = O(1) once the Phi channel is O(1).'
    proof:
      sketch: inline (## Composition proof); executed instance for the unconditional envelope = se/reviews/se_cor16_certification_20260723.md
        A.27-A.31 (Phase A, from-scratch)
      sources:
      - path: se/reviews/se_cor16_certification_20260723.md
        kind: text
    assessment:
      level: PROVED
      summary: se/reviews/se_cor16_certification_20260723.md (rule-7 CERTIFY, from-scratch re-derivation)
        + se/reviews/se_human_review_20260719.md sec 8.5 (envelope calculus CONFIRMED) + se/reviews/se_external_rereview2_20260730.md
      basis:
        reviews:
        - path: se/reviews/se_human_review_20260719.md
          kind: review
          scope: Human cross-stack review identifying the unresolved transport, Gram, twirl, orbit, sandwich,
            and quantifier gaps in the attempted O(1) denominator route; retained as adversarial evidence,
            not as a positive discharge of those gaps.
          locator: Sections 1--7 and Final decision
          reviewed_hash: sha256:c188bcb6b6b2f0b5a032198c3e2f8da9fa546a96aaab24c30f3743e0c277bc40
        - path: se/reviews/se_external_rereview2_20260730.md
          kind: review
          scope: Checks the conditional channel assembly, constants, and absence of a hidden fifth obligation,
            while keeping the four unresolved Phi premises explicit.
          locator: Sections T2'.1--T2'.2 and T3'.1
          reviewed_hash: sha256:c188bcb6b6b2f0b5a032198c3e2f8da9fa546a96aaab24c30f3743e0c277bc40
      caveats:
      - the mask factor 2 (equal-symbol part) is part of this aggregation and is proved in the certification,
        A.10
assessment:
  level: OPEN
  summary: The denominator claim remains OPEN because the legal Phi channel is unresolved. The linked
    evidence proves the X and Y channels and the unconditional n^(1/6) envelope, but not the target O(1)
    denominator.
  basis:
    routes:
    - joint
  caveats:
  - The linked Lean formalization checks a conditional denominator composition and does not establish
    the OPEN Phi obligations.
