id: SE.goal
aliases:
- GOAL
claim: 'SE.goal — explicit optimal neg-weight adversary witness for SE at q=2n

  Adv± >= ||Gamma_n||/max_i||Gamma_n o Delta_i|| = Omega(n^1/3); Theta(n^1/3) known (Zhandry), witness
  missing'
routes:
  SE.br:
    premises:
    - SE.br
    implication: If the explicit legal matrix Gamma_n is an admissible adversary matrix for SE(n,q=2n)
      and Branch A's ratio bound holds for it, then Adv±(SE(n,2n)) >= that bound; hence Omega(n^{1/3})
      with an EXPLICIT witness, which is the goal.
    assumptions:
      assumption-01:
        kind: external-theorem
        statement: 'Interface: the negative-weight adversary method — Adv±(f) >= ||Gamma||/max_i||Gamma
          o Delta_i|| for ANY admissible Gamma (Hoyer-Lee-Spalek); cited, not reproved here'
        source:
          path: se/lean/SE/Interface.lean
          kind: text
          locator: The `adv_ge` field and its cited adversary-bound documentation
    proof:
      sketch: 'inline (this file, ## Composition proof) + se/reviews/se_cor16_certification_20260723.md
        A.33 for the executed instance'
      sources:
      - path: se/reviews/se_cor16_certification_20260723.md
        kind: text
    assessment:
      level: PROVED
      summary: se/reviews/se_external_rereview2_20260730.md (confirmed the instance without reservation)
      basis:
        reviews:
        - path: se/reviews/se_external_rereview2_20260730.md
          kind: review
          scope: Checks that an explicit legal witness with the four conditional Phi obligations would
            yield the target Omega(n^{1/3}) adversary bound; it does not assert that those obligations
            are already proved.
          locator: Sections T2'.1--T2'.2 and Summary verdict
          reviewed_hash: sha256:59d11c0e494782d0ae566b48a4b483a97de342998f8eeaa4d1e832143fa34f9c
  SE.ros:
    premises:
    - SE.ros
    implication: If the Rosmanis transfer produced an admissible q=2n adversary matrix with ratio Omega(n^(1/3)),
      the explicit negative-weight witness goal would follow.
    assessment:
      level: OPEN
      summary: The route is disabled because its premise is REFUTED; the implication itself has not been
        refuted.
      basis:
        evidence:
        - node: SE.ros
          kind: node-evidence
      caveats:
      - The premise is REFUTED, so this route is disabled; the implication itself was not refuted and
        was reset to OPEN during current assessment.
  SE.mdh:
    premises:
    - SE.mdh
    implication: If the matrix dual-Hahn family yields an admissible witness with ratio Omega(n^{1/3}),
      the goal follows by the same adversary interface.
    assessment:
      level: OPEN
      summary: No additional supporting evidence has been recorded for this route.
  SE.sdp:
    premises:
    - SE.sdp
    implication: If the SDP route certifies an explicit optimal witness at q=2n, the goal follows.
    assessment:
      level: OPEN
      summary: No additional supporting evidence has been recorded for this route.
  SE.jz:
    premises:
    - SE.jz
    - SE.goal.hyp.se-jz.01
    implication: If the Jeffery-Zur reduction yields an explicit MULTIPLICATIVE-adversary witness, the
      goal follows ONLY after a transfer to the additive Adv± setting; without that transfer the route
      resolves a variant, not this goal.
    assessment:
      level: OPEN
      summary: No additional supporting evidence has been recorded for this route.
assessment:
  level: OPEN
  summary: The explicit optimal-order witness remains OPEN. The reviewed Omega(n^(1/6)) witness is retained
    in SE.br.cor16, while the Omega(n^(1/3)) construction remains conditional on H1--H4 and the foundation/interface
    layer. Failed Rosmanis and trace shortcuts do not refute the goal.
  basis:
    evidence:
    - node: SE.related.collision
      kind: node-evidence
    routes:
    - SE.br
    - SE.mdh
    - SE.sdp
    - SE.jz
  caveats:
