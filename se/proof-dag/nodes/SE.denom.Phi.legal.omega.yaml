    premises:
    - SE.denom.Phi.legal.omega.interface
    - SE.denom.Phi.legal.gram
    - SE.denom.Phi.legal.sect
    implication: 'omega.interface (H3) together with the canonical Gram bound and H4 implies this node''s
      omega-decay consequence: the exact sandwich C*C = C_N^{1/2} G_can C_N^{1/2} with the full-multiplicity
      NO polar C_N = r_top*omega*I, plus ||G_can|| <= (15/4) r_top and omega <= j/(2(n-j)), gives the
      PER-SECTOR bound ||C~_{lambda,xi}||^2 <= (15/8) r_top^2 j/(n-j); the GLOBAL bound with rho_j = max_theta
      r_top then requires H4 (sect) and is not obtainable from the sandwich alone.'
