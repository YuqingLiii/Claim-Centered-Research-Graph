id: SE.denom.Phi.legal.omega
aliases:
- OMEGA
claim: For q=2n, each admissible sector satisfies ||C~_(lambda,xi)|| <= sqrt(15/8) r_top(2n,j,theta) sqrt(j/(n-j)).
  After the sectorization lift, the global block satisfies ||C_(j+1->j)|| <= sqrt(15/8) rho_j sqrt(j/(n-j)),
  where rho_j=max_(theta partition j) r_top(2n,j,theta).
