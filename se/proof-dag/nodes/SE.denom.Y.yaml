          kind: review
          scope: Checks exact-defect pinning, equivariance transport, matched-degree legality factors,
            and the Y-line passage from the ambient stay-channel bound to the legal restriction.
          locator: Per-step table and Sections 5--6, Y-line corollary
          reviewed_hash: sha256:e763fce4c1522af7d6ebd6116084cc3a2d10d76a6965d9a44ed5e6d7b38e7eac
        - path: se/reviews/se_external_rereview2_20260730.md
