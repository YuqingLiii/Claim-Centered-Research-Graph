id: SE.denom.Y
aliases:
- CY
claim: For every relevant n and k, legal restriction of the stay channel satisfies ||R(Ybar_k)||<=rho_(n,k)sqrt(2)sqrt(k/n).
routes:
  joint:
    premises:
    - SE.denom.Y.ambient
    - SE.denom.bridge2
    implication: 'Y.ambient AND bridge2 imply Y: the ambient child bounds the stay-channel operator Ybar_k
      (the sqrt(2k/n) partner-count factor); Bridge II''s Y-line converts it to the legal bound ||R(Ybar_k)||
      <= rho_{n,k}*||Ybar_k|| <= rho_{n,k}*sqrt2*sqrt(k/n).'
    proof:
      sketch: se/artifacts/se_bridge2_pin_20260718.md (Y corollary); independently re-derived in se/reviews/se_cor16_certification_20260723.md
        A.19 (principal-sector argument, exact 2d/n partner count)
