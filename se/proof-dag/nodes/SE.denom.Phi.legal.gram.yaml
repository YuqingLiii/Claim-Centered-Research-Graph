id: SE.denom.Phi.legal.gram
aliases:
- GRAM
claim: For q=2n, every matching-averaged Belovs-Rosmanis block G_can^(lambda,xi), as defined before any
  identification with the actual legal lower block, satisfies ||G_can^(lambda,xi)|| <= (15/4) r_top. Hence
  ||G_can^(lambda,xi)|| < 9/2 whenever r_top < 6/5. The identification with the actual legal lower block
  is a separate obligation recorded at SE.denom.Phi.legal.splice.
routes:
  joint:
    premises:
    - SE.denom.Phi.legal.gram.interface
    - SE.denom.Phi.legal.trace.t6
    implication: 'gram.interface (H2) together with the T6 multiplicity bound implies this node''s canonical
      Gram consequence: from G_can^full|_{H_xi} = I_{V_kappa (x) V_nu} (x) [r_top/(B_theta(q)^2 omega)]
      M_xi and M_xi <= (15/4) B_theta(q)^2 omega I_c, the positive scalar and the norm-preserving identity
      lift give ||G_can^{lambda,xi}|| <= (15/4) r_top — NON-STRICT. Strict < is available only where r_top
      < 6/5 (sufficient condition: the active taper n >= (j+2)^3), NOT from H1+H2 alone.'
    proof:
      sketch: The implication is supported by the linked review and linked Lean formalization.
    assessment:
      level: CERTIFIED*
      summary: se/reviews/se_external_rereview2_20260730.md T1'-3 (the non-strict repair and the corrected
        r_top<6/5 criterion both verified)
      basis:
