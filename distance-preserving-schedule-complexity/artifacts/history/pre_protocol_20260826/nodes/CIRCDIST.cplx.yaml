      discharged the commissioned warm-up gadget ([[9,1,3]], 16/24 safe orders — unary, hence not
      decisive), corrected the commissioned hardness restriction (2-SAT tractability), registered
      the controllable-coupling-gadget as the decisive gate, and raised the node OPEN ->
      CONJECTURED on the registered blueprint.
    sources:
