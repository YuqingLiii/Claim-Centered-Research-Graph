      kind: text
  interaction-model-pinned-2026-08-23:
    date: '2026-08-23'
    type: repair-applied
    summary: 'LEAD RULING (2026-08-23, "可以" on the dispatcher recommendation): the
      interaction model for schedule legality in this problem is PINNED to QUBIT-SHARING ONLY —
      two CNOTs conflict iff they share a qubit, i.e. exactly the frozen 公共定义 reading (one
      two-qubit gate per qubit per time step); arbitrary conflict graphs are OUT of the
      canonical problem. Rationale recorded: consistency with 课题一/二/四 (which already live
      in this model, and cross-root imports exist); no existing result is lost (all islands and
      gadget constructions are realised through actual code structure, hence already live in
      the qubit-sharing model); hardness theorems in the physical model are strictly stronger.
      Any future hardness work in the arbitrary-conflict-graph model is a separate,
      non-canonical variant and must say so. This closes the round-2 pending lead decision.'
    sources:
    - path: research/circdist/notes/SCHEDULER.yaml
      kind: text
