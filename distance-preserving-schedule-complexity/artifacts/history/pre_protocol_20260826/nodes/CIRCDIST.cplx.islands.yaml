id: CIRCDIST.cplx.islands
role: proof
aliases:
- EFFP-ISLANDS
claim: Nontrivial restricted classes of Eff-Preserve are in P (or FPT) with proven correctness —
  including factorising instances (no inter-check coupling; self-certifying), HGP codes (every
  schedule preserves d_eff >= min(mu_X, mu_Z), so constant YES under the non-degeneracy proviso),
  bounded-treewidth Tanner graphs (CMSO2/Courcelle FPT), and d = 3 with two allowed orders per
  check (2-SAT, no check-weight bound).
assumptions:
  courcelle-c1:
    kind: external-theorem
    statement: 'C1: Courcelle''s theorem — CMSO2-definable properties are FPT-decidable on
      bounded-treewidth structures. Carries the Island III clause (a plain Boolean CMSO2
      sentence; the former "optimization extension" wording was over-registration, struck —
      unused by the argument). PRIMARY-VERIFIED 2026-08-23 via two disjoint chains
      (artifacts/circdist_courcelle_primary_20260823.md): [Cou90] Courcelle, Inform. and
      Comput. 85 (1990) 12-75, full text read — Theorem (4.4) (every definable subset
      effectively recognizable) + Proposition (4.14)(1) (deciding phi in CMS in O(size(e))
      given a width-m expression); note its parameter is HR-expression width, not "tree-width"
      by name. [CE12] Courcelle-Engelfriet, EMA 138 — CITED EDITION: the April 2011 authors''
      pre-publication draft (labri.fr; print pagination unobtainable, wave-30 ruling: cite by
      number-and-name, pages surplus) — CORRECTED LOCATOR: Theorem 6.4(1) (draft p. 429, CMS2
      model-checking FPT-linear in (twd(G), phi), no supplied decomposition needed) with
      Theorem 5.68(2) (draft p. 397) and Definition 5.17 (draft p. 345); the previously
      pinned Prop 5.13 is an MS1 INEXPRESSIBILITY result of opposite polarity (the book''s
      motivation for edge-set quantification) — mis-citation caught only by reading the
      statement. [ALS91] J. Algorithms 12(2) 308-340: bibliographic data exact (DBLP +
      publisher DOI), full text unobtainable, theorem numbers unverified — DEMOTED to
      corroborating, immaterial: not load-bearing, its role discharged twice by the
      fully-read texts. Island III assumes LESS than these grant. R4 EDITS APPLIED
      (2026-08-23, per Amendment 5 + its re-review): the CE12 verification read the
      April-2011 authors'' draft, not the print EMA 138 — page numbers may shift in print;
      the HR-expression-width-to-treewidth bridge is registered via CE12 Thm 2.83 with the
      amendment''s hedge (2.83 converts a tree decomposition to an HR term; the wave-18
      artifact describes rather than quotes it, and the Island III route actually taken —
      CE12 Thm 6.4(1) — does not use it); "two disjoint chains" corrected to one chain plus
      corroboration.'
    source:
      path: artifacts/circdist_courcelle_primary_20260823.md
      kind: text
      locator: Per-citation verdicts
  def-13prime-em:
    kind: model-fact
    statement: 'Definition 1.3-prime (Amendment 5 §1): E(M) is the standard hook-error
      extended code — the write-up itself never defined E(M). ADJUDICATED NON-ISSUE by the
      Amendment-5 re-review (no lead ratification needed): 公共定义 lines 31/35/37 (d_circ
      counts |F|; d_eff <= d_circ; equality non-interleaved) plus 课题二 lines 97-98 pin both
      scope-note conditions, and the weight-reading is excluded by line 35; the two variant
      encodings (adding chi_supp columns; one joint matrix) are identical on all 32 biting
      triples. Registered for machine visibility per the re-review''s instruction.
      LEAD-RATIFIED 2026-08-23 (verbatim: "批准 Definition 1.3′") — the definitional pin now
      carries both the reviewer''s from-the-frozen-text adjudication and an explicit lead
      ratification; no residual of any kind remains on this interface.'
    source:
      path: artifacts/circdist_islands_amendment5_review_20260823.md
      kind: review
      locator: Section 2
assessment:
  level: PROVED
  caveats:
  - 'Shared model design is not independence (systemic, permanent): every implementation in
    this node''s verification chain — dossier, five reviews, three independent bridge
    implementations — re-implements the same frozen 公共定义 fault menu and (M4) terminal
    boundary; a systematic model-vs-real-compiler mismatch would survive all of them. NO stim
    cross-check exists anywhere in this node''s history. The 2026-08-25 stim cross-validation
    (artifacts/circdist_stim_crossval_20260823.md) validated the SHARED 公共定义 fault menu
    and (M4) terminal boundary against stim 1.16.0 on the lift and sat arms — including a
    direct demonstration that the (M4) ideal-readout boundary is not load-bearing for d_circ —
    but built NO island gadget and NO reduction instance, so this node''s own constructions
    remain stim-untouched.'
  - 'Island V stays OUT of the claim (task-004): the wave-19 Steane refutation stands and the
    Amendment-5 corrected V clause was itself found defective (dropped "choice-free").'
  - All four islands are V1 statements (no depth bound) and are about d_eff, not d_circ;
    Island IV additionally excludes the (Lambda-timing) reading.
  - Island I is polynomial only for fixed d and bounded w; Corollary I.1-prime component 1 is
    the NP-hard distance problem at general d; the clause parenthesis carries no qualifier of
    its own.
  - 'Island II: Theorem II.4''s own hypothesis is a distance condition, not poly-time
    checkable; only Lemma II.5''s proviso is; the necessity witness (46/1971) was not
    reproduced by the wave-30 reviewer.'
  - 'Island III: f(t,w,d) is non-elementary (Frick-Grohe), possible near-vacuity at growing d;
    the hypothesis is on the Tanner graph, not a layout; Phi_{t,w,d} is the dossier''s own
    construction, read not re-derived by the wave-30 reviewer.'
  - 'C1 citation layer: [ALS91] full text unobtainable (immaterial, corroborating only);
    [CE12] print-edition numbering unverified — the April-2011 draft is the cited edition
    (wave-30 ruling: protocol wants a theorem, not a page).'
  - Islands I and III were not re-computed by the wave-30 reviewer (I by wave-19 own-code;
    III adjudicated on the amended text + the primary-source verification).
  summary: 'Promoted CERTIFIED* -> PROVED 2026-08-23: the wave-30 end-to-end four-island pass
    (artifacts/circdist_endtoend2_review_20260823.md Part A) attacked the ASSEMBLED amended
    dossier against the exact claim — composition total and byte-verified (two clause words
    false against the base text are true against the composition: "self-certifying" via Cor
    I.1-prime, Island III''s shape set via A1 B2); Lemma 1.4-prime/Theorem B now confirmed by
    THREE mutually independent implementations on three disjoint families (the wave-30 pass
    adding a min = 4 regime on HGP(rep4,rep4) n = 25 and an execution-based test of the (<=)
    construction); Islands II and IV re-verified with fresh own-code sweeps (28-instance
    universal HGP, 0 failures; 114-pair 2-SAT, 0 disagreements); the three wave-21 precisions
    all folded; C1 draft-citation ruling issued and the §7.3 registration edit executed at
    promotion. History: RESTORED NUMERICAL -> CERTIFIED* 2026-08-23 on the narrowed
    four-island claim: the
    Amendment-5 re-review (artifacts/circdist_islands_amendment5_review_20260823.md)
    CONFIRMED the Lemma 1.4 derivation with an independent method (104 triples, 0
    disagreements), adjudicated the Def 1.3-prime residual a NON-ISSUE (no lead ratification
    — 公共定义 pins it), found items 3-6 conformant (Steane 13824+13824 reproduced exactly),
    and licensed CERTIFIED* hash-bound to this claim; the corrected V clause was NOT installed
    (defective — drops "choice-free"; see caveats). Path to PROVED: one end-to-end review of
    the assembled four-island argument (task-003). History: 2026-08-23 wave-19 end-to-end
    review REFUTED the five-clause claim''s Island V wording (Steane witness) and found Lemma
    1.4 underived — claim narrowed, node demoted to NUMERICAL, self-correction #7; Amendment 5
    then derived Lemma 1.4 in full (Theorem B universal). Earlier: promoted CONJECTURED ->
    CERTIFIED* 2026-08-22 (sixth attempt) via the Amendment-4 focused re-review; wave-11
    re-adjudication kept the star for the then-unverified C1, discharged by the wave-18
    primary-source check. History: WRITE-UP
    LANDED (round 4, artifacts/circdist_cplx_islands_writeup_20260820.md,
    complete proposer-level proofs for islands I-IV, one gap found in V). I factorising: complete,
    coupling defined via the chain-realisability lemma, and the class is SELF-CERTIFYING
    (decoupling itself poly-time recognisable — promise-free). II HGP: complete and STRONGER than
    commissioned — Theorem II.1 (line-support cleaning) gives d_eff(M) >= min(mu_X, mu_Z) for
    EVERY schedule, with the exact non-degeneracy proviso (Lemma II.5); external assumption A1 no
    longer needed. III bounded treewidth: complete, explicit CMSO2 sentence; Courcelle citation
    pinned as Courcelle Inf.&Comp. 85 (1990) + Arnborg-Lagergren-Seese J.Alg. 12 (1991) +
    Courcelle-Engelfriet EMA 138 Prop 5.13 — SECONDARY-SOURCE VERIFIED ONLY, primary-text check
    still owed. IV d=3/two-orders: complete 2-SAT reduction both directions, no check-weight
    bound needed. V weight-<=4 / d_X >= 4: GAP FOUND — the gadget gate''s "bipartite matching"
    headline is WRONG; the correct abstraction is a partial section g : N -> Log hitting every
    check''s 3-element list, which is abstractly NP-complete (3-SAT); it IS matching under a
    checkable disjointness hypothesis (D), and k <= 1 stays unconditionally YES (linear-splitting
    parity argument holds; hypothesis relaxed from weight exactly 4 to weight <= 4). Hall''s
    theorem is the clean reason local neq3 gadgets cannot give hardness (the K4 composite is a
    Hall violation) — a more general obstruction than the equivalence-relation argument.
    Prefix-suffix duality upgraded to an identity in Q = F2^n/S_X, turning the
    stabiliser-coincidence proviso into the definition. Island V''s general case is OPEN and
    repriced (1-2 sessions, both outcomes useful) — see the reopening note on CIRCDIST.cplx.fixed-d.
    Amendment 2 (SHA-256 33f7f5d8...) applies I1: the false (S2)-only Observation is withdrawn,
    realizability condition (S3) is the actual known tamer, and the exact §5.4/§8 replacements are
    supplied. Independent rereview CLEAN-PASSED I1 but returned FURTHER-REPAIR on one separately
    registered wording defect (Proposition V.7'' multisets), corrected by Amendment 3 and
    cleared through Amendment 4''s re-review.'
