      rep_m turn a McLoughlin covering-radius instance into a DEEP-FLAG instance with the same
      answer? YES => the ladder obstruction dissolves and the node essentially closes via
      Theorem D + wrappers; NO => the R4 dictionary route dies and R3 is the sole route. Either
      answer settles the route choice.'
    kind: gate
    since: '2026-08-22'
