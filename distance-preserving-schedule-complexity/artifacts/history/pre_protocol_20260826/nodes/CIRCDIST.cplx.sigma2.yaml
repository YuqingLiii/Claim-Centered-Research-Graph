claim: Eff-Preserve with d as part of the input is Sigma_2^P-hard (hence, with CIRCDIST.cplx.upper,
  Sigma_2^P-complete).
assessment:
  level: OPEN
  summary: 'Two candidate routes from the round-1 recon, both currently weak: qsat2-budget-gadget
    (orders = existential variables, fault budget forcing one column per group = universal
    variables, BMvT-style budget combinatorics; P 0.15, D 6 — the acceptance predicate is
    F2-LINEAR, so all nonlinearity must hide in the budget, which is the hard part) and
    covering-radius-transfer (import the Pi_2-complete linear-code covering-radius machinery;
    P 0.2, D 5 — no natural dictionary found yet, and the Pi_2 attribution itself needs a primary
    check). This is the risk-carrying half of the classification; the minimal acceptance for the
    root does not require it.'
