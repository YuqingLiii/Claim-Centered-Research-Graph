# Dispatcher: Fable 5 (supervision + decisions). Workers: Opus 5 (proofs + reasoning).
# Effort unit: 1 session = one budget-boxed Opus 5 worker run. Token usage logged for calibration.
# This file never licenses a status write; assessments live in the canonical nodes.

