  - 'FIX-1 (2026-08-20, after round 1): commissions must FORBID worker-side sub-agent spawning —
    the lift worker spawned an unbudgeted literature child (valuable output, but the box was not
    mechanically enforced). All round-2+ prompts carry "no sub-agents; single session".'
  - 'FIX-2 (2026-08-23, after wave 5): sessions must DECLARE every OS-level background process
    they start (solver drivers, long computations) in their final report — job list, log paths,
    expected runtime — and either terminate them or explicitly hand them off; undeclared detached
    compute is a breach (wave-5 found a 30-worker driver from the prior session running silently,
    causing 50 duplicated decisions and near-loss of volatile /private/tmp logs). Session-scoped
    scratch logs that carry verdicts MUST be copied into artifacts/ before session end. Raw
    detached-driver output is unaudited evidence until a session validates it.'

