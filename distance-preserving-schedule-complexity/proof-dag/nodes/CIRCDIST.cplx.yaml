        restrictions and the domain-three-only witness, input-d completeness, candidate wording, stale-live-prose
        repair, no islands shortcut and no automatic inheritance.
      locator: Finding F-ROOT
      reviewed_hash: sha256:0d9572ec3c4b58be6c824c1445c8bb6c3db76736a73aea9111d5c39586984c60
    evidence:
