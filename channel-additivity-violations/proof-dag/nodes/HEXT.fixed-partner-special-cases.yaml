id: HEXT.fixed-partner-special-cases
role: proof
aliases:
- fcea-special-cases
claim: >-
  If the fixed finite-dimensional partner Xi is isometric or entanglement breaking, then for every
  channel Phi its minimum output entropy is strongly additive with Phi; hence the fixed-partner
  FCEA defect is identically zero, without an asymptotic limit.
assessment:
  level: CONJECTURED
  summary: >-
    The entanglement-breaking branch is directly source-bound and the isometric branch has a short
    proposer-side proof. Independent review of the new combined node is still pending. These cases
    do not decide the general non-EB fixed-partner gate.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/primary-sources/shor-eb-0201149.pdf
      kind: pdf
      locator: "PDF page 3, equations (9)--(14) and the concluding paragraph"
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/FIXED_PARTNER_SPECIAL_CASES_PROOF_20260829.md
      kind: text
      locator: "## Isometric fixed partners"
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/FIXED_PARTNER_SPECIAL_CASES_PROOF_20260829.md
      kind: text
      locator: "## Consequence for FCEA"
