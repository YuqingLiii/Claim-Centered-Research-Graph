id: HCPREV.algebraic-witness-existence
role: proof
aliases:
- computable-deterministic-existence
claim: >-
  For every rational G>0 measured in bits, there exist finite-dimensional CPTP maps N,M with
  algebraic Kraus entries such that
  Delta_S(N,M):=S_min(N)+S_min(M)-S_min(N tensor M)>G, where every entropy is base two. There is
  a Turing procedure which, given G, eventually halts and prints such N,M together with a finite
  rational sphere-net, algebraic-spectrum and directed-entropy-interval certificate proving this
  strict global pair inequality. No dimension, denominator, certificate-size or runtime bound is
  asserted.
routes:
  density-and-semidecision:
    premises:
    - HCPREV.product-haar-moe-unbounded
    - HCPREV.cayley-algebraic-channel-density
    - HCPREV.effective-pure-state-net-moe-bounds
    - HCPREV.algebraic-entropy-interval-verifier
    implication: >-
      The MOE-only product-Haar premise gives, for the requested rational G, a finite equal-weight
      random-unitary channel/conjugate-channel pair with base-two pair defect strictly above G.
      The Cayley-density premise and the effective Audenaert modulus from the sphere-net premise
      yield an algebraic pair retaining a positive residual margin. Enumerate all such Cayley
      pairs and dovetail the certified single and full joint pure-state nets with the algebraic
      entropy-interval verifier. At every stage form
      C=L_N+L_M-U_(N tensor M)<=Delta_S(N,M). For the successful algebraic pair these certified
      lower bounds converge to its strict defect, so eventually C>G and the finite verifier accepts
      and prints the pair and certificate.
    proof:
      sketch: >-
        Enumerate dimensions, tuple lengths and pairs of Cayley transforms of Gaussian-rational
        skew-Hermitian matrices. Entrywise eta-approximation gives diamond error at most 2d eta;
        the tensor-pair error is the sum, and the base-two Audenaert moduli preserve a strict gap.
        For each enumerated pair construct explicit stereographic rational nets with checkable
        covering radii for both single inputs and the full joint input. Exact algebraic spectral
        isolation and directed logarithm intervals, including 0log0, give pointwise entropy
        intervals. Dovetail mesh and arithmetic precision until the rational certificate
        L_N+L_M-U_joint>G is verified. The strict algebraic witness guarantees termination without
        supplying a resource bound.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/ALGEBRAIC_WITNESS_EFFECTIVE_CERTIFICATION_REPAIR_20260831.md
        kind: text
        locator: "## 7. Certified lower gap and dovetail termination"
    assessment:
      level: CONJECTURED
      caveats:
      - All three effective-certification atoms are proposer-side and await independent review.
      - The route concerns a pair MOE defect only; older Holevo/Weyl/flagged discussion is non-load-bearing.
      summary: >-
        The BLOCK findings have been repaired at proposer level by narrowing the existence premise
        to the proved MOE atom and isolating all effective density, sphere-net and entropy-verifier
        interfaces. No promotion is requested before amendment review.
      basis:
        evidence:
        - path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/ALGEBRAIC_WITNESS_EFFECTIVE_CERTIFICATION_REPAIR_20260831.md
          kind: text
          locator: "## 9. Repair and review map"
        reviews:
        - path: channel-additivity-violations/reviews/holevo-counterexample-prevalence/CLAUDE_OPUS5_CANDIDATE_HASH_BINDING_REVIEW_20260907.md
          kind: review
          locator: "Finding CO5-HCP-01"
          scope: >-
            The completed independent V6 audit reconstructed the repaired density-and-semidecision
            route and supported it at candidate strength without promoting the route.
          reviewed_hash: sha256:0dcb693741d9f9cd389213ea1335a447b5c620b7665d8e38c72422d2a7c62ca3
assessment:
  level: CONJECTURED
  caveats:
  - This is computable existence, not a compact matrix tuple currently exhibited in the repository.
  - No resource bound is provided; the search is expected to be infeasible.
  - This claim is MOE pair-only and makes no Holevo or same-channel assertion.
  summary: >-
    The canonical claim now fixes the base-two MOE pair quantity, gap sign and output contract.
