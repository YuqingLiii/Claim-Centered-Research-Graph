id: HAEQ.weyl-extension-moe-preservation
role: proof
aliases:
- weyl-extension-global-moe
claim: >-
  Let N1 and N2 be finite-dimensional channels whose outputs are isometrically embedded in a
  common d-dimensional space, and let N1' and N2' be their completely dephasing classical
  Weyl-label extensions. Then Smin(Ni') = Smin(Ni) for i=1,2 and
  Smin(N1' tensor N2') = Smin(N1 tensor N2), where every minimum is over all input states,
  including label-input-correlated states and states entangled across the two extended channels.
assessment:
  level: PROVED
  caveats:
  - The statement concerns the explicitly dephasing classical-label extension, not an arbitrary
    coherent controlled-unitary extension.
  summary: >-
    Independent review passed the exact current claim: diagonal label blocks express every
    extended-channel output as a convex mixture of Weyl-conjugated original-channel outputs,
    entropy concavity gives the global lower bounds, and fixed labels attain them.
  basis:
