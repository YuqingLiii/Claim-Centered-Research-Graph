id: HEXT.same-tuple-positive-diagonal-core-projective-neighborhood
role: proof
aliases:
- repeated-tuple-diagonal-core-double-off-neighborhood
claim: >-
  On the uniform one-leg trace-zero event, a positive Hilbert--Schmidt unit coefficient with a
  separately positive fully diagonal core D and Hermitian double-off remainder E satisfies the
  A/m target whenever pi_X(E)<=sqrt((A+1)/(A-1))||E||_2. This includes positive-definite examples
  when m>A of coefficient operator-Schmidt rank r+1 for every
  r<=min{m(m-1),(A+1)/(A-1)} and with trace greater than A.
assessment:
  level: PROVED
  caveats:
  - Separate positivity of the diagonal core and the projective/Frobenius ratio are load-bearing.
  - The explicit trace-greater-than-A family uses m>A; the conditional neighborhood inequality does not.
  summary: >-
    The exact diagonal output leaves enough slack for double-off projective rank growing linearly
    in m while retaining full rank, positive definiteness and trace above A.
