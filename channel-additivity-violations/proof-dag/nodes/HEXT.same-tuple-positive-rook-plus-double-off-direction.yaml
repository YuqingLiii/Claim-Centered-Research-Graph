id: HEXT.same-tuple-positive-rook-plus-double-off-direction
role: proof
aliases:
- repeated-tuple-rook-one-double-off-direction
claim: >-
  On the uniform one-leg trace-zero event, a positive Hilbert--Schmidt unit coefficient satisfies
  the A/m target whenever it is the orthogonal sum of a separately positive rook-supported core
  and one Hermitian simple tensor whose two factors are zero-diagonal. No separate smallness bound
  on the double-off Hilbert--Schmidt norm is required beyond positivity of the total coefficient.
assessment:
  level: PROVED
  caveats:
  - Separate positivity of the rook core is load-bearing because rook truncation is not positive.
  - The uniform one-leg trace-zero event is load-bearing.
  summary: >-
    Orthogonality combines the reviewed sqrt(2A-1) rook constant and the A-1 double-off gain through
    the exact identity (2A-1)+(A-1)^2=A^2.
