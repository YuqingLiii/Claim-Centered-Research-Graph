id: HEXT.same-tuple-double-off-projective-interface
role: proof
aliases:
- repeated-tuple-double-off-projective-gain
claim: >-
  On the uniform one-leg trace-zero coefficient event, every coefficient E supported only on
  entries changing both coefficient labels satisfies
  ||M_U(E)||_infinity<=((A-1)/m) pi_X(E), where pi_X is the Hilbert projective norm over the two
  zero-diagonal coefficient spaces.
assessment:
  level: PROVED
  caveats:
  - The uniform one-leg trace-zero event and the projective-norm convention are load-bearing.
  - The projective norm may exceed the Hilbert--Schmidt norm by a rank-dependent factor.
  summary: >-
    Factorization on double-off simple tensors uses the trace-zero one-leg gain twice, producing
    exactly the relative slack A-1 before projective completion.
