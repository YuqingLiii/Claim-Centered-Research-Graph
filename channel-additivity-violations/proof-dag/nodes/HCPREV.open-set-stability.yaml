id: HCPREV.open-set-stability
role: proof
aliases:
- stability-lemma
claim: >-
  At fixed finite input/output dimensions, every strict minimum-output-entropy or Holevo additivity
  violation persists on a sufficiently small diamond-norm neighborhood; hence the counterexample
  set is nonempty relatively open and has positive intrinsic Lebesgue measure in the CPTP affine
  hull whenever a strict witness exists in those dimensions.
assumptions:
  audenaert-sharp-entropy-continuity:
    kind: external-theorem
    statement: >-
      For density operators rho,sigma on a d-dimensional space with d>=2 and sufficiently small
      trace distance T=(1/2)||rho-sigma||_1, |S(rho)-S(sigma)| is at most
      T log_2(d-1)+h_2(T).
    source:
      path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/primary-sources/audenaert-0610146.pdf
      kind: pdf
      locator: Theorem 1, PDF p. 2
  diamond-norm-channel-facts:
    kind: model-fact
    statement: >-
      The diamond norm controls the output trace norm uniformly over inputs and references, is
      multiplicative on tensor products, and equals one for every CPTP map; hence the displayed
      tensor-product perturbation estimate follows by expansion and the triangle inequality.
    source:
      path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/STABILITY_AND_MEASURE_PROOF_20260829.md
      kind: text
      locator: "`## Tensor-product perturbation`"
assessment:
  level: PROVED
  summary: >-
    Independent repair review passed the explicit continuity bounds for both optimized quantities,
    the one-dimensional-output edge case, and the relative-open-to-positive-measure step with all
    load-bearing theorem and model inputs registered in this node.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/STABILITY_AND_MEASURE_PROOF_20260829.md
      kind: text
      locator: "## Persistence of a strict minimum-output-entropy gap"
    - path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/STABILITY_AND_MEASURE_PROOF_20260829.md
      kind: text
      locator: "## Persistence of a strict Holevo gap"
