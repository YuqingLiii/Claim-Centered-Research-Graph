id: HEXT.werner-minimal-skeleton-map-bound
role: proof
aliases:
- werner-conditional-minimal-genus-mass-bound
claim: >-
  Assuming the lossless Werner ribbon injection and the b<=2+4h handle-sliced paired-stack
  certificate, the genus-h minimal nonreturn absolute mass is at most
  64N^3(2N+1)m^4(4096/m)^N[m^8(16N)^3/d^2]^h. Therefore its positive-genus sum is geometric for
  fixed m and N<=c_m log d; allowing one binary decoration per ribbon replaces 4096 by 16384.
