id: HEXT.su3-all-adjacent-elementary-face-pairs-bell-no-go
role: obstruction
aliases:
- all-two-face-pieri-no-go
claim: >-
  Every SU(3)-covariant qutrit channel supported on the union of two distinct elementary Pieri
  faces sharing one incidence edge satisfies
  2 barS_min(Phi)<=2S_min(Phi)<S((Phi tensor barPhi)(Omega)) for all allowed labels, edge weights,
  and phases.
routes:
  three-orientation-cover:
    premises:
    - HEXT.su3-adjacent-elementary-faces-bell-no-go
    - HEXT.su3-conjugate-edge-adjacent-faces-bell-no-go
    - HEXT.su3-highest-edge-adjacent-faces-bell-no-go
    implication: >-
      Up to reversing the unordered face pair, the shared incidence edge has middle, conjugate, or
      highest branch type. The three premises certify those genuinely different orientations
      separately, hence cover every adjacent elementary-face pair without assuming a channel-level
      Weyl equivalence.
    assessment:
      level: CONJECTURED
      summary: >-
        The orientation classification and all three exact proposer-side certificates are present;
        independent adversarial review remains pending.
assessment:
  level: CONJECTURED
  caveats:
  - The three component proofs are proposer-side and have not received independent review.
  - Three or more faces, repeated vertices, multiplicity spaces, noncovariant factors and non-Bell
    inputs are not covered.
  summary: >-
    All three unoriented adjacent elementary-face types are excluded by exact all-parameter
    rational Bernstein/logarithm certificates.
  basis:
    routes:
    - three-orientation-cover
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_ADJACENT_ELEMENTARY_FACES_BELL_NO_GO_20260830.md
      kind: text
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_CONJUGATE_EDGE_ADJACENT_FACES_BELL_NO_GO_20260830.md
      kind: text
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_HIGHEST_EDGE_ADJACENT_FACES_BELL_NO_GO_20260830.md
      kind: text
events:
  all-adjacent-orientations-certified:
    date: '2026-08-30'
    type: created
    summary: >-
      Combined the independent middle-, conjugate-, and highest-edge certificates into a complete
      cover of adjacent elementary Pieri face pairs.
    sources:
