      kind: review
      locator: "Finding STGW-IR-08"
      scope: >-
        Independently verified the factorization, worst-case partial-transpose loss and positive
        orthogonal witness; no exact expander constant or random-instance delocalization theorem
        was used.
      reviewed_hash: sha256:ba3f076f3eb0ebd6c4cb0c53b9115b7eeda37970a58357ebe13b6339f7ba320c
