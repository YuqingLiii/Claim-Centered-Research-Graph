id: HEXT.quantum-expander-werner-partial-transpose-interface
role: obstruction
aliases:
- expander-gap-partial-transpose-loss
claim: >-
  The exact factorization R_U^Gamma=G_U^*G_U converts a standard random-quantum-expander second
  singular-value estimate into control before partial transpose, but the return map can lose a
  factor d in operator norm. Positivity and orthogonality to the maximally entangled projector do
  not remove this loss, so the standard expander gap alone does not imply the target centered
  Werner spectral bound.
assessment:
  level: PROVED
  caveats:
  - >-
    This obstruction does not rule out an instance-specific delocalization theorem for the actual
    random expander eigenprojections.
  summary: >-
    Quantum expansion controls the partial-transposed positive operator, but a sharp deterministic
    example shows that positivity and maximally-entangled orthogonality do not prevent dimension-d
    norm amplification under partial transpose.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_FLIP_SECTOR_SAME_TUPLE_GATE_20260830.md
