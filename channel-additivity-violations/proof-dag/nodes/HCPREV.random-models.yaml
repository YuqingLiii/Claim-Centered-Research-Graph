    sources:
    - path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/NAMED_RANDOM_MODEL_ATOMIC_ASSEMBLY_20260831.md
      kind: text
      locator: "## 8. Exact AND assembly"
  random-model-compound-claim-atomized:
    date: '2026-08-31'
    type: repair-applied
    summary: >-
      Rewrote the compound claim as five explicit conjuncts and froze each named model's dimensions,
      witness and probability quantifier, without inferring same-law Holevo prevalence.
    sources:
    - path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/NAMED_RANDOM_MODEL_ATOMIC_ASSEMBLY_20260831.md
      kind: text
      locator: "## 1. Common quantity and scope"
  invalid-compound-product-haar-route-retired:
    date: '2026-08-30'
    type: route-retired
    route: product-haar-unbounded-route
    summary: >-
      Independent review showed that the one-premise route proves only the product-Haar conjunct,
      not the parent claim's several earlier named-model conjuncts; the scoped clause was split to
