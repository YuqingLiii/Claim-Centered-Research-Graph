        operator-Schmidt rank and satisfies the target deterministically.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-positive-maximal-schmidt-double-off-neighborhood.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing reviewed family: an amplitude-restricted positive double-off
        neighborhood of operator-Schmidt rank Theta(m^2) is target-safe deterministically.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-high-schmidt-kadison-haagerup-obstruction.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing reviewed route boundary: unrefined Haagerup--Kadison control retains
        an order-one nuclear-sum loss at maximal Schmidt rank.
