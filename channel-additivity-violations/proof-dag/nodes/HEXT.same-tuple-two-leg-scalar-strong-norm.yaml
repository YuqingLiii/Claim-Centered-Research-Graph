    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-double-off-projective-frobenius-obstruction.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing reviewed route boundary: the projective/Frobenius ratio can grow as
        sqrt(r), so projective triangle summation alone does not settle the full coefficient sphere.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-positive-spectral-flat-base-case.yaml
      kind: node-evidence
