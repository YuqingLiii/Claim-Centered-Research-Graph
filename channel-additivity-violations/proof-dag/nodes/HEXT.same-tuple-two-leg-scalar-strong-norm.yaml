id: HEXT.same-tuple-two-leg-scalar-strong-norm
role: proof
aliases:
- repeated-haar-tuple-two-leg-strong-convergence
claim: >-
  For every fixed Kraus count m and fixed Hermitian coefficient matrix Y in M_(m^2), if one Haar
  unitary tuple U_1,...,U_m is reused on both tensor legs, then the norm of
  m^(-2) sum_(v,a,w,b) Y_((v,a),(w,b)) (U_v^*U_w) tensor (U_a^*U_b)
  converges in probability as d tends to infinity to the corresponding scalar-coefficient norm in
  the left-regular representation of F_m x F_m.
assessment:
  level: OPEN
  caveats:
  - >-
    Bordenave--Collins tensor strong convergence uses independently sampled tuples on distinct
    tensor legs and does not establish this same-tuple repeated-representation statement.
  - >-
    This scalar fixed-coefficient claim is narrower than arbitrary completely bounded or
    matrix-level convergence, but no proof or counterexample is known.
  - >-
    Exact base cases cover diagonal, one-leg-diagonal, simple-tensor, sparse rank-one,
    low coefficient-Schmidt-rank, canonical Bell and normalized-flip coefficients, but they do not
    control the dense high-rank or general Hermitian coefficient classes needed by this claim.
  summary: >-
    This is the precise two-leg strong-norm lemma left after output duality removes the d^2-dimensional
    input-state net. Together with the Collins--Youn free bound and a finite coefficient net, it
    would establish the generic complex-Haar global n=2 purity bound only.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/COMPLEX_HAAR_GLOBAL_N2_CONCENTRATION_GATE_20260830.md
      kind: text
      locator: "## 9. Minimal viable replacement: dualize the output, not the input sphere"
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-two-leg-scalar-base-cases.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing partial progress: substantial strict coefficient subclasses satisfy the
        target, but the general repeated-tuple convergence claim remains OPEN.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-rank-one-gram-contraction.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing dense rank-one progress: exact Gram contraction covers all diagonal-Gram
        matrices, including dense full-rank maximally entangled coefficients, but not general z.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-near-orthogonal-gram-base-case.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing conditional neighborhood: one-leg trace-zero control settles rank-one
        coefficients whose left or right Gram is sufficiently close to diagonal.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-werner-spectral-reduction.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing symmetry reduction: the full real Werner sector becomes one centered
        spectral bound on R_U, whose high-probability version remains unresolved.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-werner-centered-bound.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing frontier specialization: proving this centered extreme-spectrum estimate
        would close the real Werner sector only, not arbitrary Hermitian coefficients.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-real-werner-sector-large-m.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing PROVED scoped progress: the fixed-m>e^18 real Werner two-dimensional
        coefficient sector is closed, without covering arbitrary Hermitian Y.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-positive-partial-trace-contraction.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing positive-coefficient reduction: the two-leg output contracts to either
        coefficient partial trace, but the induced trace/nuclear factor remains too large in general.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-gram-safe-spectral-nuclear-base-case.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing non-rank-one progress: polarization covers a small spectral nuclear-norm
        neighborhood of Gram-safe singular vectors, not arbitrary Hermitian coefficients.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-positive-rook-support-base-case.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing broad positive subclass: rook-supported positive coefficients are
        target-tight without a trace restriction, but double-off-diagonal entries remain open.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-double-off-projective-interface.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing reviewed interface: on the uniform one-leg trace-zero event,
        double-off coefficients are controlled by their projective norm. This does not control
        the full double-off Hilbert--Schmidt sphere.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-positive-rook-plus-double-off-direction.yaml
      kind: node-evidence
      note: >-
        Non-load-bearing reviewed positive extension: a separately positive rook core plus
        one Hermitian double-off simple-tensor direction reaches the target; the general positive
