id: HCPREV.additive-open-region
role: obstruction
aliases:
- not-dense
claim: >-
  The full finite-dimensional CPTP space contains a nonempty relative-open region of strongly
  additive channels, for example inside the entanglement-breaking region; therefore additivity
  counterexamples are not dense, residual/generic or full-measure in that ambient-space sense.
assumptions:
  gurvits-barnum-separable-ball:
    kind: external-theorem
    statement: >-
      In every finite bipartite dimension, a nonzero Frobenius-norm ball around the maximally mixed
      bipartite state consists entirely of separable states.
    source:
      path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/primary-sources/gurvits-barnum-0204159.pdf
      kind: pdf
      locator: Theorem 1 and Corollary 3, PDF pp. 4-5
  shor-entanglement-breaking-strong-additivity:
    kind: external-theorem
    statement: >-
      For every finite-dimensional channel Psi and entanglement-breaking channel Phi, both
      S_min(Psi tensor Phi)=S_min(Psi)+S_min(Phi) and
      chi(Psi tensor Phi)=chi(Psi)+chi(Phi) hold for the one-shot Holevo quantity.
    source:
      path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/primary-sources/shor-eb-0201149.pdf
      kind: pdf
      locator: Theorems 1 and 2, PDF pp. 2 and 4
  choi-entanglement-breaking-correspondence:
    kind: model-fact
    statement: >-
      Normalized Choi states of CPTP maps are precisely positive bipartite states with the fixed
      trace-preserving input marginal, and a channel is entanglement breaking exactly when its Choi
      state is separable.
    source:
      path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/ADDITIVE_OPEN_REGION_PROOF_20260829.md
      kind: text
      locator: "`## Entanglement-breaking interior`"
assessment:
  level: PROVED
  caveats:
  - >-
    The claim uses relative topology and intrinsic measure on a fixed-dimensional CPTP affine hull;
    it is not a statement across a disjoint union of all dimensions.
  summary: >-
    Independent repair review passed the Gurvits--Barnum separable-ball input, the Choi affine-slice
    argument, Shor's strong-additivity theorems, and the fixed-dimensional topology consequences.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/ADDITIVE_OPEN_REGION_PROOF_20260829.md
      kind: text
      locator: "## Entanglement-breaking interior"
    - path: channel-additivity-violations/artifacts/holevo-counterexample-prevalence/ADDITIVE_OPEN_REGION_PROOF_20260829.md
