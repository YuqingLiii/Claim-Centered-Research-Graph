id: HEXT.su3-bent-central-ternary-three-face-bell-no-go
role: obstruction
aliases:
- bent-central-ternary-three-face-no-go
claim: >-
  Every SU(3)-covariant qutrit channel supported on the bent cluster
  ((-1,-1),(-1,2),(0,0)) satisfies the Bell-input no-gap inequality for all labels and weights.
routes:
  fixed-three-original-side-cover:
    premises:
    - HEXT.su3-three-face-cluster-classification
    - HEXT.su3-fixed-original-side-endpoint-lemma
    implication: >-
      Retain h/m, ternary h/c/m, and h/c blocks, reduce the rest to 24 Gram endpoints, and certify
      the resulting six-variable inequality.
    proof:
      sources:
      - path: channel-additivity-violations/tools/holevo-extensive-violation/certify_su3_chain_three_face_sixdim_covers.py
        kind: code
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_BENT_CENTRAL_TERNARY_THREE_FACE_CERTIFICATE_STOPPED_20260831.md
        kind: text
    assessment:
      level: NUMERICAL
      caveats:
      - >-
        The registered depth-6 exact run reached an uncertified full-depth box; a depth-10 replay
        was stopped at user request and produced no terminal certificate verdict.
      summary: >-
        The fixed cover stayed positive under million-label stress, but exact certification
        remains incomplete after the stopped depth-10 replay.
      basis:
        evidence:
        - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_BENT_CENTRAL_TERNARY_THREE_FACE_CERTIFICATE_STOPPED_20260831.md
          kind: text
          locator: "## Stopped depth-10 replay"
        runs:
        - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_CHAIN_THREE_FACE_FIXED_THREE_STRESS_RUN_20260830.txt
          kind: run
          result: The selected cover retained a sampled margin at least 0.175629949999 bit.
        - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_BENT_CENTRAL_TERNARY_THREE_FACE_CERTIFICATE_STOPPED_20260831.txt
          kind: run
          result: >-
            Depth 6 failed at a width-1/64 box; the depth-10 replay was user-stopped after the
            10000/4992/15 progress checkpoint with no terminal verdict.
assessment:
