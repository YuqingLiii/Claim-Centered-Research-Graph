id: HEXT.absolute-unbounded-finite-dimensional-defects
role: outcome
aliases:
- absolute-unbounded-subquestion
claim: >-
  For every G>0 there are finite-dimensional channels L,R with p=1 minimum-output-entropy pair
  defect greater than G, finite-dimensional channels A,B with one-shot Holevo pair defect greater
  than G, and a finite-dimensional channel T with chi(T tensor T)-2chi(T)>G. Hence all three
  finite-dimensional defect notions are unbounded in absolute size.
routes:
  product-haar-with-finite-transfers:
    premises:
    - HEXT.finite-dimensional-unbounded-gap
    - HEXT.moe-to-holevo-transfer
    - HEXT.pair-to-self
    implication: >-
      Given G>0, choose an MOE pair defect H>G+log_2(9/4). Exact Weyl-flag transfer produces a
      finite Holevo pair with the same defect H, and the general balanced direct-sum reduction
      produces a finite same-channel two-copy Holevo defect at least H-log_2(9/4)>G. Applying the
      first premise directly at target G supplies the MOE clause.
    proof:
      sketch: >-
        Use target H=G+log_2(9/4)+1 in the first premise, preserve H in the second, and subtract
        only the constant gap loss in the third; no dimension-growth rate is invoked.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/ABSOLUTE_UNBOUNDED_OUTCOME_ASSEMBLY_20260830.md
        kind: text
        locator: "## 2. Three-premise proof"
    assessment:
      level: PROVED
      caveats:
      - The route proves absolute unboundedness only, not growth proportional to full logarithmic size.
      summary: >-
        Independent amendment review passed the exact implication hash after the repaired three
        premises were registered and independently proved.
      basis:
        evidence:
        - path: channel-additivity-violations/artifacts/holevo-extensive-violation/ABSOLUTE_UNBOUNDED_OUTCOME_ASSEMBLY_20260830.md
          kind: text
          locator: "## 2. Three-premise proof"
        reviews:
        - path: channel-additivity-violations/reviews/holevo-extensive-violation/ABSOLUTE_UNBOUNDED_CHAIN_REPAIR_AMENDMENT_REVIEW_20260830.md
          kind: review
          locator: Finding AUR-A04
          scope: >-
            Independently passed the exact three-premise implication, quantifier order, constant
            loss bookkeeping and strict separation from full-size scaling.
          reviewed_hash: sha256:692f1214cfdfc66668e98a60bb4d14aa86d3601c14979d10c3a8c420e524fd59
assessment:
  level: PROVED
  caveats:
  - The result gives no explicit matrices or computable finite dimension.
  - It gives no gap rate relative to full input/output/environment logarithmic size.
