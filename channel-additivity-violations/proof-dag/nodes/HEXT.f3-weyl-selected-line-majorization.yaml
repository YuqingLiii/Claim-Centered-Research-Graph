    The proof is computer-assisted and bound to the independently reviewed current theorem,
    checker and certificate hashes; later modifications require a new review.
  - The theorem closes one qutrit Weyl conjugate-Bell obstruction family, not the full-size
    extensive Holevo/MOE problem.
  - The rational-grid screen is route-selection evidence only and is not used by the exact KKT
    proof.
  summary: >-
    All cumulative inequalities in the selected-line qutrit Weyl majorization are proved by exact
    certificates and independent adversarial review.
  basis:
