id: HEXT.multiboundary-paired-stack-label-components
role: proof
aliases:
- paired-boundary-label-component-count
claim: >-
  For a planar sliced skeleton on 2N tuple-label slots satisfying the stated b-boundary
  paired-stack certificate, the equality graph has at most N+2b connected components and hence
  at most m^(N+2b) valid label assignments.
assessment:
  level: PROVED
  caveats:
  - The claim assumes the paired-stack certificate and does not show that every Werner skeleton has one.
  summary: >-
    At most four fixed slots occur per paired boundary rank map; every remaining component uses at
    least two slots, yielding the exact N+2b component bound.
