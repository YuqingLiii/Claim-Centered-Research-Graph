id: HEXT.fixed-unitary-cb-obstruction
role: obstruction
aliases:
- complete-distortion-no-go
claim: >-
  For every finite tuple of m unitary matrices, the map sending the free length-two operator system
  u_i^*u_j to U_i^*U_j has completely bounded norm at least (m-1)/5. Hence no fixed finite tuple can
  provide the small-distortion all-matrix-level approximation needed for indefinite tensorization
  of the free-group entropy certificate.
assumptions:
  free-absorption-and-degree-one-bound:
    kind: external-theorem
    statement: >-
      For arbitrary coefficient unitaries V_i, the elements V_i tensor u_i remain free Haar
      unitaries, and the norm of their sum is at most 2 sqrt(m).
    source:
      path: channel-additivity-violations/artifacts/holevo-extensive-violation/primary-sources/bordenave-collins-2304.05714.pdf
      kind: pdf
      locator: Absorption principle, Section 9.2, PDF pp. 61-62
assessment:
  level: CONJECTURED
  caveats:
  - The bad matrix coefficients are not proved to arise from physical complementary-channel outputs.
  summary: >-
    A direct Bell-vector amplification gives finite norm at least m^2-m, while free absorption and
    the degree-one Haagerup inequality bound the corresponding free norm by 5m. This closes the
    fixed-D complete-tensorization proof route but not the true regularized-entropy question.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/FINITE_UNITARY_CB_DISTORTION_OBSTRUCTION_20260829.md
      kind: text
      locator: "## Amplification witness"
frontier:
  physical-coefficient-gap:
    task: >-
      Determine whether a comparable amplification witness can be constrained to the physical
      centered output matrices generated by tensor powers of one fixed finite channel.
    kind: gate
    since: 2026-08-29
events:
  cb-obstruction-created:
    date: '2026-08-29'
    type: created
    summary: >-
      Registered an explicit matrix-level witness ruling out small complete distortion for every
      fixed finite unitary tuple.
    sources:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/FINITE_UNITARY_CB_DISTORTION_OBSTRUCTION_20260829.md
      kind: text
