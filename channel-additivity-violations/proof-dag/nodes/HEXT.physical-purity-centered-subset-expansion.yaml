id: HEXT.physical-purity-centered-subset-expansion
role: proof
aliases:
- all-copy-centered-correlation-expansion
claim: >-
  Let C=D_0+E be a complementary channel of a q-Kraus random-unitary channel, where
  D_0(X)=Tr(X)I_q/q and every E(X) is traceless. For every copy number r and every input state rho,
  Tr[C^(tensor r)(rho)^2] equals the sum over S subseteq [r] of
  q^(-(r-|S|))*||E^(tensor |S|)(rho_S)||_2^2. Consequently the physical-purity bound
  Tr[C^(tensor r)(rho)^2]<=(A/q)^r is exactly equivalent to the centered subset budget
  sum_S q^(|S|)||E^(tensor |S|)(rho_S)||_2^2<=A^r. At r=3 the fully centered three-body term does
  not occur in the direct sum of the r<=2 inequalities for the proper marginals, so that naive
  marginal-summation induction does not bound it.
assessment:
  level: PROVED
  caveats:
  - This is an exact reformulation, not a proof that the centered subset budget holds.
  summary: >-
    Orthogonality between identity and traceless output factors gives the all-copy subset formula.
    It isolates a new centered correlation at every copy number and shows exactly why direct
    summation of lower-copy marginal inequalities does not close the induction.
