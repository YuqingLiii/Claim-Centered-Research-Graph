id: HEXT.werner-boundary-surgery-normal-form
role: proof
aliases:
- werner-fixed-rho-surgery-normal-form
claim: >-
  Fix permutations J and rho. If ABC=rho, then every structural triple A'B'C'=rho is uniquely
  A'=Ap, B'=p^(-1)Bq, C'=q^(-1)C. Under sigma=A^(-1)J and
  tau=C^(-1)A^(-1)J, exactly |supp(p)| row arrows and |supp(qp^(-1))| column
  arrows change. Thus a move with s=|supp(p) union supp(q)| changes at most 2s tuple-label
  equality incidences and costs at most m^(2s) in label summation.
assessment:
  level: PROVED
  caveats:
  - The output is a structural fixed-boundary constellation and need not preserve an input coloring.
  summary: >-
    Independent review verified the unique breakpoint-coordinate normal form for every fixed-rho
    structural move and its exact recovered-arrow and label-summation costs.
