      kind: review
      locator: "Finding STGW-IR-03"
      scope: >-
        Independently verified both sufficient radii and the simultaneous quantifier conditional
        on the uniform one-leg event; no necessity or general coefficient claim was reviewed.
      reviewed_hash: sha256:f696b7476eacc99632efd2056b820b3a6cd25e010bc4360ea85dc4128dff6be9
