id: HEXT.same-tuple-near-orthogonal-gram-base-case
role: proof
aliases:
- repeated-tuple-near-diagonal-gram-class
claim: >-
  On the uniform one-leg trace-zero event
  ||C^*(X_0)||_infinity<=sqrt((A-1)/m)||X_0||_2, every rank-one coefficient with either left or
  conjugated-right Gram off-diagonal Frobenius norm at most sqrt((A-1)/m)=3(1+eta)/m satisfies
  ||M_U(|z><z|)||_infinity<=A/m. Deterministically, the same target holds when either Gram's
  off-diagonal entrywise l_1 norm is at most A-1.
assessment:
  level: PROVED
  caveats:
  - The condition is sufficient only for rank-one coefficients and is not claimed necessary.
  summary: >-
    The exact Gram contraction turns uniform one-leg trace-zero control into a simultaneous
    target-tight neighborhood of the diagonal-Gram subclasses without a net over coefficient
    vectors.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SAME_TUPLE_RANK_ONE_GRAM_CONTRACTION_20260830.md
      kind: text
      locator: "## 4. Near-orthogonal Gram subclasses"
    reviews:
