id: HEXT.werner-support-five-genus-one-base-case
role: proof
aliases:
- werner-n4-support-five-structural-reduction
claim: >-
  For A=(0 5)(1 6)(2 7)(3 4), B=(0 4)(1 5)(2 6)(3 7), C=(4 6)(5 7), and
  rho=(0 3 2 1)(4 7 6 5), the fixed-rho structural move p=(0 5)(1 6), q=(4 6)
  gives A'=(2 7)(3 4), B'=(0 4 2 1)(3 7)(5 6), and C'=(5 7). The output
  structural constellation is connected and genus zero; it need not preserve the original tuple
  coloring. The union support has size five, exactly nine row/column arrows change, and the minimal
  Catalan factor P0(C')/P0(C) equals one.
routes:
  explicit-fixed-boundary-move:
    premises:
    - HEXT.werner-boundary-surgery-normal-form
    implication: >-
      For A=(0 5)(1 6)(2 7)(3 4), B=(0 4)(1 5)(2 6)(3 7), C=(4 6)(5 7), and
      rho=(0 3 2 1)(4 7 6 5), the fixed-rho structural move p=(0 5)(1 6), q=(4 6)
      gives A'=(2 7)(3 4), B'=(0 4 2 1)(3 7)(5 6), and C'=(5 7). The output
      structural constellation is connected and genus zero; it need not preserve the original tuple
      coloring. The union support has size five, exactly nine row/column arrows change, and the minimal
      Catalan factor P0(C')/P0(C) equals one.
    proof:
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_BOUNDARY_PRESERVING_SUPPORT_FIVE_GATE_20260830.md
        kind: text
        locator: "## 6. A connected support-five reduction of the same skeleton"
    assessment:
      level: PROVED
      caveats:
      - The output is a structural constellation and does not preserve the original two-label coloring.
      - This is one explicit base case and not a universal support-five theorem.
      summary: Independent review verified the exact support-five structural genus reduction and all costs.
      basis:
