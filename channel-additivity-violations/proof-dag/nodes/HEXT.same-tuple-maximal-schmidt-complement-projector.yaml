id: HEXT.same-tuple-maximal-schmidt-complement-projector
role: proof
aliases:
- repeated-tuple-maximal-osr-projector
claim: >-
  For m>=2, the normalized coefficient projector
  (I-|Omega><Omega|)/sqrt(m^2-1) is positive, Hilbert--Schmidt normalized, has coefficient
  spectral rank m^2-1 and operator-Schmidt rank exactly m^2, and satisfies the same-tuple A/m
  target deterministically for every unitary tuple and eta>=0.
assessment:
  level: PROVED
  caveats:
  - This is one explicit maximal operator-Schmidt-rank coefficient, not the arbitrary high-rank class.
  summary: >-
    Removing the canonical maximally entangled coefficient direction gives a concrete maximal-OSR
    positive example controlled directly by coefficient spectral flatness.
