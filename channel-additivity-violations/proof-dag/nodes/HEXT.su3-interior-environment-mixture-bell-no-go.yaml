id: HEXT.su3-interior-environment-mixture-bell-no-go
role: obstruction
aliases:
- interior-irrep-all-environments-no-go
- su3-three-extreme-mixture-no-go
claim: >-
  Every SU(3)-covariant qutrit-output channel with an irreducible interior input V_(r,s), r,s>=1,
  including arbitrary mixtures of all three inequivalent irreducible Stinespring environments and
  equivalent-copy multiplicity, satisfies
  2 barS_min(Phi)<=2S_min(Phi)<=S((Phi tensor barPhi)(Omega_dim(V_(r,s)))).
routes:
  collision-relative-entropy-route:
    premises:
    - HEXT.su3-inequivalent-environment-mixture-reduction
    implication: >-
      The triangular highest-weight output satisfies chi^2(q||u_3)>=(8/5)t, while the sharp
      qutrit inequality D(q||u_3)>=(2 ln 2/3)chi^2(q||u_3) closes t<=2/3. Above 2/3, dimension
      weights force r=1 and a dominant highest-branch coefficient; five certified rational
      entropy intervals close the remaining range through the maximum t=7/8.
    proof:
      sketch: >-
        Prove the collision contraction by a two-by-two PSD matrix whose determinant is increasing
        from zero at (1,1). Prove the sharp qutrit KL/collision inequality by a two-value Lagrange
        reduction. Use convexity of isotropic relative entropy below 2/3 and a dominant-coordinate
        entropy bound above 2/3. Certify all logarithmic endpoint signs by rational atanh-series
        enclosures.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_INTERIOR_ENVIRONMENT_MIXTURE_BELL_NO_GO_20260830.md
        kind: text
        locator: "## 2. Sharp qutrit relative-entropy/collision lemma through ## 5. The region `2/3<t<=7/8`"
      - path: channel-additivity-violations/tools/holevo-extensive-violation/certify_su3_interior_mixture_entropy.py
        kind: code
        locator: certified rational-log endpoint comparisons
    assessment:
      level: CONJECTURED
      summary: >-
        The all-parameter entropy proof and exact endpoint certificates are complete proposer-side,
        but the theorem has not received independent adversarial review.
assessment:
  level: CONJECTURED
  caveats:
  - Reducible input representations with cross-irrep channel coherences are not covered.
  - Noncovariant qutrit Gram factors and non-Bell collective inputs are not covered.
  - The proof is proposer-side and has not received independent review.
  summary: >-
    All irreducible-input SU(3)-covariant qutrit channels are closed for the conjugate-Bell route.
  basis:
    routes:
    - collision-relative-entropy-route
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_INTERIOR_ENVIRONMENT_MIXTURE_BELL_NO_GO_20260830.md
      kind: text
      locator: "## Theorem"
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_INTERIOR_MIXTURE_CERTIFIED_ENDPOINTS_20260830.txt
      kind: text
      locator: all certified SU(3) interior-mixture endpoint inequalities passed
