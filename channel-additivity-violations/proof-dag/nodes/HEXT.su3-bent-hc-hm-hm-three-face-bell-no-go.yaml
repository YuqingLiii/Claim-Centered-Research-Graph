          kind: review
          locator: "FINDING-SU3-WB-STATIC-07"
          scope: >-
            Static review passed the current configuration, endpoint, original-side, reconstruction,
            compactification and entropy logic, but found the old process impossible to bind to the
            post-launch shared-core sources.
          reviewed_hash: sha256:3c459980bcd30c05ab77b6701b2bdfa73e5babe32b386fb2bea02faf2baee1ac
