id: HEXT.su3-bent-hc-hm-hm-three-face-bell-no-go
role: obstruction
aliases:
- bent-hc-hm-hm-three-face-no-go
claim: >-
  Every SU(3)-covariant qutrit channel supported on the bent cluster
  ((-3,0),(-2,1),(0,0)) satisfies the Bell-input no-gap inequality for all labels and weights.
routes:
  integer-sector-two-side-cover:
    premises:
    - HEXT.su3-three-face-cluster-classification
    - HEXT.su3-fixed-original-side-endpoint-lemma
    implication: >-
      Use the two h/m side blocks (-1,1),(1,0) on the integer sectors P>=1 and P=0,Q>=1,
      producing four- and three-variable 72-endpoint certificates, and retain the existing
      three-side cover only at P=Q=0. The three certified sectors partition every allowed label.
    proof:
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_REMAINING_ORIENTATION_PARALLEL_ANALYSIS_20260830.md
        kind: text
        locator: "## 4. Weakest bent：整数角切除把五维降为四维/三维"
      - path: channel-additivity-violations/tools/holevo-extensive-violation/analyze_su3_remaining_orientation_shortcuts.py
        kind: code
      - path: channel-additivity-violations/tools/holevo-extensive-violation/certify_su3_reduced_sector_covers.py
        kind: script
        locator: main
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_REDUCED_CERTIFIER_IMPLEMENTATION_20260830.md
        kind: text
        locator: "## 5. Smoke verification results"
    assessment:
      level: CONJECTURED
      summary: >-
        Endpoint-aware stress tests are positive off the integer origin, and the global fixed-two
        route has an exact selected-side counterexample at the origin. The three lower-dimensional
        exact certificates have not been run, so the route remains proposer-side only. The
        dedicated checker now passes exact reconstruction, specialization, sector coverage and
        bounded smoke splits for all three pieces.
      basis:
        evidence:
        - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_REMAINING_ORIENTATION_PARALLEL_ANALYSIS_20260830.md
          kind: text
          locator: "### 4.3 数值压力"
  fixed-three-original-side-cover:
    premises:
    - HEXT.su3-three-face-cluster-classification
    - HEXT.su3-fixed-original-side-endpoint-lemma
    implication: >-
      Retain the h/c, h/m, and h/m binary blocks, reduce the rest to 36 Gram endpoints, and
      certify the resulting five-variable compact inequality.
    proof:
      sources:
      - path: channel-additivity-violations/tools/holevo-extensive-violation/certify_su3_weakest_bent_three_face_cluster.py
        kind: code
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_CHAIN_THREE_FACE_SCAN_20260830.md
        kind: text
    assessment:
      level: NUMERICAL
      caveats:
      - >-
        Independent static review passed the current checker design, but the historical live run
        predates two imported source files and was stopped after that provenance defect was
        confirmed; only a fresh prehashed source-bound run can support promotion.
      summary: >-
        The weakest sampled bent cover stayed positive and the current exact checker passed static
        independent review. The unbound historical run was stopped; a fresh immutable-source replay
        remains required.
      basis:
        runs:
        - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SU3_CHAIN_THREE_FACE_FIXED_THREE_STRESS_RUN_20260830.txt
          kind: run
          result: The selected cover retained a sampled margin at least 0.093037809961 bit.
        reviews:
