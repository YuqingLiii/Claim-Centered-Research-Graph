            majorization to the regularized conjugate-Bell no-go.
          reviewed_hash: sha256:7e38c098dc38df219e6c0c9047ae20b219932754775b2c7db9dfb9072a35e449
assessment:
  level: PROVED
  caveats:
  - This excludes only qutrit Weyl random-unitary factors with the conjugate maximally entangled
    witness; it does not exclude non-Weyl qutrit Gram factors or non-Bell joint inputs.
  - The result is bound to the independently reviewed current claim, premise and route hashes;
    later changes require a new review.
  - It is an obstruction theorem, not a construction or resolution of full-size extensive
    violation.
  summary: >-
    The fixed-qutrit Weyl random-unitary conjugate-Bell candidate family is exactly excluded,
    including the regularized side-entropy criterion, by independently reviewed proof.
