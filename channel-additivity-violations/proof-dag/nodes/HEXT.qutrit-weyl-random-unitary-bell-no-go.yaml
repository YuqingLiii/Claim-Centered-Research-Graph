id: HEXT.qutrit-weyl-random-unitary-bell-no-go
role: obstruction
aliases:
- qutrit-weyl-fixed-channel-conjugate-bell-no-go
- f3-weyl-shannon-gate-closed
claim: >-
  Every qutrit Weyl random-unitary channel Phi_p satisfies
  2 barS_min(Phi_p)<=S((Phi_p tensor bar(Phi_p))(Omega_3)); hence no channel in this family can
  produce a positive regularized defect through the conjugate maximally entangled input.
routes:
  selected-line-majorization-route:
    premises:
    - HEXT.qutrit-weyl-random-unitary-bell-gate
    - HEXT.f3-weyl-selected-line-majorization
    implication: >-
      The Bell-gate reduction identifies the joint entropy with H(p*tilde(p)) and bounds the
      regularized side by the least line-quotient entropy. Selected-line majorization gives
      H(p*tilde(p))>=2H(r_L*)>=2 min_L H(r_L), proving the claimed nonpositive defect.
    proof:
      sketch: >-
        Apply Shannon Schur concavity to the selected-line majorization, then substitute the exact
        Bell-output spectrum and tensor-stabilizer side bound from the reduction node.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/F3_WEYL_SELECTED_LINE_MAJORIZATION_THEOREM_20260830.md
        kind: text
        locator: "## 5. Completion of majorization"
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/QUTRIT_WEYL_RANDOM_UNITARY_BELL_GATE_20260830.md
        kind: text
        locator: "## 2. Four exact stabilizer side bounds"
    assessment:
      level: PROVED
      summary: >-
        Independent review passed the exact Weyl reduction, selected-line majorization and Shannon
        implication for the stated regularized conjugate-Bell scope.
      basis:
        reviews:
        - path: channel-additivity-violations/reviews/holevo-extensive-violation/F3_WEYL_SELECTED_LINE_MAJORIZATION_INDEPENDENT_REVIEW_20260830.md
          kind: review
          locator: F3W-IR-VERDICT-NOGO
          scope: >-
