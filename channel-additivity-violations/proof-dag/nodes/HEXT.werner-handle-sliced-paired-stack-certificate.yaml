id: HEXT.werner-handle-sliced-paired-stack-certificate
role: proof
aliases:
- werner-paired-stack-after-handle-slicing
claim: >-
  Every connected minimal genus-h Werner skeleton can be sliced to a planar skeleton whose induced
  tuple-label constraints admit the multi-boundary paired-stack certificate with at most b<=2+4h
  paired boundary rank maps.
assessment:
  level: OPEN
  caveats:
  - Ordinary tree--cotree decomposition does not prove this claim and can create Theta(N) boundary incidences.
  - No slicing construction preserving the two rooted physical trace orders is currently known.
  summary: >-
    This is the second live Werner-specific interface; together with the label-component theorem
    it would limit label entropy to m^(N+4+8h).
