id: HEXT.rooted-orientable-map-handle-count
role: proof
aliases:
- fixed-genus-rooted-map-polynomial-handle-count
claim: >-
  For E>=1, genus h and B additional marked directed corners, the number M(E,h;B) of orientable
  rooted maps is at most 2E(E+1)16^E(2E)^B(8E)^(3h), using the standard unicellular-map
  trisection theorem that one canonical slicing lowers genus by one and is inverted by three
  directed-corner choices plus finitely many local interleavings.
assessment:
  level: CONJECTURED
  caveats:
  - The internal encoding passed independent review, but the exact trisection theorem and inverse local multiplicity lack an archived primary source.
  - This abstract map count does not establish the Werner contraction-skeleton injection.
  summary: >-
    A dual-tree unicellular reduction followed by h trisection slicings gives exponential edge
    cost and only polynomial-per-handle entropy.
