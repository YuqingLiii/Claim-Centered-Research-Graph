id: HEXT.same-tuple-gram-safe-spectral-nuclear-base-case
role: proof
aliases:
- repeated-tuple-polarized-gram-safe-class
claim: >-
  For any unit-Hilbert--Schmidt coefficient Y whose left and right singular vectors each have a
  diagonal left or conjugated-right coefficient Gram, the deterministic same-tuple target holds
  whenever the spectral nuclear norm ||Y||_1 is at most A. This follows from the cross-term bound
  ||M_U(|z><w|)||_infinity<=sqrt(g_U(z)g_U(w)) and includes dense positive rank-two coefficients
  with sufficiently small second eigenvalue.
assessment:
  level: PROVED
  caveats:
  - This is a nuclear-norm window, not a general rank-two or operator-Schmidt theorem.
  summary: >-
    Exact cross-term factorization avoids four-term polarization loss and extends deterministic
    Gram-safe rank-one bounds to a small spectral nuclear-norm neighborhood.
