id: HEXT.same-tuple-positive-maximal-schmidt-double-off-neighborhood
role: proof
aliases:
- repeated-tuple-off-diagonal-flip-neighborhood
claim: >-
  Let E_x be the off-diagonal coefficient flip. The Hilbert--Schmidt normalized family
  Y_q=(I+q E_x)/sqrt(m^2+q^2 m(m-1)) is positive semidefinite for |q|<=1, is positive definite
  for |q|<1, has operator-Schmidt rank 1+m(m-1) for q nonzero, and satisfies the same-tuple A/m
  target deterministically whenever |q|<=min{1,A-1}.
assessment:
  level: PROVED
  caveats:
  - The amplitude restriction is load-bearing and does not settle the constant-amplitude Werner direction.
  summary: >-
    A positive double-off neighborhood of Theta(m^2) operator-Schmidt rank evades the projective
    triangle bottleneck through coefficient operator-norm control.
