id: HEXT.goal
role: outcome
aliases:
- extensive-gap
claim: >-
  Determine whether there exist finite-dimensional channel pairs whose p=1 minimum-output-entropy
  additivity defect, and therefore after quantitative reductions a Holevo additivity defect, is
  Omega(m) where m is the natural full logarithmic size of the primitive input/output/environment
  systems; in particular determine whether the absolute defect is unbounded.
routes:
  product-haar-physical-purity-bootstrap:
    premises:
    - HEXT.product-haar-physical-self-purity-multiplicativity
    - HEXT.moe-to-holevo-transfer
    - HEXT.pair-to-self
    implication: >-
      The all-copy physical purity estimate lower-bounds each side's regularized minimum output
      entropy by J*log_2(m)-log_2(A_{J,eta}). The product Bell witness upper-bounds the regularized
      joint entropy by J*(2*log_2(m)-log_2(m)/m). The stated strict parameter inequality therefore
      gives one fixed finite pair a positive regularized MOE defect; tensor powers, the finite
      MOE-to-Holevo transfer and the constant-loss pair-to-self reduction yield full-size extensive
      same-channel Holevo violations.
    proof:
      sketch: >-
        Apply S>=S_2 to the purity estimate at every copy number, use the same product Bell witness
        on every outer copy, subtract the two rates, and then invoke the registered finite transfer
        reductions.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/FULL_SIZE_SELF_LEAKAGE_PARALLEL_ANALYSIS_20260830.md
        kind: text
        locator: "## 6. The next lemma: physical self-purity, not complete distortion"
    assessment:
      level: CONJECTURED
      summary: >-
        The conditional implication is complete proposer-side, but its physical-purity premise is
        OPEN and the implication has not received independent hash-bound review.
  large-gap-regularized-bootstrap:
    premises:
    - HEXT.finite-dimensional-unbounded-gap
    - HEXT.unbounded-family-self-leakage
    - HEXT.moe-to-holevo-transfer
    - HEXT.pair-to-self
    implication: >-
      Select a finite block whose one-shot gap dominates both absolute self-regularization losses.
      The resulting fixed pair has positive regularized MOE defect; its tensor powers have gap
      linear in their full logarithmic dimension. The finite-dimensional transfer and pair-to-self
      reductions preserve that extensive scaling.
    proof:
      sketch: >-
        Use the lower bound regularized_defect >= one_shot_gap-ell_L-ell_R. Positivity makes the
        tensor-power defect converge to a positive linear rate, while all block dimensions scale
        linearly in copy count in qubit terms.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/TENSOR_COPY_LEAKAGE_PROOF_20260829.md
        kind: text
        locator: "## Large-gap versus absolute self-leakage bootstrap"
    assessment:
      level: CONJECTURED
      summary: >-
        The implication is complete proposer-side, but the new self-leakage premise is open.
  finite-unbounded-route:
    premises:
    - HEXT.finite-dimensional-unbounded-gap
    - HEXT.moe-to-holevo-transfer
    - HEXT.pair-to-self
    implication: >-
      The tensor-strong-convergence construction gives unbounded finite-dimensional MOE pair gaps;
      exact Weyl-flag transfer and constant-loss pair-to-self conversion give unbounded
      finite-dimensional Holevo pair and same-channel gaps. This settles the absolute-unbounded
      subquestion but not the stronger full-size-extensive subquestion.
    proof:
      sketch: >-
        At depth J the MOE pair defect grows as J*c_m-o(1) for fixed m>e^18. Transfer preserves
        the pair defect exactly. Because the transferred conjugate pair has equal one-shot Holevo
        quantities, the same-channel conversion loses at most one bit.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/FINITE_DIMENSIONAL_UNBOUNDED_GAP_PROOF_20260829.md
        kind: text
        locator: "## Step 5: transfer to Holevo and to one channel"
    assessment:
      level: CONJECTURED
      caveats:
      - This implication proves only the absolute-unbounded subquestion and is invalid as a completing route to the full-size parent.
      summary: >-
        Independent review passed the absolute-unbounded mathematics but found that this route does
        not imply the full-size parent. It is retired here; the scoped theorem is rehomed in
        HEXT.absolute-unbounded-finite-dimensional-defects.
      basis:
        reviews:
        - path: channel-additivity-violations/reviews/holevo-extensive-violation/ABSOLUTE_UNBOUNDED_CHAIN_INDEPENDENT_REVIEW_20260830.md
          kind: review
          locator: Findings AU-IR-06--AU-IR-07
          scope: >-
            Independently passed the partial mathematics and blocked this exact implication as a
            route to the combined full-size parent.
          reviewed_hash: sha256:3a1fac337de0f1d3061be345463ea90c9248100a70331d062f9f9b5a757bcdde
    retired:
      date: '2026-08-30'
      sources:
      - path: channel-additivity-violations/reviews/holevo-extensive-violation/ABSOLUTE_UNBOUNDED_CHAIN_INDEPENDENT_REVIEW_20260830.md
        kind: review
        locator: Finding AU-IR-07
  matched-tensor-route:
    premises:
    - HEXT.matched-independent-tensors
    - HEXT.moe-to-holevo-transfer
    - HEXT.pair-to-self
    implication: >-
      An extensive heterogeneous pair defect, followed by the constant-loss balanced direct-sum
      reduction, gives an extensive same-channel Holevo defect with constant gap loss and at most
      linear overhead in the original logarithmic dimensions, hence preserves extensivity up to a
      constant-factor change of the full size.
    proof:
      sketch: >-
        First prove the pair defect with the full dimension cost included. Then balance one-shot
        Holevo quantities by a bounded classical side channel and apply the direct-sum log-sum-exp
        identity; the reduction must not be used to manufacture the missing pair amplification.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/MOE_TO_HOLEVO_TRANSFER_PROOF_20260829.md
        kind: text
        locator: "## Pair-gap identity"
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/PAIR_TO_SELF_REDUCTION_2026-08-29.md
        kind: text
        locator: "## 3. The two-copy same-channel defect"
    assessment:
      level: CONJECTURED
      summary: >-
        The implication has a complete proposer-side derivation, but the pair premise is open and
        the implication has not received independent hash-bound review. Its dimension bookkeeping
        uses the repaired linear-logarithmic overhead statement, not a constant-overhead claim.
  explicit-tensor-stable-route:
    premises:
    - HEXT.explicit-witness
    implication: >-
      A certified explicit tensor-stable family with linear defect directly establishes the goal.
    assessment:
      level: OPEN
      summary: Blueprint registered; no such family is known in the migrated record.
  holographic-toy-route:
    premises:
    - HEXT.holographic-toy
    implication: >-
      A finite-dimensional toy family satisfying the stated one-side lower and TFD-like joint upper
      bounds is an extensive p=1 counterexample family.
    assessment:
      level: OPEN
      summary: Blueprint registered; no certifiable toy family is available.
  ef-flag-route:
    premises:
    - HEXT.ef-flag-amplification
    implication: >-
      A tensor-stable flagged entanglement-of-formation construction transfers through the
      constrained-Holevo equivalence to an extensive channel violation.
    assessment:
      level: OPEN
      summary: Blueprint registered; the tensor-stable state ansatz is missing.
  noise-flag-route:
    premises:
    - HEXT.noise-flag-damping
    implication: >-
      A wrapper whose matched cross advantage dominates both self-leakage rates yields an extensive
      additivity defect.
    assessment:
      level: OPEN
      summary: Blueprint registered; no symbolic two-rate inequality has passed.
