frontier:
  tensor-strong-convergence-rate:
    task: >-
      Replace the current quantitative tensor strong-convergence certificate, which forces
      log D(J)=Omega(log J), by a cost-paying gap mechanism. Fixed-D iid Haar layers are now also
      ruled out by within-side approximate-conjugate collisions.
    kind: gate
    since: 2026-08-29
  fixed-partner-gate:
    task: Decide FCEA-2 for the BCN free-compression limit or construct a fixed-partner counterexample.
    kind: gate
    since: 2026-08-29
  fixed-dimensional-regularized-pair:
    task: >-
      Decide whether one fixed finite channel has positive Bell-certified regularized defect with
      its conjugate. Every compact fixed-dimensional heterogeneous product-Bell route now reduces
      to this single-channel target, whose Gram-channel Stinespring state must first pass the
      necessary entanglement-cost gate E_C>S(E)/2. On the depolarizing Gram branch, every factor
      with input dimension d no larger than output dimension k is now excluded.
    kind: gate
    since: 2026-08-30
  data-hiding-bell-output:
    task: >-
      Realize an extensive hidden-correlation surplus I(A:B)-2J_{A->B} using a non-Werner,
      non-maximally-correlated, realignment-positive finite channel/conjugate-channel Bell output
      with a CPTP-compatible Liouville Gram factor, equivalently an extensive
      2E_F(B:E)-S(E) surplus for its Gram channel, while proving the same channel's global side
      entropy lower bound, or rule out this joint realization. For an invertible support channel,
      first require its polar unitary to be an inner automorphism. The output dimension must be at
      least three by the qubit-output Gram Bell no-go theorem; a depolarizing qutrit Gram factor
      must additionally have input dimension at least four. More strongly, every qutrit channel
      coming from any invariant subspace of 3 tensor V_(p,q), for one irreducible environment, is
      now excluded. Repeating one environment irrep with arbitrary multiplicity is excluded too;
      boundary-input mixtures of inequivalent environment irreps are excluded too. The interior
      three-extreme inequality B((1/8)chi^2(lambda||mu))>=2H(lambda K_(r,s)) is now proved by a
      sharp KL/collision contraction and certified high-parameter endpoint bounds. Every
      irreducible-input SU(3)-covariant qutrit channel is therefore excluded; a covariant survivor
      must use reducible-input cross-irrep coherence. Every translated elementary six-edge
      cross-irrep cycle is now excluded by an exact compact rational certificate, so a survivor
      must use overlapping faces, repeated vertices, or nontrivial cycle multiplicity. All three
      unoriented adjacent elementary two-face types are now excluded by separate exact compact
      certificates. A covariant survivor must therefore use at least three faces, repeated
      vertices, or nontrivial cycle multiplicity.
    kind: gate
    since: 2026-08-30
  unbounded-family-self-leakage:
    task: >-
      Prove an o(g_J), preferably uniform O(1), absolute regularization-loss bound for the new
      product-Haar blocks; this would turn unbounded one-shot gaps into full-size extensivity.
    kind: gate
    since: 2026-08-29
  growing-level-rate:
    task: >-
      Obtain a dimension-dependent leakage rate strong enough for the full cost-weighted extensive
      inequality.
    kind: gate
    since: 2026-08-29
  independent-source-review:
    task: >-
      Review the new finite-dimensional unbounded-gap proof together with the Fukuda transfer,
      pair-to-self reduction and Hayden--Penington dimension convention.
    kind: review
    since: 2026-08-29
