claim: >-
  For every odd N>=5, the admissible repeated-edge skeleton sigma=tau=id has genus (N-1)/2; after
  any first A--B common-cycle split it remains connected with genus (N-3)/2>0, but no further
  A--B or B--C common-cycle transposition surgery is available. Thus support-two split/split
  induction is not universal, without ruling out support-three or more general local surgery.
