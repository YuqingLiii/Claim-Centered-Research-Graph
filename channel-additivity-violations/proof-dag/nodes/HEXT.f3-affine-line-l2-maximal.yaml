- qutrit-weyl-majorization-first-cumulative
claim: >-
  Every probability distribution p on F_3^2 satisfies sum_x p_x^2<=M^2, where M is its largest
  affine-line mass. Consequently the selected-line qutrit Weyl majorization holds for its first
  cumulative-sum condition.
assessment:
  level: PROVED
  caveats:
  - This atomic node proves only cumulative condition k=1; the separate
    HEXT.f3-weyl-selected-line-majorization node assembles the full theorem.
  - The proof is computer-assisted; the exact current theorem, checker and certificate hashes are
    bound by the independent review, and later changes require a new review.
  - It does not by itself prove the Shannon inequality or a qutrit Weyl no-go.
  summary: >-
    The direct exact parametric-vertex proof and all 203490 active sets passed independent
    adversarial review, closing the first majorization inequality.
