id: HEXT.same-tuple-real-werner-sector-4096-threshold
role: proof
aliases:
- repeated-tuple-real-werner-4096-threshold
claim: >-
  For every integer m>=2 and every fixed eta>=0 satisfying
  [18m(1+eta)^2+81(1+eta)^4](1-m^(-2))>4096^2, let
  U_1^(d),...,U_m^(d) be independent Haar-distributed unitaries in U(d), set
  A=1+9(1+eta)^2/m, and use the same-tuple coefficient map M_U and flip F_m from
  HEXT.same-tuple-werner-spectral-reduction. Then the probability tends to one as d tends to
  infinity that ||M_U(Y)||_infinity<=(A/m)||Y||_2 holds simultaneously for every real Werner
  coefficient Y=alpha I_(m^2)+beta F_m with alpha,beta in R. In particular, this holds for every
  integer m>=932064 and every fixed eta>=0.
routes:
  centered-4096-event-plus-spectral-equivalence:
    premises:
    - HEXT.same-tuple-werner-centered-bound-4096-threshold
    - HEXT.same-tuple-werner-spectral-reduction
    implication: >-
      Under the displayed fixed-m and fixed-eta hypothesis, the first premise says that the
      probability tends to one of the event ||R_U-I_(d^2)/m||_infinity<=H, where
      H=sqrt((A^2-1)(1-m^(-2))). For every fixed tuple, the second premise identifies this event
      exactly with the simultaneous inequality ||M_U(Y)||_infinity<=(A/m)||Y||_2 for every real
      Y=alpha I_(m^2)+beta F_m. Therefore the two events have equal probability for every d, and
      the claimed probability limit follows. The m>=932064 corollary is inherited from the first
      premise.
    proof:
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_REAL_SECTOR_4096_THRESHOLD_CONSEQUENCE_20260830.md
        kind: text
        locator: "## 2. Two-premise proof"
    assessment:
      level: PROVED
      summary: >-
        Fresh independent review passed the exact tuplewise event equivalence, dimensions,
        normalization, probability quantifiers and inherited integer threshold.
      basis:
        evidence:
        - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_REAL_SECTOR_4096_THRESHOLD_CONSEQUENCE_20260830.md
