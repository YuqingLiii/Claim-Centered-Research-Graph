id: HEXT.same-tuple-positive-spectral-flat-base-case
role: proof
aliases:
- repeated-tuple-positive-spectral-effective-rank
claim: >-
  The same-tuple coefficient map M_U=C^* tensor C^* is unital completely positive and therefore
  contracts coefficient operator norm on Hermitian inputs. Consequently every positive
  Hilbert--Schmidt unit coefficient Y with ||Y||_infinity<=A/m, equivalently spectral effective
  rank at least m^2/A^2, satisfies ||M_U(Y)||_infinity<=A/m deterministically for every unitary
  tuple.
assessment:
  level: PROVED
  caveats:
  - Spectral effective rank is a sufficient flatness condition, not a characterization of all safe coefficients.
  summary: >-
    Unital complete positivity gives a support-independent deterministic positive cone reaching
    arbitrary operator-Schmidt rank without projective-norm summation.
