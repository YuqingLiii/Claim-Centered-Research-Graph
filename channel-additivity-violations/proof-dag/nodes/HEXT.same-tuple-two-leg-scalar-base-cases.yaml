id: HEXT.same-tuple-two-leg-scalar-base-cases
role: proof
aliases:
- repeated-tuple-two-leg-base-cases
claim: >-
  Let M_U=C^* tensor C^* be the same-tuple two-leg coefficient map and let
  beta=sqrt(A/m). On the one-leg event ||C^*(X)||_infinity<=beta||X||_2, every unit-Hilbert--Schmidt
  coefficient Y satisfies ||M_U(Y)||_infinity<=A/m whenever Y is diagonal, is supported on one
  diagonal channel-copy leg, is a simple tensor, or has entrywise l_1 norm at most Am. The same
  target holds for rank-one Y=|z><z| when z has support at most Am, and, on the ordinary one-leg
  strong-convergence event B_U<=2+delta, when the coefficient-Schmidt rank of z is at most
  Am/(2+delta)^4. Independently of randomness, the canonical Bell projector and normalized flip
  coefficient also satisfy the target.
assessment:
  level: PROVED
  caveats:
  - >-
    The conditional subclasses use only the explicitly stated one-leg events; the diagonal,
    entrywise-sparse, sparse-rank-one, canonical-Bell and normalized-flip subclasses are
    deterministic.
  - >-
    It does not cover dense full coefficient-Schmidt-rank rank-one coefficients, normalized
    symmetric or antisymmetric projectors, general Werner/Bell/flip-invariant sectors, or arbitrary
    Hermitian coefficients.
  summary: >-
    Exact factorization, sparsity, diagonal, and one-leg strong-convergence arguments prove the
    target on substantial strict subclasses, while locating the first genuinely repeated-tuple
    obstruction at dense high-rank coefficients and nontrivial symmetry-sector combinations.
