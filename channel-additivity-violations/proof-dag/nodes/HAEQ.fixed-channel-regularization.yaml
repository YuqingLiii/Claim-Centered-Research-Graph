id: HAEQ.fixed-channel-regularization
role: proof
aliases:
- fixed-channel-C-equals-chi
claim: >-
  For a fixed finite-dimensional channel N, C(N) = chi(N) if and only if
  chi(N tensor n) = n chi(N) for every positive integer n.
assumptions:
  finite-dimensional-hsw-regularization:
    kind: external-theorem
    statement: >-
      For every finite-dimensional channel N, its unassisted classical capacity is
      C(N)=lim_(n->infinity) chi(N tensor n)/n.
    source:
      path: channel-additivity-violations/artifacts/holevo-additivity-equality/primary-sources/shor-quant-ph-0305035.pdf
      kind: pdf
      locator: Section 2, regularized Holevo capacity formula, PDF p. 3
