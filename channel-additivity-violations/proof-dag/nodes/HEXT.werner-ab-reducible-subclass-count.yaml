id: HEXT.werner-ab-reducible-subclass-count
role: proof
aliases:
- werner-recursive-common-cycle-subclass
claim: >-
  For the recursively A--B-reducible connected genus-h constellation subclass whose planar
  endpoints have at most N+2 label components, reverse surgery histories number at most
  binom(2N,2)^h, every original equality graph has at most N+2+4h components, and the local
  surgery cost per handle is at most 2m^4N^2/d^2=o_m(1) uniformly for N<=c_m log d.
routes:
  exact-common-cycle-recursion:
    premises:
    - HEXT.werner-contraction-skeleton-ribbon-injection
    - HEXT.werner-constellation-euler-deficit
    - HEXT.werner-common-cycle-local-surgery
    implication: >-
      For the recursively A--B-reducible connected genus-h constellation subclass whose planar
      endpoints have at most N+2 label components, reverse surgery histories number at most
      binom(2N,2)^h, every original equality graph has at most N+2+4h components, and the local
      surgery cost per handle is at most 2m^4N^2/d^2=o_m(1) uniformly for N<=c_m log d.
    proof:
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_PERMUTATION_CONSTELLATION_SURGERY_GATE_20260830.md
        kind: text
