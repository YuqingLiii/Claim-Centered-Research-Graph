id: HEXT.same-tuple-double-off-projective-frobenius-obstruction
role: obstruction
aliases:
- repeated-tuple-double-off-nuclear-loss
claim: >-
  Projective-norm summation cannot control the full double-off Hilbert--Schmidt unit sphere with a
  dimension-free constant: an equal-Schmidt-rank-r direction has exact ratio
  pi_X(E)/||E||_2=sqrt(r), and this ratio can be of order m. This obstructs only the projective
  triangle route, not the original same-tuple target.
assessment:
  level: PROVED
  caveats:
  - It does not rule out cancellations beyond the projective triangle inequality.
  summary: >-
    The double-off interface is target-tight on low projective rank but its nuclear/Hilbert ratio
    prevents a formal extension to the entire Frobenius sphere.
