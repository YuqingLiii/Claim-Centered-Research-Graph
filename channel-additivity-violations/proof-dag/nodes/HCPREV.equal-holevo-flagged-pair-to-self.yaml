      kind: review
      locator: Findings HCP-WF-IR-05--HCP-WF-IR-06
      scope: >-
        Independently passed the flagged log-sum-exp identity, equal-Holevo four-block algebra,
        strict positivity, g-1 bound and one-bit output-log-dimension overhead.
      reviewed_hash: sha256:d598b38e12441325f6f51955be5080e1cbc3400739eba59dc01bd755ed4587d3
