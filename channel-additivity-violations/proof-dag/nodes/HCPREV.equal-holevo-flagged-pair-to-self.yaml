id: HCPREV.equal-holevo-flagged-pair-to-self
role: proof
aliases:
- symmetric-equal-chi-one-bit-reduction
claim: >-
  Let A,B be finite-dimensional channels with chi(A)=chi(B)=x and
  g=chi(A tensor B)-2x>=0. For the symmetric classical-flag direct-sum channel T=A direct_sum B,
  chi(T)=x+1 and chi(T tensor T)-2chi(T)>=log_2(1+(2^g-1)/2)>=g-1, with strict positivity
  whenever g>0. If the output dimensions of A,B are d_A,d_B, then
  log_2(d_A+d_B)<=max{log_2(d_A),log_2(d_B)}+1; for equal d-dimensional outputs the direct sum
  adds exactly one output-dimension bit.
assessment:
  level: PROVED
  caveats:
  - The one-bit loss uses exact equality chi(A)=chi(B); no unbalanced-pair claim is made.
  - The result concerns the two-copy one-shot Holevo self defect, not MOE or an all-copy rate.
  - Applied to random pairs it produces a deterministic pushforward law, not the original sampling law.
  summary: >-
    A Q2-local proposer proof derives the finite flagged direct-sum Holevo log-sum-exp identity
    from arbitrary branch ensembles and applies it to the four tensor-square blocks, yielding the
    exact symmetric lower bound, one-bit loss and at-most-one-bit output log-dimension overhead.
    Fresh independent review passed the equality, strictness and dimension-scope details.
