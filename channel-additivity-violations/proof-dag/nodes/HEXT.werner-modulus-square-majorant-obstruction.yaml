id: HEXT.werner-modulus-square-majorant-obstruction
role: obstruction
aliases:
- werner-positive-square-moment-majorant-gate
claim: >-
  Although the Cauchy modulus-square quantity Q_(2k) pointwise majorizes
  Tr((R_U-I/m)^(2k)), its expectation has an explicit singleton-label floor
  E Q_(2k)>=q_m^(2k)/(m-2), so the ordinary Markov bound
  h_W^(-2k) E Q_(2k) is vacuous at the Werner target scale in the intended large-m regime. This
  obstructs only the positive modulus-square majorant route, not the exact reversal-correlated
  moment or the centered high-probability claim.
assessment:
  level: PROVED
  caveats:
  - The singleton-label formula assumes m>=3 and makes the Markov candidate vacuous at the relevant k>=2/growing orders in the intended large-m regime.
  - >-
    The lower bound concerns the majorant expectation, not the exact moment for order at least four
    and not the typical operator norm.
  summary: >-
    Taking absolute squares destroys the reversal correlation and introduces an invariant
    contraction whose explicit label family makes the resulting positive-moment Markov route
    quantitatively useless.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_CENTERED_GROWING_TRACE_METHOD_GATE_20260830.md
      kind: text
