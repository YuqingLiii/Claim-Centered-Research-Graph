      kind: review
      locator: "Finding STPW-IR-06"
      scope: >-
        Independently verified Cauchy majorization, singleton-label counting and its Markov-scale
        failure for m>=3, while excluding any lower bound on the original reversal moment.
      reviewed_hash: sha256:c6227c81050e97f42becbf354a9835efa570ea80558817bf5e18106f19cc20b0
