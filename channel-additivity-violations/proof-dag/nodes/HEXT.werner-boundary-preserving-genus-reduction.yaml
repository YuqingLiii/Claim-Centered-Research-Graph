id: HEXT.werner-boundary-preserving-genus-reduction
role: proof
aliases:
- werner-local-handle-surgery
claim: >-
  There exist universal integers a and L such that every connected minimal Werner skeleton of
  loop deficit 2h can be transformed into a genus-zero forward/reversal skeleton by at most ah
  local permutation surgeries, each changing at most L tuple-label equality incidences while
  keeping both rooted trace permutations fixed.
assessment:
  level: OPEN
  caveats:
  - Ordinary unicellular trisection proves only the unrooted topological analogue.
  - Any finite aL would suffice asymptotically, but no such trace-preserving local surgery is proved.
  - >-
    An independently proved admissible N=4 skeleton rules out every one-step fixed-rho structural
    move of union support at most four; this normal-form route must allow support at least five or
    use multiple preparatory moves/a different interface.
  summary: >-
    This weaker alternative to an explicit b<=2+4h paired-stack slicing is the smallest sufficient
    live genus-reduction lemma.
