  level: NUMERICAL
  caveats:
  - >-
    Depth-6, depth-7 and depth-10 exact attempts exhausted their adaptive ceilings; none of these
    enclosure failures is a mathematical counterexample.
  summary: >-
    The reduced six-dimensional cover remains numerically positive, but its present exact
