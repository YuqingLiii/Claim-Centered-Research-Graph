id: HEXT.f3-weyl-majorization-first-three
role: constraint
aliases:
- qutrit-weyl-majorization-k123
- f3-selected-line-first-three-cumulatives
claim: >-
  For every probability distribution p on F_3^2, select a direction containing a maximum-mass
  affine line and let r be its three parallel-line masses. The autocorrelation p*tilde(p) is
  majorized by r tensor r at cumulative indices k=1,2,3.
routes:
  exact-k3-parametric-route:
    premises:
    - HEXT.f3-affine-line-l2-maximal
    implication: >-
      The top-three autocorrelation sum is the largest collision probability among the four line
      quotients. After fixing ordered selected-line masses a>=b>=c, complete exact enumeration of
      the six-dimensional point-distribution vertices proves every quotient collision is at most
      a^2+2ab, the top-three product sum. The k=2 condition is the average of k=1 and k=3.
    proof:
      sketch: >-
        Parameterize every fixed-(a,b) vertex affinely over Q, construct its exact feasibility
        polygon, minimize four rational quadratic gaps at all boundary and interior candidates,
        then interpolate the paired second cumulative sum.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/F3_WEYL_MAJOR_FIRST_THREE_THEOREM_20260830.md
        kind: text
        locator: "## 1. Reduction of k=3 to four collision bounds"
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/F3_WEYL_MAJOR_FIRST_THREE_THEOREM_20260830.md
        kind: text
        locator: "## 3. Exact affine families and polygon minima"
      - path: channel-additivity-violations/tools/holevo-extensive-violation/certify_f3_weyl_majorization_first_three.py
        kind: script
        locator: main
    assessment:
      level: PROVED
      summary: >-
        Independent review reproduced the complete 18564-active-set k=3 certificate, verified the
        separately proved k=1 premise, and checked the paired interpolation giving k=2.
      basis:
        reviews:
        - path: channel-additivity-violations/reviews/holevo-extensive-violation/F3_WEYL_SELECTED_LINE_MAJORIZATION_INDEPENDENT_REVIEW_20260830.md
          kind: review
          locator: Finding F3W-IR-08
          scope: >-
