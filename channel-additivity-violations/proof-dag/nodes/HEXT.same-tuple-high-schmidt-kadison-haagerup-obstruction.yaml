id: HEXT.same-tuple-high-schmidt-kadison-haagerup-obstruction
role: obstruction
aliases:
- repeated-tuple-flat-square-function-nuclear-loss
claim: >-
  Applying the operator Haagerup inequality followed only by Kadison's inequality retains the
  coefficient nuclear sum even when both coefficient square functions are perfectly flat. For a
  Hilbert--Schmidt unit direction of equal operator-Schmidt rank Theta(m^2), this route gives only
  an order-one bound rather than the required order 1/m. This obstructs that proof route only,
  not the original same-tuple target.
assessment:
  level: PROVED
  caveats:
  - Exact tuple-specific cancellation can beat the Kadison relaxation for structured families.
  summary: >-
    Flat square functions do not remove the nuclear-sum loss in an unrefined
    Haagerup--Kadison argument at maximal Schmidt rank.
