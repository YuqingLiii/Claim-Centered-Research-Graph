id: HEXT.werner-uniform-cn-per-genus-obstruction
role: obstruction
aliases:
- centered-coefficientwise-genus-bound-failure
claim: >-
  A universal coefficientwise bound C^N independent of excess genus g is false for the monotone
  Weingarten expansion: the repeated edge sequence (1,2)^N realizes identity permutations with at
  least (N-1)^g monotone backtracking paths. This obstructs the absolute coefficientwise proof
  target only; the d^(-2g) factors and cancellation across skeletons prevent any inference of a
  bad exact moment or Haar-probability counterexample.
assumptions:
  collins-matsumoto-monotone-path-expansion:
    kind: external-theorem
    statement: >-
      Unitary Weingarten coefficients expand as monotone transposition-path counts by excess genus,
      with P_g(id_p)>= (p-1)^g available from paired backtracking excursions.
    source:
      path: channel-additivity-violations/artifacts/holevo-extensive-violation/primary-sources/collins-matsumoto-1701.04493.pdf
      kind: pdf
      locator: Exact expansion on PDF p. 8 and path bounds on PDF p. 9; file anchor `PDF-1.4`
assessment:
  level: PROVED
  caveats:
  - The complete repeated-word integral is small because large positive diagram coefficients cancel.
  summary: >-
    A concrete repeated-label word forces polynomial-in-N growth per handle, replacing an
    overstrong C^N-per-genus target by a viable C_0^N N^(alpha h) minimal-skeleton bound.
