id: HEXT.werner-two-boundary-constellation-count
role: proof
aliases:
- werner-target-compatible-weighted-constellation-count
claim: >-
  There exist constants D and alpha with D<sqrt(18m) in the project regime such that, for every
  N and h, the total minimal Catalan weight of connected admissible triples ABC=rho of genus h is
  at most D^N N^(alpha h).
routes:
  repaired-rooted-two-face-map-code:
    premises:
    - HEXT.werner-contraction-skeleton-ribbon-injection
    - HEXT.werner-planar-two-boundary-rooted-map-count
    - HEXT.werner-positive-genus-two-boundary-weighted-count
    - HEXT.werner-minimal-catalan-weight
    implication: >-
      The lossless rooted Werner constellation injection, the planar doubly face-rooted map bound, the
      positive-genus tree-cotree count, and the minimal Catalan weight bound jointly imply that in the
      regime m>e^18 the total minimal Catalan weight of connected admissible genus-h triples ABC=rho
      is at most 32768^N N^(43h) for every N and h, with 32768<sqrt(18m).
