id: HEXT.same-tuple-positive-summation-obstruction
role: obstruction
aliases:
- repeated-tuple-positive-nuclear-loss
claim: >-
  Combining target-sharp rank-one estimates only by positivity, spectral triangle inequality, or
  unrefined block matrix Cauchy--Schwarz incurs a trace or nuclear-norm factor; on the
  Hilbert--Schmidt unit sphere this factor is sqrt(r) for equal-weight positive rank r. Hence this
  route cannot prove a uniform positive rank-two target as A tends to one. The obstruction is to
  the stated summation route, not to the positive rank-two target itself.
assessment:
  level: PROVED
  caveats:
  - It does not exclude additional output orthogonality or cancellation beyond norm summation.
  summary: >-
    The rank-one-to-positive extension loses exactly the trace/nuclear factor, and coefficient
    eigenvector orthogonality does not imply orthogonal output supports.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SAME_TUPLE_POSITIVE_POLARIZED_GRAM_EXTENSION_20260830.md
      kind: text
      locator: "## 5. Exact obstruction to pure spectral norm summation"
    reviews:
    - path: channel-additivity-violations/reviews/holevo-extensive-violation/SAME_TUPLE_POSITIVE_WERNER_TRACE_INDEPENDENT_REVIEW_20260830.md
      kind: review
      locator: "Finding STPW-IR-04"
      scope: >-
        Independently verified the sqrt(r) trace/nuclear loss and output-alignment warning, scoped
        only to positive/triangle/block-Cauchy summation routes.
      reviewed_hash: sha256:1e6dd0ab31a8d6127c5f4b06bf3a74b7090f7723b5adc862fca785660d07acf2
frontier:
  cancellation-beyond-positive-summation:
    task: >-
      Identify output geometry or cancellation that replaces the trace/nuclear factor, or use a
      route not based on termwise positive summation.
    kind: gate
    since: 2026-08-30
