id: HEXT.same-tuple-near-diagonal-positive-base-case
role: proof
aliases:
- repeated-tuple-positive-near-diagonal-partial-trace
claim: >-
  On the uniform one-leg trace-zero coefficient event, a positive unit-Hilbert--Schmidt coefficient
  Y with trace tau<=A satisfies ||M_U(Y)||_infinity<=A/m whenever either coefficient partial trace
  has off-diagonal Frobenius norm at most (A-tau)/sqrt(m(A-1)). Deterministically, the target holds
  when tau plus the smaller off-diagonal entrywise l_1 norm of the two partial traces is at most A.
assessment:
  level: PROVED
  caveats:
  - The load-bearing trace window tau<=A excludes general positive rank two and higher rank.
  summary: >-
    The positive partial-trace contraction gives a target-tight neighborhood of diagonal partial
    traces and includes explicit dense non-rank-one positive coefficients with small secondary
    spectral weight.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/SAME_TUPLE_POSITIVE_POLARIZED_GRAM_EXTENSION_20260830.md
      kind: text
      locator: "## 3. New positive target-tight subclasses"
    reviews:
    - path: channel-additivity-violations/reviews/holevo-extensive-violation/SAME_TUPLE_POSITIVE_WERNER_TRACE_INDEPENDENT_REVIEW_20260830.md
      kind: review
      locator: "Finding STPW-IR-02"
      scope: >-
        Independently verified both sufficient thresholds and the explicit dense rank-two family,
        retaining tau<=A and excluding a uniform rank-two statement.
      reviewed_hash: sha256:29f5f6d931fb0fd4bfcb8c1df28694b52113b11890f292af8d6006a1a4764d24
