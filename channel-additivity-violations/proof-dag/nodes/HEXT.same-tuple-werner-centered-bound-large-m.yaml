id: HEXT.same-tuple-werner-centered-bound-large-m
role: proof
aliases:
- repeated-tuple-werner-centered-large-m
claim: >-
  For every integer m>e^18 and every fixed eta>=0, let U_1^(d),...,U_m^(d) be independent Haar-distributed unitaries in U(d), define R_U=m^(-2)sum_(v,a=1)^m U_v^*U_a tensor U_a^*U_v, A=1+9(1+eta)^2/m, and H=sqrt((A^2-1)(1-m^(-2))). Then lim_(d->infinity) Pr{||R_U-I_(d^2)/m||_infinity>H}=0.
routes:
  reviewed-all-genus-log-moment:
    premises:
    - HEXT.werner-centered-reversal-return-bound
    - HEXT.werner-two-boundary-constellation-count
    - HEXT.werner-admissible-equality-component-genus-bound
    - HEXT.werner-two-component-low-genus-return-separation
    - HEXT.werner-two-component-nonreturn-weighted-count
    - HEXT.werner-monotone-weingarten-tail-summability
    - HEXT.werner-constellation-euler-deficit
    implication: >-
      The exact centered forward/block-reversal expansion and return estimate, combined with the listed proved connected every-genus weighted-count, equality-component, low-genus return-separation, residual two-component, monotone-tail, and Euler-deficit premises, imply the following. Let D,alpha be witnesses for HEXT.werner-two-boundary-constellation-count, and set u=(3m-4)/(m^2H), b_D=D/(mH), a=4096/(mH), x_alpha=m^2N^alpha/d^2, x_24=m^2N^24/d^2, and theta=6(2N)^(7/2)/d^2. For every even N with x_alpha,x_24,theta<1, E Tr[(R_U-I_(d^2)/m)^N]/H^N <= 2d^2u^N + m^2(1-theta)^(-1)[b_D^N(1-x_alpha)^(-1)+a^N N^24 x_24(1-x_24)^(-1)]. For m>e^18 and fixed eta>=0, 0<u<1, 0<a<1, and 0<b_D<1. Choosing the even order N(d)=2ceil(gamma log(d)/2) with gamma>2/log(1/u) makes every term tend to zero, and even-moment domination plus Markov's inequality proves the node claim.
