id: HAEQ.pair-to-self-reduction
role: proof
aliases:
- direct-sum-reduction
claim: >-
  A strict finite-dimensional Holevo additivity violation for some pair of channels can be
  converted, by a classical-flag direct-sum construction, into a finite-dimensional channel T with
  chi(T tensor T) > 2 chi(T).
assumptions:
  fukuda-wolf-2007:
    kind: external-theorem
    statement: >-
      For every finite family of finite-dimensional channels T_i, the one-shot Holevo quantity of
      their classical-flag direct sum satisfies
      chi(direct_sum_i T_i)=log_2(sum_i 2^(chi(T_i))).
    source:
      path: channel-additivity-violations/artifacts/holevo-additivity-equality/primary-sources/fukuda-wolf-0704.1092.pdf
      locator: Section 2, Proposition 1(4) and Eq. (6), PDF pp. 1-2
      kind: pdf
