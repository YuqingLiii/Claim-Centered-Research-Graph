id: HEXT.werner-planar-two-boundary-rooted-map-count
role: proof
aliases:
- werner-planar-doubly-face-rooted-count
claim: >-
  For every integer e>=1, the number R_(e,0)^(2) of isomorphism classes of connected oriented
  planar maps with e edges, exactly two ordered faces, and one distinguished directed boundary
  halfedge on each face satisfies R_(e,0)^(2)<=e^2 binom(2e,e).
assessment:
  level: PROVED
  caveats:
  - This is an ordinary rooted-map count, not a label-compatible physical surgery.
  summary: >-
    Independent adversarial review reconstructed the canonical unicyclic-edge deletion code,
    including loops, parallel cores, bridges, repeated corners, automorphisms, both directed face
    roots and the e=1 endpoint, and proved the exact doubly face-rooted inequality.
