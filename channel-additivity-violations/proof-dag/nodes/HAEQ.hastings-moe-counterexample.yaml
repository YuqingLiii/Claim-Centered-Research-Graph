id: HAEQ.hastings-moe-counterexample
role: outcome
aliases:
- hastings
claim: >-
  There exist finite-dimensional quantum channels N and M for which von-Neumann minimum output
  entropy is strictly subadditive: Smin(N tensor M) < Smin(N) + Smin(M).
assumptions:
  hastings-2009:
    kind: external-theorem
    statement: >-
      Hastings' finite-dimensional random-channel theorem disproves universal additivity of
      minimum output von-Neumann entropy: for sufficiently large finite D and then sufficiently
      large finite N, a random-unitary channel E and its conjugate have a strict violation with
      nonzero probability.
    source:
      path: channel-additivity-violations/artifacts/holevo-additivity-equality/PRIMARY_SOURCE_AUDIT_20260829.md
      locator: "`Hastings quantifiers`"
      kind: text
assessment:
  level: PROVED
  summary: >-
    Independent source-and-quantifier review verified that Hastings Theorem 1 gives exactly the
    finite-dimensional existential pair claim, with the finite-D then finite-N order and no
    typicality or same-witness Holevo overclaim.
  basis:
