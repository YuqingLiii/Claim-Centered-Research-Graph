id: HEXT.werner-common-cycle-local-surgery
role: proof
aliases:
- werner-support-two-split-split-surgery
claim: >-
  If a transposition t=(xy) has x,y in the same cycle of both A and B, then
  (A,B,C)->(At,tB,C) preserves ABC=rho, raises #A+#B by two and, whenever connectedness is
  preserved, lowers genus by exactly one while changing at most two sigma arrows and two tau
  arrows. The analogous B--C surgery has the same genus conclusion and changes at most two tau
  arrows.
assessment:
  level: PROVED
  caveats:
  - Same-cycle and post-surgery connectedness hypotheses are load-bearing; the move is not universal.
  summary: >-
    Independent review verified the support-two, rooted-boundary-preserving handle surgery on its
    exact common-cycle and connectedness domain.
