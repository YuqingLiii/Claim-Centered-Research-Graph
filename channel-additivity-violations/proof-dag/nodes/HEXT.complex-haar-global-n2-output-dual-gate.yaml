id: HEXT.complex-haar-global-n2-output-dual-gate
role: constraint
aliases:
- global-two-copy-output-coefficient-duality
claim: >-
  For N=C tensor C with output dimension m^2, the global two-copy purity target
  sup_rho ||N(rho)||_2<=A/m is exactly equivalent to
  sup_(Y=Y^*,||Y||_2=1)||N^*(Y)||_infinity<=A/m. The ambient Hermitian coefficient space has real
  dimension m^4 and its unit sphere has intrinsic dimension m^4-1, independently of the input
  dimension d, so pointwise same-tuple scalar strong-norm convergence with uniform free-model
  slack can be upgraded by a finite coefficient net.
assessment:
  level: PROVED
  caveats:
  - >-
    The output-duality and finite-net reduction are proved, but the required same-tuple convergence
    premise is a separate OPEN node; this node does not assert that premise.
  - This establishes at most global n=2 and gives no inference for n>=3 or all-copy regularization.
  summary: >-
    Dualizing the output replaces the failed d^2-dimensional pure-input net by a fixed m^4-dimensional
    scalar coefficient net without relaxing to the false unrestricted replica operator norm.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/COMPLEX_HAAR_GLOBAL_N2_CONCENTRATION_GATE_20260830.md
      kind: text
      locator: "## 9. Minimal viable replacement: dualize the output, not the input sphere"
    reviews:
    - path: channel-additivity-violations/reviews/holevo-extensive-violation/COMPLEX_HAAR_GLOBAL_N2_GATE_POST_REPAIR_INDEPENDENT_REVIEW_20260830.md
      kind: review
      locator: "Finding CHG2-PRR-VERDICT-OUTPUT-DUAL"
      scope: >-
        Independently reconstructed the exact output duality, Hermitian coefficient-space
        dimensions, Lipschitz estimate and finite-net implication; it did not establish the
        separately open same-tuple convergence premise.
      reviewed_hash: sha256:b91aeedc542797eda56f8895c548ebe33bd68121ed1bf2626506650d15e10bb3
