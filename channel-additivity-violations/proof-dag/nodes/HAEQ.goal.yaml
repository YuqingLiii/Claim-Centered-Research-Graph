id: HAEQ.goal
role: outcome
aliases:
- equality-question
claim: >-
  Universal finite-dimensional Holevo additivity is false: there exists a finite-dimensional
  channel T with chi(T tensor T) > 2 chi(T), and consequently C(T) > chi(T).
routes:
  hastings-direct-transfer-direct-sum:
    premises:
    - HAEQ.hastings-moe-counterexample
    - HAEQ.direct-moe-to-holevo-transfer
    - HAEQ.pair-to-self-reduction
    - HAEQ.fixed-channel-regularization
    implication: >-
      Hastings supplies a finite von-Neumann minimum-output-entropy pair defect; Shor's explicit
      Weyl-labelled extension preserves that numerical defect as a finite Holevo pair defect; the
      direct-sum reduction turns it into a single-channel two-copy counterexample, which implies
      strict regularization gain.
    proof:
      sketch: >-
        Apply the output-dimension Holevo upper bound and Weyl-orbit achievability to the one-channel
        and joint MOE minimizers, subtract the exact identities, then apply the four-block flagged
        direct-sum calculation. The independently proved fixed-channel regularization equivalence
        then turns the exhibited n=2 failure into C(T)>chi(T). Do not identify the Hastings pair
        with either extended channel.
      sources:
      - path: channel-additivity-violations/artifacts/holevo-additivity-equality/DIRECT_MOE_TO_HOLEVO_TRANSFER_20260830.md
        kind: text
        locator: "## Product identity"
      - path: channel-additivity-violations/artifacts/holevo-additivity-equality/PRIMARY_SOURCE_AUDIT_20260829.md
        kind: text
        locator: "## Resulting logic"
      - path: channel-additivity-violations/artifacts/holevo-additivity-equality/PAIR_TO_SELF_PROOF_20260829.md
        kind: text
        locator: "## Proof"
      - path: channel-additivity-violations/artifacts/holevo-additivity-equality/round-1-audit.md
        kind: text
        locator: "## 关键 reduction"
    assessment:
      level: PROVED
      summary: >-
        Independent review passed the exact existential quantifier composition. The three witness
        premises and the separately reviewed fixed-channel regularization lemma are PROVED, so the
        capacity consequence is machine-visible without duplicating its HSW assumption here.
      basis:
        reviews:
        - path: channel-additivity-violations/reviews/holevo-additivity-equality/Q1_UPSTREAM_DEPENDENCY_AND_QUANTIFIER_INDEPENDENT_REVIEW_20260830.md
          kind: review
          locator: Finding Q1UD-04
          scope: >-
            Independently checked the existential/universal composition, witness changes and final
            two-copy-to-capacity implication; completion is withheld for two unfinished premises
            and the missing route-level HSW assumption.
          reviewed_hash: sha256:2b2940d578ed8f68e77161ff1b093258781ac2e90f365b97953b0f8206ad3d4d
        - path: channel-additivity-violations/reviews/holevo-additivity-equality/Q1_UPSTREAM_REPAIR_AMENDMENT_INDEPENDENT_REVIEW_20260830.md
          kind: review
          locator: Finding Q1RA-03
          scope: >-
            Post-repair review verified the exact Shor capacity-limit interface, the explicit local
            superadditivity/Fekete step, and closure of all three PROVED premises.
          reviewed_hash: sha256:2b2940d578ed8f68e77161ff1b093258781ac2e90f365b97953b0f8206ad3d4d
