id: HEXT.werner-contraction-skeleton-ribbon-injection
role: proof
aliases:
- werner-two-boundary-ribbon-encoding
claim: >-
  Every balanced Werner contraction skeleton on the E=2N physical slots has a lossless encoding
  by permutations A=J sigma^(-1), B=sigma K tau sigma^(-1), C=sigma tau^(-1) satisfying
  ABC=rho, where rho is the fixed rooted two-cycle physical boundary permutation; conversely
  sigma=A^(-1)J and tau=C^(-1)A^(-1)J. Its canonical orientable incidence ribbon realization has
  E darts, 2E=4N ordinary ribbon edges and exactly the two rooted rho faces, with no factorial
  edge-ordering decoration.
assessment:
  level: PROVED
  caveats:
  - The exact object has 4N ordinary incidence edges, so it does not instantiate the earlier favorable 2N-edge generic-map count.
  summary: >-
    Independent review verified the exact constellation coordinates, inverse map, rooted physical
    face order, no-factorial conclusion and corrected 4N ordinary-edge count.
