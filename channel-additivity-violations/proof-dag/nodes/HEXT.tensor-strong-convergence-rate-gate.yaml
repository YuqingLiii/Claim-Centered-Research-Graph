      Prove or refute an explicit high-probability coefficient-uniform event with every J,D,
      effective-linearization, algebraic-kernel, tail and net dependence recorded. This can quantify
      the absolute-unbounded construction but cannot prove full size unless a new gap term pays for
      J log D. For full size, seek a fixed-D all-depth physical entropy estimate, a positive finite-
      dimensional regularized cross defect, or a new family whose gap pays all dimension cost.
    kind: gate
    since: 2026-08-29
