claim: >-
  Every SU(3)-covariant qutrit channel supported on a bent chain of three distinct elementary
  Pieri faces satisfies 2 barS_min(Phi)<=2S_min(Phi)<S((Phi tensor barPhi)(Omega)) for all allowed
  labels, weights, and phases.
routes:
