    premises:
    - HEXT.su3-bent-hc-hm-hm-three-face-bell-no-go
    - HEXT.su3-bent-hm-hm-hc-three-face-bell-no-go
    - HEXT.su3-bent-left-ternary-three-face-bell-no-go
    - HEXT.su3-bent-right-ternary-three-face-bell-no-go
    - HEXT.su3-bent-central-ternary-three-face-bell-no-go
    - HEXT.su3-bent-cm-hm-hc-three-face-bell-no-go
    implication: >-
      The exact translation classification has six bent orientations; proving each atomic
      orientation node establishes the universal bent-chain claim.
    assessment:
      level: OPEN
      summary: >-
        Bent-left and bent c/m,h/m,h/c are PROVED, one orientation has a proposer-side exact
        certificate at CONJECTURED, and three remain NUMERICAL; the six-way conjunction is OPEN.
  full-incidence-fixed-three-cover-scan:
