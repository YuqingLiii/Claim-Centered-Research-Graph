id: HEXT.werner-centered-reversal-return-bound
role: proof
aliases:
- werner-forward-reversal-return-sector
claim: >-
  For every integer m>=2 and independent complex Haar U_1,...,U_m in U(d), set
  A_(v,a)=U_v^*U_a and S_U=m^(-2)sum_(v!=a) A_(v,a) tensor A_(v,a)^*. For every integer
  N>=1, Tr(S_U^N)=m^(-2N)sum_e Tr(W_U(e)) overline(Tr(check W_U(e))), where W_U is the
  forward product and check W_U reverses its N edge blocks. For every even N, the total absolute
  contribution of all edge sequences whose forward or block-reversed free word is the identity is
  at most 2d^2((3m-4)/m^2)^N.
assumptions:
  akemann-ostrand-free-generator-norm:
    kind: external-theorem
    statement: >-
      For the left-regular representation lambda of the free group F_m on standard generators
      g_1,...,g_m, ||sum_(v=1)^m lambda(g_v)||=2sqrt(m-1) for every integer m>=2.
    source:
      path: channel-additivity-violations/artifacts/holevo-extensive-violation/AKEMANN_OSTRAND_FREE_GENERATOR_NORM_SOURCE_NOTE_20260830.md
      kind: text
      locator: Bibliographic source entry `Computing norms in group C*-algebras`
