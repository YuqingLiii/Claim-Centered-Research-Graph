id: HEXT.same-tuple-werner-centered-bound
role: proof
aliases:
- repeated-tuple-werner-random-spectrum-bound
claim: >-
  For fixed m and independent complex Haar U_1,...,U_m, the probability that
  ||R_U-I/m||_infinity exceeds sqrt((A^2-1)(1-m^(-2))) tends to zero as d tends to infinity.
assessment:
  level: CONJECTURED
  caveats:
  - The asymptotic quantifier fixes both m and eta before d tends to infinity.
  - >-
    Expectation safety and fixed normalized moments do not exclude adaptive extreme-eigenvalue
    outliers; no proof or generic complex-Haar counterexample is currently known.
  - >-
    The all-equal deterministic tuple violates the P_+ target in the relevant regime but has Haar
    probability zero and does not refute this probabilistic claim.
  summary: >-
    The exact subclaim under mH>4096 is independently PROVED, uniformly including every integer
    m>=932064 and strictly improving the earlier m>e^18 range. This broader all-fixed-m statement
    remains unresolved and needs a smaller planar base, cancellation, or a different method.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_FLIP_SECTOR_SAME_TUPLE_GATE_20260830.md
      kind: text
      locator: "## 9. What would close the sector"
