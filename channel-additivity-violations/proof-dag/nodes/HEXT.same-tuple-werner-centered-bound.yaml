      kind: node-evidence
      note: >-
        Non-load-bearing PROVED large-m subclaim: the reviewed result is restricted to fixed integer
        m>e^18 and cannot promote this broader all-fixed-m node.
    - path: channel-additivity-violations/proof-dag/nodes/HEXT.same-tuple-werner-centered-bound-4096-threshold.yaml
      kind: node-evidence
