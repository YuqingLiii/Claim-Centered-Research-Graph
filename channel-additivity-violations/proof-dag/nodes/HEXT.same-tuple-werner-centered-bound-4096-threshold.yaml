        locator: "## 3. Refined master inequality"
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_CENTERED_THRESHOLD_REFINEMENT_20260830.md
        kind: text
        locator: "## 5. Exact uniform integer corollary"
    assessment:
      level: PROVED
