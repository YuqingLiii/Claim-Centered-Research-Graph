id: HEXT.same-tuple-werner-centered-bound-4096-threshold
role: proof
aliases:
- repeated-tuple-werner-centered-unabsorbed-planar
claim: >-
  For every integer m>=2 and every fixed eta>=0 satisfying
  [18m(1+eta)^2+81(1+eta)^4](1-m^(-2))>4096^2, let
  U_1^(d),...,U_m^(d) be independent Haar-distributed unitaries in U(d), define
  R_U=m^(-2)sum_(v,a=1)^m U_v^*U_a tensor U_a^*U_v,
  A=1+9(1+eta)^2/m, and H=sqrt((A^2-1)(1-m^(-2))). Then
  lim_(d->infinity) Pr{||R_U-I_(d^2)/m||_infinity>H}=0. In particular, the condition holds
  for every integer m>=932064 and every fixed eta>=0.
routes:
  unabsorbed-planar-log-moment:
    premises:
    - HEXT.werner-centered-reversal-return-bound
    - HEXT.werner-contraction-skeleton-ribbon-injection
    - HEXT.werner-planar-two-boundary-rooted-map-count
    - HEXT.werner-minimal-catalan-weight
    - HEXT.werner-positive-genus-two-boundary-weighted-count
    - HEXT.werner-admissible-equality-component-genus-bound
    - HEXT.werner-two-component-low-genus-return-separation
    - HEXT.werner-two-component-nonreturn-weighted-count
    - HEXT.werner-monotone-weingarten-tail-summability
    - HEXT.werner-constellation-euler-deficit
    implication: >-
      Keep the proved planar bound 16N^2 4096^N separate instead of absorbing its polynomial
      factor into 32768^N, and use the proved 4096^N N^(43h) bound only for connected h>=1.
      With u=(3m-4)/(m^2H), a=4096/(mH), x_43=m^2N^43/d^2,
      x_24=m^2N^24/d^2, and theta=6(2N)^(7/2)/d^2, the listed premises imply, for every even
      N>=2 with x_43,x_24,theta<1, E Tr[(R_U-I_(d^2)/m)^N]/H^N <= 2d^2u^N +
      m^2 a^N(1-theta)^(-1)[16N^2+x_43(1-x_43)^(-1)+N^24 x_24(1-x_24)^(-1)].
      The displayed parameter hypothesis is exactly (mH)^2>4096^2, hence a<1; also u<1 for
      every m>=2. A logarithmic even moment and Markov's inequality prove the probability claim.
      The left side of the parameter condition is minimized at eta=0 and is strictly increasing
      in m, while exact evaluation at m=932063 and m=932064 proves the stated uniform integer
      corollary.
