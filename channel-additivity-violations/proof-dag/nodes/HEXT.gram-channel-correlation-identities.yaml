  gram-channel-ef-bridge-recorded:
    date: '2026-08-30'
    type: created
    summary: >-
      Re-expressed the hidden-correlation screening functional exactly as a constrained Holevo
      quantity and as 2E_F(B:E)-S(E) for the Gram channel's maximally mixed Stinespring state.
    sources:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/GRAM_CHANNEL_CORRELATION_IDENTITIES_20260830.md
      kind: text
  choi-direction-repair:
    date: '2026-08-30'
    type: repair-applied
    summary: >-
      Made the Choi swap and measurement direction explicit. The output-side quantity is the
