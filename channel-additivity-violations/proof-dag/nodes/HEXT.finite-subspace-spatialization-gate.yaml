id: HEXT.finite-subspace-spatialization-gate
role: obstruction
aliases:
- finite-restriction-spatialization
claim: >-
  Finite input restrictions of the infinite commuting-operator channels inherit every all-copy
  side entropy lower bound, but the natural finite-set tensor-product spatialization does not
  inherit the low commuting joint witness: its matched-sector Gram matrix is exactly the Gram
  matrix of a one-channel translate test state.
assessment:
  level: CONJECTURED
  caveats:
  - A different finite-dimensional joint vector or non-finite-set spatialization could evade the Gram identity.
  - This does not prove finite-dimensional regularized MOE additivity.
  summary: >-
    Restricting the input is sufficient for the side inequality but not for the commuting-to-tensor
    conversion. For K_F=span{delta_x:x in F}, the translate-overlap formulas show exact equality of
    the side and matched-sector spectra, so the obvious Omega_F witness reproduces the same entropy
    loss on both sides of the desired gap.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/FINITE_SUBSPACE_SPATIALIZATION_GATE_20260830.md
      kind: text
      locator: "## Exact calculation for the natural finite-set spatialization"
frontier:
  asymmetric-spatialization:
    task: >-
      Construct a finite spatial correlation reproducing the commuting low-output moments without
      a one-side vector having the same Gram spectrum, while retaining inherited all-copy bounds.
    kind: gate
    since: 2026-08-30
events:
  finite-restriction-tradeoff-recorded:
    date: '2026-08-30'
    type: created
    summary: >-
      Separated the automatically inherited all-copy side bound from the missing spatial joint
      witness and proved the exact finite-set Gram-matrix tradeoff.
    sources:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/FINITE_SUBSPACE_SPATIALIZATION_GATE_20260830.md
      kind: text
