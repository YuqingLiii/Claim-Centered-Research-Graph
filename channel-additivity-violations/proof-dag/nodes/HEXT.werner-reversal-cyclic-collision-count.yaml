id: HEXT.werner-reversal-cyclic-collision-count
role: proof
aliases:
- centered-reversal-free-reduction-count
claim: >-
  For every m and N, the number of edge-block sequences whose forward free-group word and
  block-reversed word have cyclically equal reduced cores is at most
  (2N+1)81^N m^(N+2), and hence at most 243^N m^(N+2).
assessment:
  level: PROVED
  caveats:
  - >-
    The count controls the fixed-word genus-zero collision support but provides no finite-d
    positive-genus Weingarten remainder uniform for N=Theta(log d).
  summary: >-
    Two circular noncrossing cancellation matchings and a cyclic-core equality graph leave at most
    N+2 free label components, proving the needed exponential rather than factorial collision count.
  basis:
    evidence:
