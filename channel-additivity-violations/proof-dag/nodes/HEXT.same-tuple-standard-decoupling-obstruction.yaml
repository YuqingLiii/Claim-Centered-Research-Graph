      kind: review
      locator: "Finding STGW-IR-04"
      scope: >-
        Independently verified that phase decoupling preserves the shared tuple and that any
        transferable fixed-factor comparison misses the target; it did not exclude asymptotically
        constant-one specialized comparisons.
      reviewed_hash: sha256:c927613b272448126f741a49ebe11a706a6eee9c518a47e5db24144803af5cd7
