id: HEXT.same-tuple-standard-decoupling-obstruction
role: obstruction
aliases:
- repeated-tuple-constant-factor-decoupling-gate
claim: >-
  Standard phase decoupling of the order-two same-tuple coefficient chaos does not create an
  independent Haar tuple on the second tensor leg, and any comparison that loses a fixed
  multiplicative constant C>1 cannot transfer the target-sharp A/m bound because it yields
  C^2*A/m after squaring. This obstructs the unrefined phase or constant-factor decoupling route,
  not an asymptotically constant-one specialized comparison or the same-tuple claim itself.
assessment:
  level: PROVED
  caveats:
  - It does not rule out specialized decoupling with multiplicative loss 1+O(1/m) and strong tails.
  summary: >-
    The dependence survives standard phase randomization, while the available O(1/m) slack cannot
    absorb a fixed comparison constant; this closes only a tempting unrefined proof route.
