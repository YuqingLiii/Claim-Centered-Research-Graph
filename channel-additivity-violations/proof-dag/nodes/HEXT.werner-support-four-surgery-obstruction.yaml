id: HEXT.werner-support-four-surgery-obstruction
role: obstruction
aliases:
- werner-n4-support-at-most-four-no-go
claim: >-
  On X={0,...,7}, let A=(0 5)(1 6)(2 7)(3 4), B=(0 4)(1 5)(2 6)(3 7),
  C=(4 6)(5 7), and rho=(0 3 2 1)(4 7 6 5). This is a connected admissible N=4
  genus-one Werner skeleton, and every fixed-rho structural move A'=Ap, B'=p^(-1)Bq,
  C'=q^(-1)C with |supp(p) union supp(q)|<=4 satisfies #A'+#B'+#C'<=14.
  Hence no connected structural move of union support at most four lowers its genus.
routes:
  normal-form-cayley-obstruction:
    premises:
    - HEXT.werner-boundary-surgery-normal-form
    implication: >-
      On X={0,...,7}, let A=(0 5)(1 6)(2 7)(3 4), B=(0 4)(1 5)(2 6)(3 7),
      C=(4 6)(5 7), and rho=(0 3 2 1)(4 7 6 5). This is a connected admissible N=4
      genus-one Werner skeleton, and every fixed-rho structural move A'=Ap, B'=p^(-1)Bq,
      C'=q^(-1)C with |supp(p) union supp(q)|<=4 satisfies #A'+#B'+#C'<=14.
      Hence no connected structural move of union support at most four lowers its genus.
    proof:
      sources:
      - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_BOUNDARY_PRESERVING_SUPPORT_FIVE_GATE_20260830.md
        kind: text
        locator: "## 5. Exact obstruction for every support of size at most four"
    assessment:
      level: PROVED
      caveats:
      - The obstruction is for this one admissible N=4 input skeleton, not every skeleton.
      summary: >-
        Independent review verified the input skeleton and proved the full support-at-most-four
        cycle-sum obstruction by a separate forest/Cayley-distance argument.
      basis:
        counterexamples:
        - path: channel-additivity-violations/artifacts/holevo-extensive-violation/WERNER_BOUNDARY_PRESERVING_SUPPORT_FIVE_GATE_20260830.md
          kind: counterexample
          locator: "## 5. Exact obstruction for every support of size at most four"
