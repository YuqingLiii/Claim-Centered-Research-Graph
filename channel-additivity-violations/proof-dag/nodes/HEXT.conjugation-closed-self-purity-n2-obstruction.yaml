id: HEXT.conjugation-closed-self-purity-n2-obstruction
role: obstruction
aliases:
- complex-conjugation-closed-bell-collision
claim: >-
  Let L(X)=q^(-1)sum_v W_v X W_v^* and let C be a complementary channel. If the finite unitary
  tuple is closed under entrywise conjugation up to a permutation and phases, then a physical
  maximally entangled input at copy number two gives
  mu_2(C tensor C)>=2/q^2-1/q^3. Hence the physical self-purity target
  mu_2(C tensor C)<=(A/q)^2 fails whenever A^2<2-1/q, even for genuinely complex tuples without a
  common real orientation.
assessment:
  level: PROVED
  caveats:
  - Exact conjugation closure is a measure-zero dependent subclass of the independent complex-Haar
    ensemble and does not refute the existential generic-complex all-copy node.
  summary: >-
    Pair each Kraus word with its conjugate partner. The q matched pairs produce the same Bell ray;
    rank-purity convexity for the remaining q^2-q vectors gives the exact lower bound.
