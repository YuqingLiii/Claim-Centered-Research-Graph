id: HEXT.qutrit-weyl-random-unitary-bell-gate
role: constraint
aliases:
- qutrit-weyl-autocorrelation-entropy-gate
- qutrit-pauli-random-unitary-bell-screen
claim: >-
  For a qutrit Weyl random-unitary channel Phi_p, the conjugate-Bell output entropy is exactly the
  Shannon entropy of p's group autocorrelation, while four stabilizer inputs upper-bound the
  regularized side entropy by the smallest quotient entropy. Hence the family is controlled by an
  explicit classical Shannon-entropy inequality on F_3^2. The corresponding Renyi-2 inequality
  also holds globally; the Shannon inequality is resolved by the downstream selected-line
  majorization node.
assessment:
  level: PROVED
  caveats:
  - This node proves the reduction, not the classical inequality by itself; the downstream
    HEXT.qutrit-weyl-random-unitary-bell-no-go node assembles the no-go.
  - The seeded simplex scan is NUMERICAL route-selection evidence only.
  - Positive classical gate value would not itself prove a channel gap because stabilizer inputs
    need not be globally optimal.
  - The result covers the product conjugate-Bell witness, not non-Bell joint inputs.
  summary: >-
    The direct Weyl Bell/stabilizer identities, regularized product-input side bound and full-simplex
    Renyi-2 shadow passed independent adversarial review.
