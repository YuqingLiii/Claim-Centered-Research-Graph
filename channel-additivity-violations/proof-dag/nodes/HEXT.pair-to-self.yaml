id: HEXT.pair-to-self
role: proof
aliases:
- pair-to-self
claim: >-
  A Holevo pair gap g for finite-dimensional channels N and M can, after balancing their one-shot
  Holevo quantities within one bit by a bounded classical side channel and taking T = N' direct-sum
  M', be converted into chi(T tensor T) - 2 chi(T) at least g - log_2(9/4), with only constant
  gap loss and overhead at most linear in the original logarithmic input/output dimensions.
assessment:
  level: PROVED
  summary: >-
    Independent review passed the balancing and four-block gap algebra but found that the former
    claim overstated general dimension overhead as constant. The repaired claim now matches the
    artifact's linear-logarithmic dimension budget and passed fresh hash-bound amendment review.
  basis:
    evidence:
    - path: channel-additivity-violations/artifacts/holevo-extensive-violation/PAIR_TO_SELF_REDUCTION_2026-08-29.md
      kind: text
      locator: "## 3. The two-copy same-channel defect"
