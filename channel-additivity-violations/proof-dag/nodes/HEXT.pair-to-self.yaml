      kind: review
      locator: Finding AUR-A03
      scope: >-
        Independently passed the balancing identity, four-block algebra, constant gap loss and
        repaired linear-logarithmic dimension overhead.
      reviewed_hash: sha256:191443c198801c324a9a44716cfca413543230365292511b0924db6ce14137a2
