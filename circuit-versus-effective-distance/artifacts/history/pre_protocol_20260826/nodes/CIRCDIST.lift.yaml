id: CIRCDIST.lift
role: outcome
aliases:
- CLOSED-LIFT
claim: >-
  In graph-like detector error models with fixed boundaries — graph-like read per-sector (iff Def
  1.12) and quantified over memory experiments C_R(M) of legal (iff Def 1.3),
  measurement-consistent (MC, iff Def 2.1) schedules M with R >= d_sec rounds, d_sec the sector's
  own spatial distance (d_X for the Z-memory, d_Z for the X-memory) — an independently reviewed
  necessary-and-sufficient structural criterion (in graph-covering, voltage-graph, or
  chain-complex form) characterizes when d_circ = d_eff, of the shape "d_circ equals the minimum
  over nontrivial effective logicals gamma of the length of the shortest closed spacetime lift of
  gamma", with vanishing minimal time-direction repair cost as the equal-weight liftability
  condition at minimum weight; the criterion recovers the non-interleaved equality d_circ = d_eff
  as a corollary and is accompanied by an explicit interleaved example with d_circ > d_eff.
assessment:
  level: PROVED
  caveats:
  - 'Decision-sheet sweep CLOSED (wave-32): 25 rows — 15 applied, 6 unapplied items folded or
    discharged in the final edit (both R6 halves incl. (MC) in claim AND implication; the
    wave-17 implication-adequacy audit; digest binding), 5 rows/13 caveats ruled out-of-claim
    with reasons, 1 superseded. Nothing accepted remains unapplied. (MC) had TWO loss
    carriers (R6 and assembly caveat C-M6, both never transferred).'
  - 'S2 (conservative scoping): the folded R >= d_sec quantifier heads the sentence and scopes
    over all three clauses, while C-M7 scoped it to the criterion clause only — the claim
    asserts less than provable; honest scope note, non-blocking.'
  - The repair >= 3 regime, min-cost-covering extension, and large proposer scans remain
    excluded, per the children's certifications.
  - Under the min-over-sectors convention the [[4,2,2]] witness is the sole load-bearing
    example for the existential clause (its repair = 1 re-derived from Def 5.2 by the wave-31
    reviewer; the existential clause is now ENTAILED, not merely corroborated).
  - Per-sector scope, as pinned in the claim text.
  - 'Shared model design is not independence (standing campaign limitation): every
    independent implementation re-implements the frozen 公共定义 fault inventory, so a shared
    misreading of the frozen text would survive all of them. SPOT-VALIDATED AGAINST STIM
    1.16.0 (artifacts/circdist_stim_crossval_20260823.md, 2026-08-25): the [[4,2,2]] arm (176
    (MC) schedules re-enumerated, 3 gap witnesses, 1 both-sector, d_circ = 2 at R = 2..5,
