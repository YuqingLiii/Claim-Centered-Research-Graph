    cross-check exists anywhere in this subtree" was FACTUALLY WRONG — CIRCDIST.lift.gap-example
    already recorded stim 1.16.0 cross-validation (its lines 71 and 121).'
  - 'Disjunct availability: of the claim''s three offered forms (graph-covering, voltage-graph,
    chain-complex), only the chain-complex disjunct is delivered by the children.'
  summary: 'Promoted CERTIFIED* -> PROVED 2026-08-23 (wave 32): 课题二 (closed-lift
    characterization) is CLOSED AT PROVED — all three premises PROVED (iff via the wave-29
