    2). The prior wording "no stim cross-check exists anywhere in this subtree" was FACTUALLY WRONG —
    CIRCDIST.lift.gap-example already recorded stim 1.16.0 cross-validation (its lines 71 and 121).'
  - 'Disjunct availability: of the claim''s three offered forms (graph-covering, voltage-graph, chain-complex),
    only the chain-complex disjunct is delivered by the children.'
