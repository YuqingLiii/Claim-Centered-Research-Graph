name: Proof DAG audit

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python tools/test_dag_contracts.py
      - run: python tools/evidence_closure_check.py
      - run: python tools/lean_dag_check.py --selftest
      - run: python tools/proof_dag_check.py --problem all
      - run: python tools/lean_dag_check.py --problem ksum
      - run: python tools/lean_dag_check.py --problem se
