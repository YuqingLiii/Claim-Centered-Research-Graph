claim: 'Any 2-Sum lower-bound construction that factorizes across disjoint position blocks with

  independently hard sub-instances, instantiated with CURRENTLY PROVED block hardness, certifies at

  most `O(sqrt(N) q^(1/6))`. Exceeding `eta = 1/6` therefore requires either (i) cross-block

  coupling through the shared alphabet (the witness must not survive disjoint-block factorization),

  or (ii) block hardness already in the small-range regime — which is the original problem

  recursively (self-referential, no independent gain).'
