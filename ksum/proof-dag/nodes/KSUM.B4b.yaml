id: KSUM.B4b
aliases:
- B4b
claim: 'B4b (OR): close the remaining q^{1/6}-vs-q^{1/4} exponent window through any registered lower-bound
  route. ****'
routes:
  KSUM.B4b.L1:
    premises:
    - KSUM.B4b.L1
    implication: L1 (explicit three-class reciprocal-Hamming polar completion) implies B4b.
    assessment:
      level: OPEN
      summary: Route unwritten; the child itself stalled (captures only 38.90%-62.83% even with oracle-best
        balance weights, P2 stop fired).
  KSUM.B4b.L2:
    premises:
    - KSUM.B4b.L2
    implication: L2 (the invariant dual-polynomial / coefficient-law family) implies B4b.
    assessment:
      level: OPEN
      summary: 'Route unwritten. K-B4b-1 (review correction): of L2''s ten PROVED components, M1, L2P3
        and BANDMULT are TOOLS (positive constructions) and the other seven are obstructions - and the
        sharper statement true of all ten is: the tools supply PURE HIGH DEGREE but not CORRELATION (M1''s
        tensor has correlation exactly 2^{1-r}, below the 2/3 threshold the polynomial method needs),
        while the obstructions rule out the constructions that would have supplied correlation. That is
        why no component, tool or obstruction, is a route to B4b despite all being PROVED - and why status
        must not propagate through an untyped edge.'
      caveats:
      - the surviving candidate needs >=3 active pairs and must be NON-product (both the SDP and LP languages
        converge on this same object); no such coefficient law exists yet
  KSUM.B4b.L3:
    premises:
    - KSUM.B4b.L3
    implication: L3 (hidden-frequency-mask / literal-query interface family) implies B4b.
    assessment:
      level: OPEN
      summary: Route unwritten; the HS-energy sub-route is REFUTED/DEAD (carrier-multiplicity floor Omega(q^{3/4})
        against a q^{1/12} budget), siblings untested.
assessment:
  level: OPEN
  summary: 'Phase-6 supplement: L2 remains CONJECTURED. Fresh hostile review proves multiplicity-gauge
    label insufficiency, direct nontrivial-vector Reynolds zero, and positive diagonal/Reynolds band zero
    as three scoped components. The literal mechanism is BLOCKED/reviewed, but MAJOR D14 leaves the aggregate
    optimizer-faithful obstruction CONJECTURED because its transfer class is not formula-defined. Signed
    constructions in an ambient canonical multiplicity basis and the cap-scale witness remain open, so
    this OR parent remains OPEN. Primary status: **OPEN**. L2 remains CONJECTURED. Its reviewed M1/M2,
    L2P3 logarithmic-band, and scoped phase-4 T1/T2 claims stand. Fresh phase-5 review proves the general
    averaged factorial-band multiplication lemma and the exact orientation/Fourier obstruction for identical
    phase-3 product blocks with one common exact pair total on every pair and block. Cross-block NO coherence
    costs `2^{-r(m-1)}`, and normalized correlation is at most `1/2` in that hard class; the selected
    repeated shared-value product family is BLOCKED/reviewed. Nonidentical blocks, unequal pair totals,
    non-product couplings, alternative inners, non-composition witness shapes, and the canonical cap-scale
    witness including its `sqrt(N)` side remain open. L1 and L3 remain OPEN. U1 is a CERTIFIED* scoped
    charged-recurrence outcome, but it does not discharge the global all-algorithms claim. No exponent
    claim follows from finite evidence.'
