id: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.duplicate-classification
aliases:
- B4bL3AltCriticalDuplicateClassification
claim: 'At the critical hidden-frequency promise, determine whether coherent duplicate testing and

  variable-time classification can isolate enough singleton positions to detect the unique cross

  match in `o(N^(2/3))` queries; otherwise derive a precise ceiling for this algorithm architecture.'
assessment:
  level: OPEN
  summary: '**OPEN — the scoped indexed/variable-time architectures are slower than the cap.** A promise-calibrated
    same-side role test costs `O-tilde(sqrt(q))` on both branches, but every true or false singleton still
    needs a zero-versus-one opposite-list search of cost `Theta(sqrt(N))`. Even granting ideal root-sum-square
    variable-time composition gives `O-tilde(sqrt(Nq))=O-tilde(N^(5/6))`; exact singleton generation plus
    a walk costs `O-tilde(N^(17/18))`. This does not exclude a non-indexed global classifier, so the node
    remains OPEN/pending-review rather than REFUTED.'
