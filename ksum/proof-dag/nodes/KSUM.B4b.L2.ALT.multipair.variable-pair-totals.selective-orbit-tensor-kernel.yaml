frontier:
  task-001:
    task: Give a formula-defined positive legal measure `pi_{N,q}`, not an LP optimum or `|W_*|`.
    kind: task
    since: '2026-08-16'
  task-002:
    task: "Prove `3||g||_{2,pi}^2>||g||_{1,pi}` uniformly at\n  `D=c min{sqrt(N)q^eta,N^(2/3)}`."
    kind: task
    since: '2026-08-16'
  task-003:
    task: "Prove constant residual-weighted mass above the required high-`C_t` threshold at both `q=5`\
      \ and\n  `q=N`, and show the support does not make the NO indicator a low-degree scalar statistic."
    kind: task
    since: '2026-08-16'
  task-004:
    task: "At `q=N`, exclude one-parameter activation/reservoir supports from further tuning: even a\n\
      \  nonproduct beta-binomial law with the correct base tail is killed by the actual repeated\n  `(1,1)`\
      \ rows. A replacement must retain genuinely multidimensional boundary complexity after\n  restriction\
      \ of the full orbit-feature span."
    kind: task
    since: '2026-08-16'
  task-005:
    task: "At `q=5`, do not reuse the unmodified symmetric Dirichlet--multinomial/Hahn law as the witness.\n\
      \  Any replacement must improve the YES-side residual `L_1/L_2^2` ratio while retaining the tail;\n\
      \  finite fixed-`alpha` sensitivity is not a proof that all Dirichlet deformations fail."
    kind: task
    since: '2026-08-16'
  task-006:
    task: "Continue any analytic moving-support work only in the preregistered moving-Remez/cubature node.\n\
      \  Generic LP basic sparsity is not a formula and cannot support an asymptotic claim."
    kind: task
    since: '2026-08-16'
  task-007:
    task: "At `q=N`, require residual-relevant YES support down to much smaller positive `C_t` while keeping\n\
      \  constant residual mass at `Theta(N^(4/3))`; uniformly balanced positive splits leave a fatal\n\
      \  scalar Chebyshev gap even with multidimensional totals and distributed boundary mass."
    kind: task
    since: '2026-08-16'
  task-008:
    task: "At `q=5`, stop blind tuning of smooth full-support symmetric radial weights. Any next law must\n\
      \  control joint residual signs across several orbit coordinates while keeping both low- and\n \
      \ high-`C_t` YES mass; the finite tilt grid does not prove that every such law fails."
    kind: task
    since: '2026-08-16'
  task-009:
    task: "Independently review the generating-function feature identification, pseudoinverse projection,\n\
      \  exact correlation formula, and complementary-slackness universality before any promotion."
    kind: task
    since: '2026-08-16'
