id: KSUM.A1c
aliases:
- A1c
claim: The translation identity k-Sum_t(x)=k-Sum_(t+ka)(x+a*1) implies that, for every target t, there
  is a window target t' in t+kZ_q with Q(k-Sum_t)>=Q(k-Sum_(t'))/C for an absolute constant C, without
  parity or coprimality assumptions.
assumptions:
  query-domain-restriction:
    kind: model-fact
    statement: Restricting a promised input domain cannot increase bounded-error quantum query complexity.
    source:
      path: ksum/lean/KSUM/Interface.lean
      kind: text
      locator: QueryModel interface table, `restrict` field
  per-coordinate-relabeling:
    kind: model-fact
    statement: An input-independent per-coordinate injective relabeling transfers bounded-error query
      complexity in the required direction with at most the absolute factor two used in this claim.
    source:
      path: ksum/lean/KSUM/Interface.lean
      kind: text
      locator: QueryModel interface table, `relabel` field and `relabel_inj` theorem
