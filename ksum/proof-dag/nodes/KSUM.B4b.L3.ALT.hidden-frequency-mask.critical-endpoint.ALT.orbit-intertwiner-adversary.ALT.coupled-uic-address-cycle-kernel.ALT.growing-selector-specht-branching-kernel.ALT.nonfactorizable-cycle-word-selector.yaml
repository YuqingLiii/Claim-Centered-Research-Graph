claim: 'Construct a formula-defined coefficient depending jointly on a growing word/cycle decomposition
  of

  the repaired outer matching and the hidden-address cycles, in a way that is not an input-wise

  row/column unitary transport, and prove it retains the outer `a^(2/3)` numerator while providing

  the missing `m^(1/6)` physical-query separation.'
assessment:
  level: OPEN
  summary: '**OPEN — the natural repaired-singleton/heavy two-matching cycle-word algebra fails, while
    the separately registered full-position-incidence three-layer successor is untested.** On the exact
    `p=0,u=1` subsequence, the two matchings have relative permutation conjugate to `r_1^(-1)r_0` for
    input-wise relative address maps `r_t`. An arbitrary scalar word law is a convolution/Hecke direct
    sum rather than necessarily one coboundary, but it is still a standalone pair kernel. Undoing the
    repair adds only the collision and unused-label endpoints; normalized incidence sends every such one/two-pointed
    word to the previously audited rank-at-most-seven selector system. With the exact one-coordinate `1/sqrt(m-1)`
    occurrence cut, this scoped family remains at `O(a^(2/3)sqrt(m))=O(N^(11/18))`. This proposer-tier
    FAIL does not cover a genuinely pair-defined third position-incidence relation, so the node remains
    OPEN.'
