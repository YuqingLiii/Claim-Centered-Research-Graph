  summary: '**OPEN — every audited statistic synthesis is slower than the cap.** Sparse support/union/four-cell
    search costs `O-tilde(sqrt(Nq))=O-tilde(N^(5/6))` even with ideal variable-time role access. Raw cross-collision
    search costs `N`, dense four-cell estimation `N^(7/6)`, and combined-collision unit-resolution counting
    `N^(5/3)`. The unit signal is exact but no cheap statistic oracle was found. This is not a lower bound
    against a different global transform.'
