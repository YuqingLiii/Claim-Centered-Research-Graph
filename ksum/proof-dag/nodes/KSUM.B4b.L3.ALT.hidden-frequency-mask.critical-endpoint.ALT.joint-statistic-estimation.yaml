claim: 'Determine whether quantum estimation of a genuinely joint statistic—support intersection, union

  size, cross-collision mass, combined collision count, or the four-cell joint-histogram switch—can

  distinguish the critical promise in `o(N^(2/3))` queries; otherwise isolate its exact precision

  barrier.'
