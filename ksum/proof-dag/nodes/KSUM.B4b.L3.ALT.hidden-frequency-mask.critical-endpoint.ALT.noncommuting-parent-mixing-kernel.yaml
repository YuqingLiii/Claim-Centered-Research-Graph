claim: "On the critical endpoint, choose a formula-defined family of common one-coordinate stabilizer\n\
  types whose marked multiplicity spaces contain\n\n\\[\n r=\\Theta(m^{1/3})\n\\]\n\nfull-group parent\
  \ channels. Define rectangular full-orbit Fourier blocks so that the unmarked\nparent-diagonal coefficients\
  \ add at unit scale, while every physical off-equality left and right\nquery block mixes those parents\
  \ noncommutatively and is smaller by `Omega(sqrt(r))`. After exact\nincidence compression, combine this\
  \ `m^(1/6)` separation with the outer `a^(2/3)` numerator to\nobtain the critical `Omega(N^(2/3))` adversary\
  \ ratio."
assessment:
  level: OPEN
  summary: '**OPEN — an explicit two-sided `R x R` common-parent grid exists, but its near-first-row Pieri
    realization fails the physical off-equality gate.** With `R=Theta(m^(1/3))`, exact partitions `alpha,theta,nu`
    give parents `rho_(jk)=(lambda^(j),lambda^(k),nu)` of nonzero multiplicity in both answer modules;
    fixed `k` shares one left marked type and fixed `j` shares one right marked type. Thus representation
    dimension is not the bottleneck. However, every lower-row parent has a different first-row-removal
    branch unique within the supported grid. That branch is `1-O(1/m)` heavy-unselected, and heavy equality
    is only an `O(1/a)` Schur multiplier, so a physical off-equality query retains `1-o(1)` of every coefficient
    with `j>1` on the left or `k>1` on the right. Simultaneous attenuation leaves only `(1,1)` and no
    growing gain. Balanced position shapes, growing multiplicity inside one parent, and non-skeleton occurrence
    carriers remain outside this scoped failure. A second explicit balanced Pieri/LR grid gives formula-defined
    row/column-centered Fourier blocks of norm one and proves that one parent star cannot serve both sides.
    Its row/column sums cancel restriction means, not the physical off-equality Schur map; its natural
    coefficient is now also physically closed without a `6j` calculation. Every lower parent has a unique
    first-row-removal type, its heavy-unselected overlap is at least `1-a/(L-t_i)`, and the off-equality
    mask retains another `1-O(1/a)` factor. Since each lower diagonal coefficient equals one, both physical
    query ratios tend to one.'
