id: KSUM.A1d
aliases:
- A1d
claim: For every fixed k>=3 there are constants C_k,c_k>0 such that, for all sufficiently large N, every
  target t, and q0(k)=2k^2+2k-5<=q<=C_k N, Q(k-Sum,Z_q,t,N)=Omega_k(sqrt(N)q^(1/6)); for q>=c_k N the
  same reduction gives Omega_k(N^(2/3)).
assessment:
  level: PROVED
  summary: PROVED. The composition-layer review checks the full quantified lower-bound statement, its
    constants and regime coverage, its role in the B1 route, and the distinction between A1d and the A1
    composition node. The earlier review is retained for the narrower cutoff correction.
  basis:
    reviews:
    - path: ksum/reviews/ksum_composition_layer_review_20260730.md
      kind: review
      locator: Sections 3.1, 4.2, 6.1, and 7d
      scope: Full claim-level audit of A1d, including quantifiers, both q-regimes, constant dependence,
        downstream use, and its noncircular role beside A1.
      reviewed_hash: sha256:d9f22fb14b5783c6250635c63c8b446222ec69911d051d3f55ed6e8e0b382af1
    - path: ksum/reviews/ksum_rev2_review.md
      kind: review
      locator: Item I1 and Overall ruling
      scope: Revision-only audit of the lower-cutoff correction; this artifact does not by itself re-adjudicate
        the complete A1d theorem.
      reviewed_hash: sha256:d9f22fb14b5783c6250635c63c8b446222ec69911d051d3f55ed6e8e0b382af1
    routes:
