id: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.non-scaled-plethystic-many-corner-occurrence-kernel
aliases:
- B4bL3AltCriticalNonScaledPlethysticManyCornerOccurrenceKernel
claim: 'Exhibit an explicitly occurring plethystic constituent outside the scaled form `theta=d tau` and

  its one-horizontal-strip attachment, with enough removable-corner or occurrence multiplicity to

  avoid every constant-retained heavy predecessor, and couple its full occurrence space to a common

  NO/YES alphabet carrier whose literal equality frame leaves all left and right off-equality query

  maps smaller by `Omega(m^(1/6))`.'
assessment:
  level: OPEN
  summary: '**OPEN — the first exact non-scaled growing-occurrence family has an independently reviewed
    scoped obstruction in its minimal trivial-alphabet realization; nontrivial equality couplings remain
    unresolved.** For `theta_r=(ad-r-1,r,1)` and `a,d>=r+1`, the coefficient in `h_a[h_d]` is exactly
    `p(r)+p(r-1)-p(r+1)`, positive for every `r>=4` and growing on a legal critical subsequence. A selected
    diagonal copy of its full one-side occurrence space embeds deterministically in the same NO/YES full-group
    type. Its all-top singleton parent has only three corners and a common top heavy branch with Gram
    lower bound `kappa_T=1-o(1)`. With `nu=(q)`, the corrected positive effects are `F_z=q^(-1)I`, literal
    restrictions are `D_zJ=U_z F_z^(1/2)`, and the sandwiched equality compression is `q^(-1)` times the
    unmasked branch. Both physical off-equality queries therefore retain `1-o(1)` of every occurrence
    matrix. This scopes out the displayed full carrier, not another nontrivial alphabet coupling of the
    same occurrence space.'
  basis:
    evidence:
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint
      kind: node-evidence
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.non-skeleton-heavy-occurrence-carrier
      kind: node-evidence
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.same-parent-occurrence-multiplicity-mixing-kernel
      kind: node-evidence
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.nontrivial-alphabet-occurrence-mixing-kernel
      kind: node-evidence
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.full-young-rank-balanced-harmonic-kernel
      kind: node-evidence
