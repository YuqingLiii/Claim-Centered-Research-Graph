    direct-coset review now proves complete-packet aggregate cross-side and native-transfer commutation,
    hence a joint eigenbasis exists for those native operators. It still supplies no eigenvalues, no reduction
    of the one-side pointed matrices, and no reason that the displayed law avoids forbidden one-dimensional
