claim: 'Construct a formula-defined two-sided patch of full-group position partitions such that every

  norm-active one-coordinate predecessor is shared by a growing collection of supported parents,

  with no unique heavy-unselected boundary branch. Put signed harmonic coefficients on the product

  patch so that every physical off-equality left/right marked block is smaller by

  `Omega(sqrt(r))`, where `r=Theta(m^(1/3))`, while the unmarked block and the outer `a^(2/3)`

  numerator survive exact incidence.'
assessment:
  level: OPEN
  summary: '**OPEN — the literal and target-sized singleton/Pieri patches have a fresh independently reviewed
    triangular obstruction.** Every nonempty finite Young-level support has a relative boundary predecessor
    of degree at most two. More strongly, first-row deletion is an injective, almost-unit-weight pivot
    on the entire critical singleton/Pieri cone, so no exact Young-down harmonic exists there and every
    `o(m)` patch retains `1-o(1)` normalized down norm. The only untested escapes are macroscopic `Omega(m)`
    supports, non-skeleton heavy-occurrence carriers outside that cone, same-parent multiplicity, or a
    genuinely pair-dependent physical orbital law.'
