  and one on all two-list inputs remains unable, after `S_n x S_n x S_q` symmetrization, to separate

  the exact hidden-frequency NO and YES orbits by a constant; then transfer the degree bound to an

  `Omega(N^(2/3))` quantum query lower bound.'
