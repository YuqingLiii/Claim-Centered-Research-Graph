id: KSUM.ROSMANIS
role: obstruction
aliases:
- Rosmanis
claim: 'For any `(G, t)` with

  `σ ≠ id` and `q ≥ 3`, the negative set `D₀` of `twoSum` is **never a single orbit** of

  `S_N × C(σ)` — (1) the orbits are parametrized by `(f, λ)` with count `Σ_f p_{≤m}(N−f) ≥ 2`;

  (2) the regularity property Rosmanis''''s ED adversary rests on fails in both precise ways (existence

  already at `q=3, τ=1, N=2`; uniqueness whenever `m ≥ 2`), and the trivial-representation

  multiplicity is `≥ 2` against the ED pattern''''s exactly 1; (3) if `τ = 0` the positive-side building

  blocks are empty. Consequently the regular-representation identification of [Rosmanis14] does not

  apply to `twoSum` for any `σ ≠ id`.'
