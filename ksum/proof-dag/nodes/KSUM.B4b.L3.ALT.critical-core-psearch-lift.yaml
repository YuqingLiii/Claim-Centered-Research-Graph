claim: 'Assume a theorem-backed `Omega(B^(2/3))` lower bound for a range-`q` critical claw promise with

  `B=Theta(q^(3/2))` positions per side. Compose each outer coordinate with a `q`-valued

  `pSearch_m`, `m=Theta(N/B)`, to obtain a legal range-`O(q)` claw/2-SUM promise of total length

  `Theta(N)` and lower bound


  `Omega(B^(2/3) sqrt(m)) = Omega(sqrt(N) q^(1/4))`,


  with the usual `N^(2/3)` cap and fixed-`q` endpoint handled explicitly.'
assessment:
  level: OPEN
  summary: '**OPEN — the conditional lift and all interfaces pass at proposer tier; the donor antecedent
    is unproved.** Assuming a uniform exact-orbit bound `Adv+/-(HF_(B,kappa))>=c_HF B^(2/3)` for `B=Theta(kappa^(3/2))`,
    the audited BHK matrix construction preserves zero support and gives the exact partial-promise product
    `Omega(B^(2/3)sqrt(m))`. With `kappa=Theta(min{q,n^(2/3)})`, exact integer choices and side sentinels
    produce the whole `min{sqrt(N)q^(1/4),N^(2/3)}` curve over cyclic range `O(q)`, including fixed `q`,
    leftovers, the cap, arbitrary target, and odd padding. This implication does not prove its critical
    endpoint antecedent, so the node remains OPEN/pending-review.'
