claim: 'Two constraints guide the lower-bound search:


  (i) any small-q bound must use group structure — OA-uniform bounds are vacuous;


  (ii) k≥3 alphabet symmetry is only diag(Aff)⋊S_n ⇒ k-Sum itself is not multisymmetric


  Consequently, routes relying only on OA-uniform bounds or on full alphabet multisymmetry are not currently
  justified.'
