claim: For every window target t in [t0,t0+k), where t0=(k-2)(kK+1), the frozen-core reduction can use
  C0=floor(q/(k-1)) or a positive core summing to the target; when N-(k-2) is odd it also uses the parked
  coordinate v=t+(k-1)K+1, and all d>=1 bad patterns are excluded.
