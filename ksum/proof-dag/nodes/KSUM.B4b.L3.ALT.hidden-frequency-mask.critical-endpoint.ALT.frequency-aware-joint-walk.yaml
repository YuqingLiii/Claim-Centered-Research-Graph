claim: 'Construct a frequency-aware two-list quantum walk that shares heavy/singleton information across

  the lists and detects the unique shared singleton in `o(N^(2/3))`, or derive an exact MNRS-style

  barrier for this walk family.'
assessment:
  level: OPEN
  summary: '**OPEN — the explicit soft-filter weighted walk optimizes back to ordinary Johnson.** The
    walk has stationary label weights from a coherent duplicate filter and a fully costed MNRS ledger.
    Filters using `o(sqrt(q))` queries leave essentially all heavy weight, so the optimum is no filtering
    and cost `Theta(N^(2/3))`; filters strong enough to change the measure cost at least `O-tilde(N^(17/18))`.
    This closes the tested weighted-representative family, not every possible joint walk.'
