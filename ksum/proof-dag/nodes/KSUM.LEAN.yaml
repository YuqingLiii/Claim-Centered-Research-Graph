id: KSUM.LEAN
role: tool
aliases:
- Lean
claim: The theorems in the declared target lists T1, T2, and T3 have sorry-free Lean 4 formalizations
  over the explicit abstract query-model interface, with the formal statements classified by the linked
  independent statement-fidelity review. No formalization is claimed here for theorem groups outside those
  declared lists.
routes:
  joint:
    premises:
    - KSUM.LEAN.T1.k2-main-line
    - KSUM.LEAN.T2.rosmanis-kfloor
    - KSUM.LEAN.T3.obstruction-theorems
    - KSUM.LEAN.statement-fidelity
    implication: T1, T2, T3, and statement-fidelity jointly establish the declared Lean-audit scope. The
      on-disk census maps each target theorem to its tier, module, and checked state, and the delta-fidelity
      review verified that mapping after the recorded corrections.
    proof:
      sketch: ksum/artifacts/ksum_lean_census_20260731.md — the itemized census table, verified row-by-row
        by the delta-fidelity review (DF-9) with four prescribed corrections (C-1..C-4) applied verbatim
        by the lead 2026-08-01
      sources:
      - path: ksum/artifacts/ksum_lean_census_20260731.md
        kind: text
    assessment:
      level: CERTIFIED*
      summary: 'Review §7.3: against this node''s own scope predicate, NO child covers lem:embed / prop:embed
        / lem:embed-allt / rem:k3embed, prop:kclaw-fillers, prop:kclaw-coloring, prop:rosmanis(2)(3),
        rem:torsion, or the two F-T1 labels (FILT, JOINTLP) — the claimed census covered the complete
        result set, which was false. Nothing propagated (node OPEN, non-propagating), so no status was
        wrong on disk; the false claim was caught before it could discharge anything. Lead decision on
        repair: option (b) — the parent Claim is NARROWED to the three tiers'' actual target lists (see
        Claim), and the census table plus the wider-scope decision are recorded as open obligations.'
      basis:
        reviews:
        - path: ksum/reviews/ksum_composition_layer_review_20260730.md
          kind: review
          scope: Rejects the former overbroad scope census and prescribes a narrowed target-list composition;
            it does not by itself certify the later corrected census, which is covered by the delta-fidelity
            review.
          locator: Verdict table and Section 7.3
          reviewed_hash: sha256:d7fc4c27b1c12889e64e68463769a4b4ea7bd644850ec2180900b4fbfd134a24
        - path: ksum/reviews/ksum_lean_delta_fidelity_review_20260801.md
          kind: review
          scope: Audits whether the T1, T2, T3, and statement-fidelity children cover the parent's narrowed
            target list after corrections; it does not enlarge that declared scope.
          locator: Sections 7--10, especially the scope-identity verdict
          reviewed_hash: sha256:d7fc4c27b1c12889e64e68463769a4b4ea7bd644850ec2180900b4fbfd134a24
      caveats:
      - The separate KSUM DAG-mirroring composition layer remains evidence rather than a premise of this
        audit node.
assessment:
  level: CERTIFIED*
  summary: '**CERTIFIED\*** — recomputed 2026-08-01. The delta-fidelity review verified the census table
    row by row (DF-9; four prescribed corrections applied verbatim), which lifts the restated composition
    to CERTIFIED\*, and `min` over the AND is now CERTIFIED\* across the board: composition, T1, T2, T3,
    statement-fidelity. **The entire Lean audit sits at the starred tier** — one uniform caveat class
    (single-review) and the standing conditionality (interface = ABI21 + Tani24 + facts (i)–(iv), all
    four stated in the linked formal interface; T3 clauses and T2 cores unconditional). What would lift
    the node further: a second independent review of any tier (rule 5), and the named residuals in the
    census''s explicitly-open-extension section.'
