id: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.non-skeleton-heavy-occurrence-carrier
aliases:
- B4bL3AltCriticalNonSkeletonHeavyOccurrenceCarrier
claim: 'Use a nontrivial representation of the heavy block-occurrence structure to produce common

  position carriers outside the first-row-dominant singleton/Pieri cone, and place a formula-defined

  signed law on them whose unmarked norm survives while every physical off-equality one-coordinate

  query is smaller by `Omega(m^(1/6))`.'
assessment:
  level: OPEN
  summary: '**OPEN — fresh Rule-7 review gives PARTIAL for the first coefficient-complete many-row family,
    while the broader non-skeleton claim remains unresolved.** For arbitrary `theta=d tau` and every singleton
    horizontal strip `lambda/theta`, the number of removable corners is below `2 sqrt(2a)+1`. Since the
    frozen endpoint gives `d+1>=4 sqrt(a)`, one common predecessor on both answers satisfies `Q_(t,beta)>=
    (1-1/sqrt(2)-o(1))I`. Thus adding rows alone cannot erase every heavy predecessor. This is not by
    itself a query obstruction: alphabet covariance could still cancel that branch. Moreover, `d tau`
    need not occur in `s_tau[h_d]` and is not generally its highest constituent. For the exact many-row
    sign family `tau=(1^a)`, the rectangle `(d^a)` occurs with coefficient one for odd `d` and zero for
    even `d`. On an infinite legal odd-`d` subsequence, a simultaneous left/right sign-covariant alphabet
    carrier exists. After correcting the printed positive-effect versus literal-map typing, its sandwiched
    equality coefficient is only `O(1/a)` and both physical off-equality queries retain `1-o(1)`. The
    review independently supports this exact selected subfamily failure but rejects two printed type claims;
    it does not close all non-skeleton carriers.'
