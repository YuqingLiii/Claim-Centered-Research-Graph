claim: 'Construct the `q=5`, `K=2`, `D=Theta(sqrt N)` dual object as a coupled generating functional on

  four strata: macroscopic bulk, the normal layer `xi=D^2 C_t/N^2=Theta(1)`, the NO face, and

  discrete `O(1)` corner occupancies. Derive exact falling-factorial limit kernels, matching and

  degree-jump birth laws, and use them to obtain a legal finite annihilator with correlation above

  `2/3` and constant `C_t=Theta(N)` residual tail.'
assessment:
  level: OPEN
  summary: '**OPEN — the original four strata are not regime-complete.** Exact normal and corner kernels
    and a typed finite/asymptotic dual bridge are now known, but intermediate query-visible scales and
    a uniformly stable exactor are missing. No correlation/tail witness has been constructed.'
