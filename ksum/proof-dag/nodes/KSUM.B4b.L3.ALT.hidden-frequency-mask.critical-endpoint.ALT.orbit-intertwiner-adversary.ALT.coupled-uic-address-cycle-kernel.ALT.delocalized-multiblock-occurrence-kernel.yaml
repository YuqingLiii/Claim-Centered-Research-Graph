claim: 'Construct an invariant joint occurrence operator on `r=Theta(m^(1/3))` address blocks in which
  the

  informative transition is genuinely delocalized, so the unmarked norm is shared coherently while

  each physical slot query pays only `O(1/sqrt(mr))`, yielding inner ratio

  `Omega(sqrt(mr))=Omega(m^(2/3))` without recursively embedding the critical problem.'
assessment:
  level: OPEN
  summary: '**OPEN — the smallest exact hidden-selector-star law fails after incidence, but a genuinely
    post-incidence non-`P/Q` overlap remains unconstructed and unrefuted.** The complete independently
    slot-symmetric two-block `P/Q` algebra has sharp ratio `sqrt(m-1)`, even for an explicit operator-Schmidt-rank-two
    nonseparable formula. If a changed block remains named, arbitrary passive companions do not improve
    that ceiling. The first explicit `r=Theta(m^(1/3))` sparse-delocalization attempt adds an invariant
    hidden `r`-chart and a selector-star branch, with the sharp pSearch operator on one hypothesized informative
    block and a common passive `xP+yQ` on all other selected blocks. Exact `C/uC` incidence forgets the
    hidden selector by a uniform contraction. The surviving occurrence operator therefore lies in the
    ordinary `2^r`-sector `P/Q` algebra. Every actual unequal block has an exact physical-slot cut of
    norm at least the unmasked norm divided by `sqrt(m-1)`, for all passive `xP+yQ` and arbitrary branch
    signs. Passive `I` is worse: the `r-1` passive branches add coherently through `I circ D^ne=|v><v|`,
    giving only a constant ratio. Passive `P` makes every individual piece `Theta(1/sqrt(m))`, but all
    pieces retain the same all-`P` direction, returning only `Theta(sqrt(m))`. Uniform averaging over
    all injections `[r] -> [a]` restores the exact full address invariance but remains in the full `2^a`
    `P/Q` algebra, so the same cut applies.'
