claim: 'For `nu=(q-1,1)`, couple the alphabet `Std_a` component on a heavy `a`-label type cell diagonally

  to the `Std_a` block-permutation covariant component of a two-row heavy position carrier, producing

  a growing common NO/YES multiplicity and a formula-defined coefficient law whose equality

  pinching cancels both physical off-equality query maps by `Omega(m^(1/6))`.'
assessment:
  level: OPEN
  summary: '**OPEN — the covariant multiplicity is exact, and the single-heavy-cell retained-branch obstruction
    has passed fresh independent adversarial review.** In general the coefficient also has the delayed term `-p_(a-1,d)(b-d-1)`;
    for `b<=d` it becomes `c_b=p_(a-1,d)(b)-p_(a,d)(b)+p_(a,d)(b-1)`, and it reduces to `p(b-1)` only
    when `b<=min(d,a-1)`, including the project''s stable endpoint. Coupling only one heavy cell, such
    as `L_d`, leaves the other physical side marking a disjoint cell. Its raw-label frame lies in the
    point-standard complement, with pinching `chi=(q-1)/(q(q-2))`, so off-equality retains `(1-chi)kappa=1-o(1)`
    of every `B`. The separately registered two-cell cross-sector repair is outside this scoped failure
    and is now independently REFUTED/DEAD on its own node.'
  basis:
    evidence:
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint
      kind: node-evidence
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.nontrivial-alphabet-occurrence-mixing-kernel
      kind: node-evidence
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.same-parent-occurrence-multiplicity-mixing-kernel
      kind: node-evidence
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.two-cell-covariant-cross-sector-mixing-kernel
      kind: node-evidence
