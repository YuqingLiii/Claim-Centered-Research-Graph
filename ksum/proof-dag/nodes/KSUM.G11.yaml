claim: 'Exact values of a complexity measure (in particular `Adv±`) at finitely many reachable parameter

  points `(n, q)` cannot establish an asymptotic exponent that is uniform in `n` — for any constant

  `c` and any finite table there are functions agreeing with the table whose true exponent differs

  from `c`. Finite exact computation can therefore **refute** a conjectured exponent (by violating a

  bound it implies at a computed point) and can supply **evidence**, but can never discharge an

  asymptotic proof obligation.'
