id: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.macroscopic-parent-patch-kernel
aliases:
- B4bL3AltCriticalMacroscopicParentPatchKernel
claim: 'Construct a formula-defined `Omega(m)`-parent support on each physical side whose normalized

  Young-down matrix is sufficiently ill-conditioned to attenuate every physical off-equality query

  block by `Omega(m^(1/6))`, while keeping coefficient norm, exact incidence, and the outer

  `a^(2/3)` numerator under control.'
assessment:
  level: OPEN
  summary: '**OPEN — fresh Rule-7 review independently supports the corrected interior adjacent-two-row
    obstruction, but gives PARTIAL and leaves the broad node unresolved.** For `lambda_b=(n-b,b)`, the
    shared first/second-row predecessor matrix is an exact weighted path incidence in the reviewed large-parameter
    interior regime. Its smallest singular value is `1-O(m^(-1/2))` for every chain length and is sharply
    `1-m^(-1/2)+O(m^(-1))` on a high-`b`, `Theta(m)` window. Exact internal cancellation forces exponentially
    unbalanced coefficients and near-unit endpoint leakage. After reopening the actual singleton attachment,
    full position incidence, and raw-label masks, both physical queries retain `1-o(1)` for scalar coefficients
    and for payloads factorized through a common auxiliary space. The printed endpoint formulas at `b=0`
    and `b=a`, the undefined `j_b`, `k=1`, and an old frozen- review SHA require explicit repair; arbitrary
    occurrence-carrier payloads are not reviewed. This closes only the fixed trivial-core adjacent two-row
    selected-line realization. It does not close the broad node, which also permits other macroscopic
    position shapes, singleton/alphabet carriers, and occurrence multiplicities.'
  basis:
    evidence:
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint
      kind: node-evidence
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.noncommuting-parent-mixing-kernel
      kind: node-evidence
    - node: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint.ALT.shared-branch-young-lattice-patch-kernel
      kind: node-evidence
