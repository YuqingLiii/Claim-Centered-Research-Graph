id: KSUM.B4b.L2
aliases:
- B4bL2
claim: Build a lower-bound witness in the multisymmetric joint-histogram basis that resolves complementary-pair
  occupancy beyond scalar Hamming shells. ****
assessment:
  level: CONJECTURED
  summary: '**Phase-6 current update (supersedes the phase-5-only summary immediately below):** Primary
    status remains **CONJECTURED** and the cap-scale witness is open. Fresh hostile review proves three
    scoped components: terminal H-irrep labels do not fix multiplicity coordinates; full-group Reynolds
    kills a direct vector from every nontrivial H-satellite; and `Reynolds(diag A)/tr A` has constant
    moment one/band zero for every nonzero PSD `A`. The exact finite gates and held-out numerical values
    pass. MAJOR D14 withholds a completion tier from the aggregate L2P6-G because “optimizer-faithful,
    irrep-label-only transfer” is not a formula-defined class and the two displayed extraction maps are
    not exhaustive. A Gelfand–Tsetlin chain fixes the irrep factor, not the residual copy space; an ambient
    canonical branching/harmonic basis plus a genuinely signed map remains open. See [the phase-6 report](../../artifacts/ksum_L2_phase6.md)
    and [completed hostile review](../../../../ksum/reviews/ksum_L2p6_review.md). Primary status: **CONJECTURED
    · cap-scale witness open; phase-5 components reviewed**. The D7-repaired canonical obligation has
    the required odd-q/all-target scope and leaves even q optional. The independently reviewed phase-2
    M1/M2, phase-3 L2P3, and scoped phase-4 T1/T2 components remain intact. Fresh rule-7 review proves
    the phase-5 factorial/Vandermonde band-multiplication lemma for arbitrary nonzero block occupancy
    measures: the `S_N`-averaged convolution annihilates below the sum of the block bands.'
