frontier:
  task-001:
    task: 'OPTIONAL STRENGTHENING (so labeled per D7; NOT required by the paper''s middle-gap problem):
      the same statement for even (q) with constants uniform across cycle types (\tau\in\{0,2\}) — strictly
      stronger; C7 does not identify those classes.'
    kind: task
    since: '2026-08-16'
  task-002:
    task: Use the addendum's canonical sign/error convention. Strict correlation (>2/3), not equality,
      is required for the direct (Q_{1/3}\ge d/2) certificate.
    kind: task
    since: '2026-08-16'
  task-003:
    task: Supply a one-input or held-out discriminator if P2 is to support dual-polynomial expressiveness.
      The verified P2 content is only that the two archived invariant matrices lose about 25--27% squared
      Frobenius mass under the specified shell coarsening.
    kind: task
    since: '2026-08-16'
  task-004:
    task: 'NEXT OPEN STEP after phase 5: the standard composition map is now obstructed in three scoped
      regimes: reviewed phase-4 T1 for fixed-allocation unaveraged sign-bit composition, reviewed phase-4
      T2 for whole-pair value-disjoint allocation, and reviewed L2P5-F for identical shared-value phase-3
      blocks with one common exact pair total and a product outer tensor after exact averaging. A live
      D10 repair must use nonidentical blocks, deliberately unequal pair totals, a non-product outer coupling,
      an inner other than L2P3, or a non-composition witness shape, and must suppress the exact cross-block
      loss `2^{-r(m-1)}` while engaging the untouched `sqrt(N)` side. The unchanged canonical target requires
      fixed eta in (1/6,1/4], c0>0, delta in (0,1/3), and N0 for every N>=N0, odd 5<=q<=N, and target,
      with l1=1, full invariance, correlation at least 2/3+delta, and degree below c0 min{sqrt(N)q^eta,N^(2/3)}
      annihilated.'
    kind: task
    since: '2026-08-16'
  task-005:
    task: 'Keep G11: degrees 3 and 4 at N <= 5 demonstrate finite machinery, not an exponent trend. The
      broader kill remains live if the repaired asymptotic construction collapses to a shell algebra or
      cannot satisfy exact moments.'
    kind: task
    since: '2026-08-16'
  task-006:
    task: 'Estimated difficulty: Very high; potentially a smaller analytic state space than the full SDP
      route.'
    kind: task
    since: '2026-08-16'
  task-007:
    task: "NEXT OPEN STEP after phase 6: retain the reviewed phase-4/5 scoped composition obstructions\
      \ and\n  the three reviewed phase-6 component facts. Construct, for every sufficiently large `N`,\
      \ odd\n  `5<=q<=N`, and target, an exact ambiently defined multiplicity/branching basis with explicit\n\
      \  phase/order/sign conventions and a cross-`N` coefficient law, together with a genuinely signed\n\
      \  operator-to-measure map. It must output an `S_N x C(sigma)`-invariant unit-`l1` measure with\
      \ zero\n  constant moment, correlation at least `2/3+delta`, and annihilation below\n  `c0 min{sqrt(N)q^eta,N^(2/3)}`\
      \ for fixed `eta in (1/6,1/4]`, `c0,delta>0`. At `q=5` this demands\n  `Theta(sqrt(N))`; at `q=N`\
      \ it is capped by `N^(2/3)`. This door survives G1 because it supplies\n  more than terminal irrep\
      \ labels, G2 because it need not directly Reynolds-average a satellite\n  vector, and G3 because\
      \ its output is signed rather than a positive normalized diagonal. Signed\n  sector recombinations,\
      \ nonlinear/off-diagonal extractions, unequal/nonidentical/non-product\n  composition, and arbitrary\
      \ joint-histogram witnesses remain open."
    kind: task
    since: '2026-08-16'
  task-008:
    task: "PHASE-7 DECISION: do not spend further work on the natural center/JM chain or on optimizing\
      \ a\n  two-ray coefficient sequence. The former fails the proposer-tier `CB-1`/`CB-4` gates; the\
      \ latter\n  is conjecturally capped at `O_tau(sqrt(N))` independently of `q`. The next registered\
      \ frontier is\n  `KSUM.B4b.L2.ALT.multipair`: a genuinely global signed measure supported on profiles\
      \ with several\n  simultaneously occupied complementary pairs. It remains OPEN with no coefficient\
      \ law."
    kind: task
    since: '2026-08-16'
  task-009:
    task: "PHASE-10 DECISION: fixed two-scale and fixed geometric scale-ladder supports are conjecturally\n\
      \  obstructed before coefficient design. Low-degree interpolation in pair total isolates every fixed\n\
      \  scale, and the resulting OR of per-scale thresholds has degree\n  `O_epsilon((L+4) log(L+1) sum_l\
      \ sqrt(K_l S_l))`, which is `o(N^(2/3))` for the tested geometric\n  ladders. The next registered\
      \ frontier is `ALT.multipair.variable-pair-totals`: the totals must vary\n  over a large jointly\
      \ coupled set so that low-degree scale selection itself fails."
    kind: task
    since: '2026-08-16'
  task-010:
    task: "PHASE-11 DECISION: the full variable-total partition/split histogram passes all attempted primal\n\
      \  support gates. It contains `[1,N-K]` in its positive `C_t` set and balanced\n  `C_t=Theta(N^(4/3))`\
      \ profiles for `K=Theta(N^(2/3))`; available query algorithms only match the\n  desired endpoint\
      \ orders. Decision C leaves one explicit missing object: a nonseparable joint\n  histogram kernel\
      \ with unit `l1`, correlation above `2/3`, the full factorial annihilation band,\n  and constant\
      \ mass above `cD_*^2`."
    kind: task
    since: '2026-08-16'
  task-011:
    task: "PHASE-12 DECISION: an exact finite rational orbit-moment kernel is now available. Three natural\n\
      \  joint-kernel lifts are conjecturally obstructed at explicit gates: affine differences lose\n\
      \  correlation `2^(1-R)`, one alternant leaves a degree-two target moment, and the Bun–Thaler\n\
      \  two-level lift has either an `M^2/k` moment or zero correlation. A preregistered 24-orbit\n \
      \ `N=8,q=5,D=8` rank/LP experiment is the next discriminator."
    kind: task
    since: '2026-08-16'
  task-012:
    task: "PHASE-14 PROPOSER/REVIEW DECISION: the two-component and repeated-common-split identities pass,\n\
      \  but fresh Rule-7 review refutes the broader bounded-collection claim with an exact three-component\n\
      \  `N=10,q=5,K=2,D=5` kernel of correlation magnitude `1/7`. Distributed NO-boundary mass cannot\n\
      \  change the reviewed cross rows; bounded rank three and higher remains live."
    kind: task
    since: '2026-08-16'
  task-013:
    task: "PHASE-14 NUMERICAL SWEEP: exact reconstruction confirms the Phase-13 finite certificate. For\n\
      \  `N=6..12,q=5`, every sampled target-scale `D=floor/ceil(sqrt N)` instance retains correlation\n\
      \  above `2/3` (also under attainable natural tail gates), whereas `ceil(2 sqrt N)` does not. No\n\
      \  asymptotic inference is licensed."
    kind: task
    since: '2026-08-16'
  task-014:
    task: "PHASE-12/13 REVIEW: fresh Rule-7 review verifies the finite core and `m=K=2` printed moment\n\
      \  formula, but caps the general formula below completion for missing regimes and leaves the\n \
      \ alternant/BT obstructions CONJECTURED for undefined maps. The route and root statuses do not move."
    kind: task
    since: '2026-08-16'
