claim: 'Use the complete common Fourier packet generated by the cell tensor

  `Std(H_L) boxtimes Std(H_R)` inside the exact induced NO/YES alphabet modules, rather than one or

  two fixed `S_q` irreps, and choose its legal block-diagonal full-type multipliers so that the

  physical point-restriction codiagonal has near-unit mass on both sides, both query norms are

  `O(m^(-1/6))`, and the growing three-row occurrence numerator survives.'
assessment:
  level: OPEN
  summary: '**OPEN — the complete-packet first gate has a fresh Rule-7 MINOR / SCOPED PASS, while the
    broad query-norm and numerator obligations remain open.** At the exact `p=0,u=1,q=4a` endpoint, for
    every `a>=2`, put `G=S_(4a)`, `V_a=S^(a-1,1)`, `s=s_(a-1,1)`, and `h=h_a`. The exact modules have
    characteristics `F_0=s^2 h^2`, `F_1=h_1^2 h_(a-1)^2 s^2=(h+s)^2s^2=F_0+2hs^3+s^4`. For either orientation,
    normalized coset pullback is a formula-defined rectangular `G`-isometry `J_o:M_0->M_1` embedding every
    NO full-type multiplicity into the unequal, larger YES multiplicity. The common packet has at least
    `2a-1` full types and a full type of multiplicity at least `a-1`. The two physical orientations satisfy
    an exact cross-Gram law. After fixing the two heavy cells and the union of the two rare cells, `K:=J_L^*J_R`
    is the normalized Bernoulli--Laplace/Johnson swap walk on `J(2a,a)`. Its eigenvalues are `lambda_j=1-j(2a-j+1)/a^2`,
    `0<=j<=a`. The fresh review resolves every full-type multiplicity sector, not only the Johnson-fiber
    trace. Writing `c_(nu,j)=[s_nu] s_(2a-j,j) s_(a-1,1)^2`, one has `Z_(0,nu)=direct-sum_(j=0)^a C^(c_(nu,j))`
    and `K|_(S^nu tensor Z_(0,nu)) = I_(S^nu) tensor direct-sum_j lambda_j I_(c_(nu,j))`. This includes
    `c_(nu,j)>1` and full types meeting several Johnson degrees. In particular, `a=2` makes only the internal
    heavy fiber `V_2 boxtimes V_2` one-dimensional; it does **not** make the full `S_8` multiplicity spaces
    one-dimensional. Already the three-row type `nu=(4,2,2)` has `(c_(nu,0),c_(nu,1),c_(nu,2))=(1,2,1)`
    and total NO multiplicity four.'
