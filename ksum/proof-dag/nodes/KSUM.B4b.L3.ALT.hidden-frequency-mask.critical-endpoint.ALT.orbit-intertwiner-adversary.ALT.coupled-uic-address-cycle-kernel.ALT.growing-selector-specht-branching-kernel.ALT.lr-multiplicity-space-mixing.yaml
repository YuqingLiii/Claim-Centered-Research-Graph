claim: 'Choose genuine outer full-transition irreducibles whose restriction to the address gauge group
  has

  Littlewood--Richardson multiplicity `c=Omega(m^(1/3))`, and construct an explicit multiplicity-

  space mixer that preserves the outer `a^(2/3)` numerator while distributing every physical query

  over `c` orthogonal channels to gain `Omega(sqrt(c))`.'
assessment:
  level: OPEN
  summary: '**OPEN — the genuine LR-dimension gate passes, but every fixed input-wise factorized middle
    operator fails the query-balancing gate.** For any `a >= 3r`, the explicit partitions `lambda=mu=(a-r,r)`
    and `Theta=(2a-3r,2r,r)` satisfy the exact identity `c^Theta_(lambda,mu)=r+1`. Taking `r=floor(m^(1/3))`
    therefore supplies the requested genuine `Omega(m^(1/3))` restriction multiplicity in the actual repaired-transition
    carrier. This is Littlewood--Richardson multiplicity, not the regular Fourier multiplicity `f^Theta`
    and not a presentation-gauge ancilla. The multiplicity by itself gives no adversary gain. Write the
    common isotypic component as `M tensor Lambda`, where `dim M=c`. A pure multiplicity mixer has middle
    block `W tensor I_Lambda`; after one physical coordinate is marked, every branching component contains
    the same `W`, so the marked map is `direct-sum_eta W` and retains `||W||` exactly. More generally,
    for an arbitrary fixed middle operator `A`, the unmarked incidence contraction is a normalized partial
    trace `W_K`. Its marked branch contractions `W_eta` obey `W_K=sum_eta (dim Lambda_eta/dim Lambda)
    W_eta`; hence `||W_K|| <= max_eta ||W_eta||`. At least one marked branch retains the full unmarked
    norm. Thus the whole fixed-middle family `U_1(z_1)^* A U_0(z_0)` has selector gain at most one, despite
    growing genuine LR multiplicity. The only identified escape is an already registered nonfactorizable
    cycle-word/equality-graph coefficient whose middle law depends on the input pair.'
