claim: 'Construct a formula-defined rectangular coefficient using, in addition to the repaired singleton

  and heavy/address matchings, at least one pair-defined full L/R position-incidence edge so that the

  resulting three-layer closed words are not determined by one relative permutation. Prove that its

  post-incidence operator is neither an input-wise fixed-middle transport nor an independent `P/Q`

  law and supplies the missing `m^(1/6)` physical-query separation while preserving the outer

  `a^(2/3)` numerator.'
assessment:
  level: OPEN
  summary: '**OPEN — the unrestricted full-position algebra is now typed, while fixed-centered contingency
    minors fail and only off-equality noncommuting parent mixing remains live.** Arbitrary functions of
    the complete graph `D(x,y)` already span the whole rectangular invariant corner, so “add a third edge”
    alone is not a candidate formula. The exact position average gives only a Hamming-distance Schur bound
    and has no dimension-free inverse on the legal orbitals. Raw or fixed-centered heavy-heavy contingency
    matrices, all their minors, and their exterior powers are fixed-middle cross Grams; after one mark,
    normalized partial-trace convexity leaves a branch with at least the unmarked norm, so this family
    cannot supply the hoped-for `sqrt(r)` dilution. This does not close the node because the retaining
    branch need not lie in the physical off-equality query piece. On the decisive `p=0,u=1` subsequence,
    the complete new joint data are exactly a pair of integer transportation matrices `(C_L,C_R)` modulo
    the simultaneous common-palette action. A legal two-heavy-label family proves that this data is not
    determined by the old address maps or repair endpoints, and normalized address incidence preserves
    it exactly. The structural enlargement is therefore genuine, but explicit signed orbital weights and
    their pointed norms remain absent. The first fully typed three-relation word `T=Z(A-B)^*Z` also fails:
    it tensorizes exactly as `2h S_1^* J S_0` with fixed signature `J`, so all its exterior powers stay
    fixed-middle.'
