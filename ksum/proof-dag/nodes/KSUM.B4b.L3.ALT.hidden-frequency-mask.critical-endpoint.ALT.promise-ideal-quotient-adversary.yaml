claim: 'Construct a representation-theoretic adversary/progress space directly on the two exact strict

  orbit modules after quotienting the Fourier function space by the strict promise ideal, and prove

  an `Omega(N^(2/3))` lower bound without the promise-kernel leakage that defeats the full-low-degree

  knowledge projector.'
assessment:
  level: OPEN
  summary: '**OPEN — quotient-only and exact query-module-hom repairs fail at proposer tier; only a genuinely
    nonintertwining masked adversary remains possible.** Separate strict NO/YES quotients are individually
    query stable, but the inherited identity/formula transfer is not well defined because their promise
    ideals differ. The union quotient is well defined on the full promise but retains the degree-two cross-equality
    answer signal and hence the known leakage. The previously untested rectangular module-hom continuation
    also has an exact zero-space result: the coordinate-query algebra is the full finite function algebra,
    and the strict NO and YES modules have disjoint joint spectra. Hence `Hom_F(F/I_0,F/I_1)=0`. Equivalently,
    the degree-two cross-equality projectors vanish on NO and resolve the identity on YES, so any operator
    intertwining them all is zero. This remains a scoped proposer-tier no-go, not completion-tier closure.
    A surviving operator must deliberately fail exact query intertwining and instead prove bounded physical
    query masks, which is the ordinary rectangular orbit-adversary obligation rather than an automatic
    benefit of quotienting.'
