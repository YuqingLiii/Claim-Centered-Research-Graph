claim: 'Replace the incomplete four-stratum limit by an iterated compactification covering every legal

  scale between discrete corners, `C_t=Theta(N)` normal layers, intermediate supernormal layers, and

  the bulk, together with a uniformly bounded right-inverse that corrects limiting moment defects to

  exact finite annihilation.'
