claim: 'Instead of axiomatizing `Q` and the cited bounds as a `QueryModel` interface, build the bounded-error

  quantum query model in Lean from first principles (Hilbert spaces, oracle unitaries, bounded-error

  acceptance), formalize the negative-weight adversary method, and reprove `thm:abi` / `thm:tani`

  inside Lean, yielding an *unconditional* machine-checked lower bound.'
