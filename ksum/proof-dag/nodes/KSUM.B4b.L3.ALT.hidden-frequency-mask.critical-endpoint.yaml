frontier:
  task-001:
    task: "Decide whether a known adversary/approximate-degree donor applies to this exact two-orbit promise;\n\
      \  every reduction must preserve the hidden palette and use `O(1)` oracle queries. The audited local\n\
      \  donors do not; any continuation needs a new theorem or construction, not another parameter match."
    kind: task
    since: '2026-08-16'
  task-002:
    task: "If constructing a lower bound, give an explicit feasible adversary/dual or a theorem-backed\n\
      \  restriction at `Omega(N^(2/3))`; numerical spectra alone do not license the exponent."
    kind: task
    since: '2026-08-16'
  task-003:
    task: "Improve the exact addressed `N^(11/18)` adversary by the missing `N^(1/18)` without reusing\n\
      \  independent pSearch. Concretely, construct the orbit-intertwiner coefficients satisfying the\n\
      \  displayed critical adversary norm constraints, or define a genuinely nonlinear/algorithm-\n \
      \ dependent strict-promise progress carrier not covered by the reachable-span ceiling."
    kind: task
    since: '2026-08-16'
  task-004:
    task: "The strict-projector and standalone square-cycle failures are independently closed. Any repair\n\
      \  must change the typed architecture and proceed through an already registered successor or a new\n\
      \  Rule-8-registered node, not through renamed projectors or coefficient formulas."
    kind: task
    since: '2026-08-16'
  task-005:
    task: "Do not retry either explicit parent grid, any `o(m)` singleton/Pieri patch, the displayed\n\
      \  trivial-alphabet same-parent family, or the minimal separately invariant standard-hook\n  type-cell\
      \ product: each has a uniform near-unit physical marked branch."
    kind: task
    since: '2026-08-16'
  task-006:
    task: "Pursue one of the remaining registered noncoverage boundaries with an explicit formula: a\n\
      \  macroscopic `Omega(m)` patch or a non-skeleton heavy-occurrence carrier outside the Pieri cone.\n\
      \  Do not retry the adjacent two-row trivial-core chain or the odd-`d` sign/rectangle carrier while\n\
      \  their scoped reviews are pending; any continuation must leave those exact families.\n  Any new\
      \ alphabet/position carrier must first be registered outside the scoped two-cell family.\n  It must\
      \ prove `sqrt(r)` attenuation for every physical off-equality\n  left/right query after exact incidence;\
      \ dimension counts and unmasked down cancellation are not\n  sufficient."
    kind: task
    since: '2026-08-16'
  task-007:
    task: Neither route can be replaced by a favorable finite spectrum.
