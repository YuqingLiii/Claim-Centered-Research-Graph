id: KSUM.B4b.L3.ALT.hidden-frequency-mask.critical-endpoint
aliases:
- B4bL3AltHiddenFrequencyMaskCriticalEndpoint
claim: 'For the exact rare-singleton/heavy-decoy promise frozen in the parent artifact at

  `q=Theta(N^(2/3))`, prove an `Omega(N^(2/3))` quantum query lower bound, or construct an explicit

  `o(N^(2/3))` algorithm that rules out that endpoint.'
assessment:
  level: OPEN
  summary: '**OPEN — exact addressed baseline proved at proposer tier; cap endpoint unresolved.** The
    exact promise is legal and losslessly embedded. A proposer-tier upper-algorithm audit breaks the desired
    quarter-power scale for every strictly subcritical polynomial `q=N^kappa`, but all audited sampling,
    Grover, frequency-classification, and ordinary Johnson/MNRS strategies still cost `Theta(N^(2/3))`
    when `q=Theta(N^(2/3))`. A theorem-backed adversary construction now gives the exact frozen promise
    `Adv+/-=Omega(a^(2/3)sqrt(d+1))=Omega(sqrt(N)q^(1/6))`, hence `Omega(N^(11/18))` at the endpoint.
    Together with ordinary Johnson, the rigorous bracket is `Omega(N^(11/18)) <= Q <= O(N^(2/3))`. The
    missing `N^(1/18)` is an address-erasure gain not present in independent `pSearch`; no subcap algorithm
    was found. A dedicated audit of the three registered non-sampling attack families also found no subcap
    algorithm: coherent duplicate classification and direct joint-statistic estimation cost at best `O-tilde(N^(5/6))`,
    while the explicit soft-filter frequency-aware walk is minimized by applying no filter and becomes
    the ordinary `Theta(N^(2/3))` Johnson walk. These are scoped architecture failures, not a general
    lower bound. On the lower side, the exact orbit-intertwiner system is explicit. Its local two-orbital
    span tops out at `Theta(N^(1/3))`, and the addressed subalgebra reproduces `N^(11/18)`.'
