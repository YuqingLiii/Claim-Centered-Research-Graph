claim: For k≥3 and R≥2, let ω=2R−1, define u_j=ω^{j−1} for 1≤j≤k−1 and u_k=−(ω^{k−1}−1)/(ω−1), and set
  P=k(R−1)(ω^{k−1}−1)/(ω−1), M=((2k+1)^{k−1}−1)/2, and V=P+1. Define w_j=V(2k+1)^{j−1} for 1≤j≤k−1, w_k=−Σ_{j<k}w_j,
  and q=(P+1)(M+1). These are the complete payload, tag, and modulus formulas used by Lemma lem:embed.
