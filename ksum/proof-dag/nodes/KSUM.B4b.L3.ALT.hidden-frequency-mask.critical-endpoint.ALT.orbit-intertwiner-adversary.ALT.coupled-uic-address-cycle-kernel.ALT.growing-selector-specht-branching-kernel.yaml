claim: 'Construct a formula-defined rectangular critical adversary in which a growing outer full-matching,

  endpoint-tuple, or cycle-word selector carries the same growing Specht sector as the hidden-address

  module, and coherently balances `r=Theta(m^(1/3))` branching channels to obtain the missing

  `sqrt(r)=Theta(m^(1/6))` marked/unmarked gain.'
assessment:
  level: OPEN
  summary: '**OPEN — the actual repaired full UIC matching contains an explicit common growing Specht
    sector, but its canonical multiplicity-one transport formula FAILS exactly.** Put `r=floor(m^(1/3))`,
    `s=r(r-1)/2`, `lambda=(a-s,r-1,...,1)`, and `Theta=2lambda`. The true repaired transition permutation
    is an `S_(2a)` carrier, and `c^(Theta)_(lambda,lambda)=1`, so `S^Theta restricted to S_a^L x S_a^R`
    really contains the requested growing `S^lambda box-times S^lambda` sector; it is not an attached
    regular ancilla. For the first formula `B_Theta[z_1,z_0]=Gamma_UIC[z_1,z_0] rho_Theta(tau_1^(-1)tau_0)`,
    the repaired matching factors input-wise. It is block-unitarily equivalent to `Gamma_UIC tensor I`,
    so it preserves the outer numerator and every outer mask. The same factorization makes the incidence
    Schur contraction identically scalar one. A physical query exposes all `r` removable-corner branches
    at once, and the exact marked multiplicity operator is `I_r`, not one branch of a balanced vector.
    Thus this selector contributes ratio one and, with standard BHK blocks, remains at `O(a^(2/3)sqrt(m))=O(N^(11/18))`.
    The two successors have now been tested at their natural full scope. Genuine LR multiplicity `c=r+1`
    exists, but every fixed middle operator obeys a partial-trace convexity ceiling: a marked branch retains
    at least the unmarked selector norm. Natural two-matching cycle words reduce to a standalone convolution/Hecke
    kernel, and the repair defect contributes only two capped endpoints.'
