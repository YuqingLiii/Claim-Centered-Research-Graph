claim: Replace ABI's disjoint independent pSearch buckets by a correlated range-coupled gadget that can
  preserve a q^(1/4)-strength claw lower bound. ****
assessment:
  level: OPEN
  summary: 'Primary status: **OPEN**. The conditional critical-core pSearch lift has passed all theorem
    and embedding interfaces: one uniform `Omega(B^(2/3))` adversary for the exact critical orbit would
    close the entire capped quarter-power curve. The active mathematical bottleneck is therefore the critical
    endpoint, not further multiscale tuning. Parameter retuning, shared-address coupling, and the balanced
    single-scale profile remain closed in their tested scopes; the biclique-cover relation candidate is
    deprioritized. No endpoint proof or completion-tier review is claimed. The first hostile endpoint
    pass found no `o(N^(2/3))` algorithm in duplicate classification, soft-filter joint walks, or direct
    joint-statistic estimation. The strict full-low-degree projector route and the standalone square signed
    address-cycle kernel are both completion-tier REFUTED/DEAD after separate fresh independent adversarial reviews.
    The sole active prioritized construction is now the nonseparable rectangular outer-UIC/address-cycle
    kernel. Its exact incidence interface passes, but the minimal pointed-hook law, every one/two-endpoint
    higher-Specht selector, the fixed `P/Q` multiblock algebra, multiplicity-one repaired-full-matching
    transport, and the first hidden-selector-star law are all capped at the addressed scale. Genuine growing
    LR multiplicity exists, but every fixed-middle operator fails by marked-branch convexity. Natural
    two-matching cycle words likewise reduce to a standalone Hecke kernel plus two capped endpoints.'
