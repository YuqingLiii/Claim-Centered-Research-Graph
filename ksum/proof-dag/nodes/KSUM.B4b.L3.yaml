    kind: task
    since: '2026-08-16'
  task-002:
    task: 'Kill criterion: Stop if the gadget factors into independent pSearch, needs superconstant query
      simulation, increases the range beyond O(q), creates spurious claws, or meets an upper algorithm
      below the target.'
    kind: task
    since: '2026-08-16'
  task-003:
    task: 'Estimated difficulty: Extreme; the chain audit shows a genuinely new assembly is mandatory.'
    kind: task
    since: '2026-08-16'
  task-004:
    task: "Any successor must avoid both Cartesian pSearch factorization and an alternate searchable latent\n\
      \  coordinate. Merely making the promise non-Cartesian is insufficient."
    kind: task
    since: '2026-08-16'
  task-005:
    task: "Do not spend another pass tuning asymmetric domains, bucket sizes, composition depth, or\n\
      \  position-dependent relabels inside the audited ABI/Tani template; all of those degrees of freedom\n\
      \  are now accounted for."
    kind: task
    since: '2026-08-16'
  task-006:
    task: "Do not attempt a uniform quarter-power dual on the balanced single-scale hidden-frequency promise\n\
