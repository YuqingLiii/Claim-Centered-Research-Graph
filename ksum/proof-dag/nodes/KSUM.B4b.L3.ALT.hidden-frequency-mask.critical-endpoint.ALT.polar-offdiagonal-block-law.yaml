claim: 'Writing each literal marked row as a polar partial isometry times the square root of its source

  effect, the physical inequality-query mask is unitarily equivalent, on the exact support sums, to

  the off-diagonal block operator with `(z,w)` entry

  `(F_(1,z)^s)^(1/2) B (F_(0,w)^s)^(1/2)` for `z != w`; this exact object admits a uniform

  formula-level norm bound on the required invariant coefficient family.'
