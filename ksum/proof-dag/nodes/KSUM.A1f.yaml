claim: Independent audit runs retested the k>=3 encoding, the payload and separation bounds, and the odd-length
  parity repair on the finite scopes recorded in the F1 and R3 logs; the final runs reported no mismatches
  on those scopes.
assessment:
  level: NUMERICAL
  summary: This node records the outcome of finite independent audit runs. It is evidence for the mathematical
    reduction nodes, not a separate proof claim or a substitute for their reviews.
  basis:
    evidence:
    - node: KSUM.A1
      kind: node-evidence
    - path: ksum/tools/ksum_f1_embed.py
      kind: code
    - path: ksum/tools/ksum_f1_floor.py
      kind: code
    - path: ksum/tools/ksum_r3_parity.py
      kind: code
    runs:
    - path: ksum/artifacts/logs_ksum_F1_20260718/embed_audit.log
      kind: run
      result: The independent F1 encoding, trap, payload-bound, and separation-margin checks reported
        PASS on all recorded finite instances.
    - path: ksum/artifacts/logs_ksum_F1_20260718/floor_audit.log
      kind: run
      result: The independent F1 even- and odd-core finite checks reported PASS on the final run.
    - path: ksum/artifacts/logs_ksum_R3_20260718/parity_audit.log
      kind: run
      result: The independent R3 parity audit reported no mismatches on its recorded finite scopes and
        passed its corrected negative controls.
    - path: ksum/artifacts/solver_reproduction_20260825.json
      kind: run
      locator: '`F1-embed`, `F1-floor`, and `R3-parity`'
      date: '2026-08-25'
      note: Standard-library commands, source hashes, exit codes, and raw output are recorded per run.
      result: Fresh reruns check 58033 F1 encoding inputs and 47496 F1 floor inputs, and pass the R3 finite checks.
    - path: ksum/artifacts/reproduction_20260825.md
      kind: run
      locator: '`A1f: encoding, inherited floor, and parity`'
      result: Reproduction commands and comparison with the original finite audit outputs.
  caveats:
  - The dated reruns reproduce the original finite checks; they are not new independent mathematical reviews.
  - Finite computational audits do not by themselves prove the corresponding all-parameter lemmas.
