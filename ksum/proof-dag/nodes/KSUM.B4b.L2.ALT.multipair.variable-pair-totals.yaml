id: KSUM.B4b.L2.ALT.multipair.variable-pair-totals
aliases:
- B4bL2AltMultipairVariablePairTotals
claim: 'The full variable-total orbit simplex is parametrized by unordered split histograms `H_{r,u}`
  with

  `sum H=K` and `sum(r+u)H=N`. It survives the phase-11 support-level primal attacks and reaches

  `C_t=Theta(N^(4/3))` at the capped endpoints. The open claim is to construct one nonseparable signed

  kernel on these histograms with constant correlation, the target annihilation band, and constant

  high-`C_t` absolute mass.'
assessment:
  level: OPEN
  summary: '**OPEN — explicit support, missing coefficient kernel.** A proposer pass found no strict primal
    obstruction, but did not construct the required signed annihilator. No lower bound is claimed.'
