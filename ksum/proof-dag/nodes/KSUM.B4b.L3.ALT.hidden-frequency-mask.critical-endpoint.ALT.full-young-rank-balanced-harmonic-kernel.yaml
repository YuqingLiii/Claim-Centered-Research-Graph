claim: 'Choose a formula-defined macroscopic set of legal balanced position shapes that contains genuine

  cycles in the Young branching graph, and construct a normalized coefficient vector or matrix whose

  complete left and right marked Young-down maps are both smaller by `Omega(m^(1/6))`, while exact

  NO/YES occurrence incidence and the outer `a^(2/3)` payload retain unit scale.'
assessment:
  level: OPEN
  summary: '**OPEN — registered before construction or computation.** No legal rank slice, occurrence
    formula, small singular vector, or physical query calculation is yet known. The first audit must distinguish
    the literal restriction functor and its orthogonal parent multiplicity copies from a scalar Young-
    graph incidence surrogate: any gain must survive in the equality-subtracted physical channel, not
    only in an aggregated partition-label matrix. The completed proposer audit and fresh Rule-7 review
    answer that first gate negatively for the scalar mechanism. At fixed predecessor `beta`, distinct
    full-group parents occupy an orthogonal direct sum; the usual scalar Young-down matrix adds an unphysical
    codiagonal. More strongly, on the complete trivial-alphabet sector every left and right off-equality
    query retains at least `1-1/q` of the selector norm. The review verdict is **PARTIAL** because the
    proposer''s displayed `a=k^2,d=k,q=4a` sequence violates the frozen cap; the corrected exact sequence
    is `a=k^2,d=4k-1,m=4k,N=8k^3,q=4k^2=N^(2/3)`, and the uniform no-go survives it. The broad node remains
    **OPEN** because a nontrivial alphabet/raw-label recoupling or genuinely pair-dependent occurrence
    carrier lies outside this scoped no-go.'
