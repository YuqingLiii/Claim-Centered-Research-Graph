      independently sufficient grounds — (1) W-G2 is an unproved scope condition on the claim''s
      own universal quantifier, and it excludes exactly the idle-compressed layouts the frozen
      公共定义 asks for (compression shown material by the adjudicator''s own enumeration);
      (2) live frontier task-001 records that the self-contained proof of the exact claim is
      still owed; (3) task-002 records that the claim-level review the upgrade needs is still
      owed; (4) of the two linked reviews, the claim-level one attaches to document hashes and
      returned FURTHER-REPAIR, while the genuinely claim-hash-bound one is a focused amendment
      re-review listing parts (i)-(iii) as not re-derived — no single hash-bound review has
      attacked the assembled claim. W-G4 added to caveats (compliance gap vs the clearing
      review''s §3.5); same-stack caveat dropped as retired. Level unchanged; path to PROVED is
      exactly frontier task-001 + task-002.'
