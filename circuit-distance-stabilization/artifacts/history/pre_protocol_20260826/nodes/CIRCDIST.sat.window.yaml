id: CIRCDIST.sat.window
role: proof
aliases:
- SAT-WINDOW
- SAT-STABILITY
claim: For every fixed legal single-round single-ancilla CSS schedule M under ideal initialization
  and final data readout, the repeated-round distances satisfy d_(R+1)(M) <= d_R(M), the limit
  d_infinity(M) exists, every minimum-weight undetectable logical has a representative supported
  on contiguous rounds of span at most its weight, and therefore
  R_stab(M) <= d_infinity(M) <= d and d_R(M) = d_d(M) = d_infinity(M) for all R >= d; hence the
  first d distances decide both d_infinity and R_stab.
assessment:
  level: CERTIFIED*
  caveats:
  - 'W-G2 IS THE DECIDING CONDITIONALITY (adjudicated 2026-08-23): the claim quantifies over
    EVERY fixed legal schedule, but round-translation covariance is FALSE for layouts that
    compress idle layers across round boundaries, and the theorem document''s own §8 says
    (i)-(iii) are UNPROVED for that layout — while 公共定义 line 58 itself imposes idle-layer
    compression, and compression is material (depth-7 [[4,2,2]] space 176 -> 44, depth-8
    769 -> 34, adjudicator-verified). The claim as written is broader than what is argued.'
  - 'Scope clause S3-prime (as amended) is load-bearing. W-G1 (sector-min aggregation) is
    LOAD-BEARING-WITH-WITNESS as of 2026-08-23: the wave-17 lift review''s n = 6 witness
    (d_X = 3, d_Z = 2, d = 2, d_circ(Z-mem) = 3 > d) shows the d_infinity <= d clause is FALSE
    under a per-sector reading — the claim survives only under sector-min aggregation, which
    the self-contained proof (task-001) must carry as a hypothesis. W-G3 must NOT be carried
    (refuted as written and replaced — the replacement removes a hypothesis).'
  - W-G4 (is R_stab <= d_infinity tight?) stands open — required by the clearing review's §3.5
    caveat list, previously omitted from this node (compliance gap found by the wave-11
    adjudication).
  - 'W-OPEN ANSWERED POSITIVELY at REVIEWED level (wave 24 construction, wave 25 adversarial
    confirmation — three independent methods on the d = 5 cell): a constructed
    family of legal MC-satisfying hook-misaligned surface schedules has R_stab = 2/3/4 at
    d = 5/7/9 (witness-type evidence; consistent with this claim — R_stab = (d-1)/2 <=
    d_infinity = (d+1)/2 <= d on every computed cell, so the window theorem survives its
    first nontrivial stress test). The former absence-type discount and sampling-rarity
    caveat are superseded by the construction; review pending (instances wave-25).'
  summary: 'Promoted CONJECTURED -> CERTIFIED* 2026-08-22: the standalone stability-window
    theorem (artifacts/circdist_sat_window_theorem_20260822.md with Amendment 1) passed its
    claim-level adversarial review and the focused re-review of the amendment
    (artifacts/circdist_amendments4_review_20260822.md item 2) — S3-prime reproduced 18/18 by an
    independent CHP-simulator method, the rank-identity dispute adjudicated in the amendment''s
    favour, clearance hash-bound to this claim. Parts (i) monotonicity, (ii) contiguity
    (self-contained, no lift import), (iii) d_infinity = d_d with R_stab <= d_infinity <= d and
    the adaptive halting procedure. The earlier lift-side reviews remain context evidence only
    (their hashes bind lift claims).'
  basis:
    reviews:
    - path: artifacts/circdist_amendments4_review_20260822.md
      kind: review
      scope: Focused re-review of Window Amendment 1 (S3-prime, W-G5) with independent
        reproduction of all 18 verification rows by a different method; clears promotion.
      locator: Item 2
      reviewed_hash: sha256:8698b051b15fa14ff669299580d9b7bfec01808c0a34133ef09264e749466146
    - path: artifacts/circdist_sat_window_review_20260822.md
      kind: review
      scope: Claim-level adversarial review of the window theorem — parts (i)-(iii) confirmed,
        W-G3 closed via S3-prime, W-G5 identified.
      locator: Verdicts
      reviewed_hash: sha256:8698b051b15fa14ff669299580d9b7bfec01808c0a34133ef09264e749466146
    evidence:
    - path: artifacts/circdist_lift_proofs_review_20260820.md
      kind: text
    - path: artifacts/circdist_amendments2_review_20260820.md
      kind: text
    - path: artifacts/circdist_sat_recon_20260820.md
      kind: text
    - path: artifacts/circdist_lift_iff_proof_20260820.md
      kind: text
    - path: artifacts/circdist_lift_iff_amendment2_20260820.md
      kind: text
frontier:
  task-001:
    task: Write one self-contained proof of the exact current claim, explicitly reconciling the
      recon and lift model conventions and proving the step from a contiguous minimum eventual
      witness to R_stab <= d_infinity and d_R=d_d for every R>=d.
    kind: task
    since: '2026-08-22'
  task-002:
    task: Commission a fresh independent claim-level review that attacks boundary placement,
      schedule legality, CSS-sector recombination, fault collisions, and the all-schedules
      quantifier, and binds its verdict to the exact current claim hash.
    kind: review
    since: '2026-08-22'
  task-003:
    task: >-
      Decide the sharper single-round-dominance question in a clearly scoped class: either
      construct a legal schedule with R_stab >= 2 or prove R_stab=1 for that class; record the full
      search range before using the 7,610-schedule absence evidence.
    kind: gate
    since: '2026-08-22'
