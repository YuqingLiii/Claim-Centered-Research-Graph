        (no shared code) calibrated on the T-G3 quintuple then 110/110 identity instances +
        114/114 + 114/114 direct minimum-weight checks over 8 codes incl. BB [[18,4,4]] where
        the conclusion itself was verified (signature-grouped exact search, closing wave-27's
        declared limit); licenses CERTIFIED* on the folded claim with all six caveats
        surviving (C1/C3 sharpened); it did not re-adjudicate Theorem T's core, which rests on
        the earlier chain.
      locator: Section 6
      reviewed_hash: sha256:8fb50ff01b6465e9c660fc61292958828f448dd740757a8945deae1e107c7ad3
    runs:
    - path: artifacts/circdist_sat_recon_20260820.md
      kind: run
      scope: Exact min-plus implementation for four rotated-surface-code d=3 schedules, compared
        with an independent Stim detector-model calculation for R=1 through 10.
      result: Every transfer sequence was constant (2 or 3 according to schedule) and agreed with
        the independent calculation throughout the tested window.
    evidence:
    - path: artifacts/circdist_sat_recon_20260820.md
      kind: text
    - path: artifacts/circdist_sat_transfer_rereview_20260823.md
      kind: text
