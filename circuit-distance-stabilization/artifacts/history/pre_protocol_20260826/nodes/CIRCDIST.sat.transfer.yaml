id: CIRCDIST.sat.transfer
role: proof
aliases:
- SAT-TRANSFER
claim: >-
  For each fixed legal single-round single-ancilla CSS schedule M under the stated ideal temporal
  boundaries and unit-fault model, there is an explicitly constructible finite min-plus transfer
  system (u,A,v) such that d_R(M) = u^T min-plus A^R min-plus v for every R, with the two CSS
  sectors, boundary conditions, unreachable states, and logical terminal condition represented
  exactly. The d_R so computed is moreover invariant under the counting and detector-split
  conventions the surrounding route composes across: by Lemma 2.9 it is the same whether a witness
  is counted by its number of elementary faults, collisions permitted, or by its number of faulty
  locations; and in each CSS sector separately it is the same whether detectors are taken to be
  the Definition-2.7 set or the canonical detector space of Definition 3.5, this being Proposition
  3.7 in the Z-sector and its mirror under section 8.1 in the X-sector. Definition 3.5 is named
  here as a specific space; that it is the detector/observable split the frozen 公共定义 intends is a
  lead decision recorded in the caveats, not a result proved here.
assumptions:
  a1-bcoq-3112:
    kind: external-theorem
    statement: 'A1: BCOQ (Baccelli-Cohen-Olsder-Quadrat, Synchronization and Linearity) Theorem
      3.112 — min-plus matrix powers are eventually periodic — is the eventual-periodicity
      input to the d_R = u A^R v representation''s limit behaviour. Cited as published; NOT
      independently re-derived in this project (transfer caveat C6). Registered 2026-08-23
      after the wave-35 adjudication flagged it as load-bearing but machine-invisible (it
      lived only in a caveat string). Note: the three bridge clauses folded 2026-08-23 are
      A1-FREE (finite-R statements, per the wave-33b review §5).'
    source:
      note: 'Baccelli, Cohen, Olsder, Quadrat, "Synchronization and Linearity" (Wiley 1992),
        Theorem 3.112; no local copy in this repository.'
assessment:
  level: CERTIFIED*
  caveats:
  - 'T-G3 is closed BY DECISION, not derivation: the lead ratified Definition 3.5 (verbatim
    "批准 Definition 3.5, 缓解条款不批") as the intended reading of the frozen 公共定义; the
    mitigation clause was REFUTED by explicit counterexample and withdrawn; the installed safe
    condition is span{D_b,r} within D-prime within D (re-verified independently at its
    tightest endpoint on 3 codes). The 2026-08-23 bridge fold makes this caveat bite on the
    CLAIM and not only on the document: the claim now names Definition 3.5, and its certified
    invariance holds for the ordered pair (Definition 2.7, Definition 3.5) ONLY — it is NOT
    convention independence in general, and fails for other admissible splits, e.g. D-prime =
    span{D_b,r} + span{D_a,r} + span{P_X + lambda} on Steane+redundant-X, where d^2.7 = 2
    while d^D-prime = 3 at R = 2 and 4 at R = 3 (dimension quintuple 28/22/21/12/20,
    recomputed independently by the wave-33b re-bind review, which also confirmed
    d^D = d^2.7 = 2 at every R on that same instance).'
  - T-G1/G2/G4/G5 remain open minors, per the proof's own residual list.
  - 'The Y-projection step needs the uniform unit-cost Pauli fault model (公共定义); a
    non-uniform cost model would reopen it. The 2026-08-23 bridge fold extends this dependency
    to the newly certified Lemma-2.9 clause: the collision merge lowers the count only under
    one-unit-per-location costing, and it is available at all only because Definition 2.8
    gives every location a full Pauli GROUP (T-G1, imported not re-derived). Under a non-group
    per-location fault set the two counts come apart — witnessed on Steane/NI/R=2 by 3
    explicit effects of multiset cost 2 and configuration cost >= 3, each of which costs
    exactly 1 location under Definition 2.8.'
  - 'Evidence scope vs statement scope: the theorem is stated for arbitrary legal single-round
    single-ancilla CSS schedules, but the computational evidence covers d = 3, k = 1, R <= 3
    (one k = 2 instance for the fault dictionary only), no qLDPC instance; the general case
    rests on the reviewed derivations. For the three bridges folded into the claim on
    2026-08-23 the evidence is wider and independent: 110 mechanism-route instances (exact F2
    identities) and 114 direct minimum-weight instances over 8 codes and 3 schedule families,
    R <= 3, both sectors, including 4 codes with BOTH generating sets dependent (2 of them
    constructed by the reviewer) and BB [[18,4,4]] at k = 4 — where the minimum-weight
    conclusion, not merely the hypothesis, was verified in both sectors.'
  - The §11.4 program digest declared in the proof §0 is superseded by the amendment's repaired
    program (f3dfa1f9...); the original defective program hashes to the document's own declared
    digest, so the defect was in the published hashed code, not transcription.
  - External assumption A1 (BCOQ Thm 3.112, min-plus eventual periodicity) is cited as
    published; not independently re-derived here.
  summary: 'CLAIM EXTENDED 2026-08-23 (wave 33b): the three route bridges (Lemma 2.9 count
    invariance; Prop 3.7 Z-sector detector-split invariance; §8.1 X-sector mirror) folded into
    the certified text and hash-bound to the wave-33b re-bind review (8fb50ff0...), with
    Definition 3.5 named as a specific space and its intended-reading status left to the
    recorded lead decision. History: promoted CONJECTURED -> CERTIFIED* 2026-08-23: the general proof
    (artifacts/circdist_sat_transfer_proof_20260823.md, wave 7) passed its claim-level
    adversarial review (core theorem independently derived by the reviewer before reading,
    sealed, exact match; FURTHER-REPAIR narrow), Amendment 1 (wave 14, SHA 6c7a8fb7...) applied
    all four queued repairs with no deviations, and the focused independent re-review (wave 15,
    artifacts/circdist_sat_transfer_rereview_20260823.md) CLEAN-PASSED it with a fully
    independent method (own propagator and min-plus system built from the frozen definitions,
    validated against Table 11.3 before use, 24/24 vs own brute force): T-G3 counterexample
    confirmed (d^2.7 = 2 vs d^D-prime = 3 at R=2, 4 at R=3; quintuple 28/22/21/12/20), v_kappa
    confirmed (printed formula 0/16, corrected 16/16), block-mirror 6/6 relabelled rows
    verified, no silent extra change across 11 governing edits. The re-review adjudicated the
    amendment''s "pinned to kappa = 0" sharpening as substantively right but literally too
    strong (argmin has 3-8 elements; commentary-level precision note only). That wave-15
    clearance bound the pre-fold claim (eb50730d...) and now sits in basis.evidence; the
    current binding is the wave-33b review.'
  basis:
