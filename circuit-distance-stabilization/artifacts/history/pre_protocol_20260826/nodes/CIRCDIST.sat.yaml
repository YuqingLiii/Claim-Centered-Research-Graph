id: CIRCDIST.sat
role: outcome
aliases:
- R-SAT
- R-STAB
claim: >-
  For a fixed legal single-round single-ancilla CSS syndrome-extraction schedule M under ideal
  initialization and final data readout, let d_R(M) be the circuit distance after R verbatim
  repetitions of M, taken as the minimum over the two CSS memory sectors, d_infinity(M) = lim_{R
  to infinity} d_R(M), and R_stab(M) = min{R_0 : d_R(M) = d_infinity(M) for all R >= R_0}. Give a
  finite-state min-plus representation of d_R, prove an explicit finite-window theorem and
  algorithm deciding (d_infinity,R_stab), compute or rigorously bound that pair for a standard
  surface-code schedule, a legal hook-misaligned surface-code schedule, and at least one qLDPC
  schedule, and attribute the distance-limiting mechanism using auditable minimum witnesses.
assessment:
  level: CERTIFIED*
  caveats:
  - 'R-C1: the shared frozen 公共定义 model is a SINGLE POINT OF FAILURE — all three premises
    restate the same model and none re-derives it; a single misreading would invalidate all
    three simultaneously and cross-checking between them cannot detect it. PARTIALLY MITIGATED
    2026-08-25 (artifacts/circdist_stim_crossval_20260823.md): stim 1.16.0 independently
    reproduces the headline R_stab > 1 cell (rotated surface d = 5, class D: d_1 = 4,
    d_2 = 3, both sectors, min-over-sectors R_stab = 2), the full transfer d = 3 table (24/24
    values), and the Table 4.2 class structure at d = 3 and d = 5 (four classes of four, all
    four d = 5 signatures). The layout was NOT taken on trust: the published 576 -> 96 -> 16
    funnel uniquely pins the boundary convention among 64 candidates. Still single-point at
    d >= 7, d = 9, the qLDPC instance, and every R beyond the computed stim window.'
  - 'R-C2: aggregation is MIN-OVER-SECTORS, load-bearing-with-witness (d_infinity <= d is
    false per-sector; decisive for a reported R_stab at d = 7); no instance in this route has
    d_X != d_Z.'
  - 'R-C3: the layout is VERBATIM REPETITION; cross-round idle compression is a different
    model and out of scope — and the compression instruction''s frozen provenance is 课题一,
    not 公共定义 (the line-58 misattribution corrected by the wave-27 review from the frozen
    bytes: 课题四 lines 185-233 carry NO compression clause, so W-G2 inherits as a scope pin,
    MILDER).'
  - 'R-C4: the detector/observable split is fixed BY DECISION, not derivation, AND THE ROOT CLAIM
    DOES NOT PIN IT. Definition 3.5 is lead-ratified (verbatim "批准 Definition 3.5, 缓解条款不批") as the
    intended reading of the frozen 公共定义; the corrected safe condition is span{D_b,r} within
    D-prime within D (containment in D, NOT in V); W-G3 must not be carried; S3-prime is
    load-bearing. A circuit distance is exactly as well defined as the split it is measured
    against, and the value MOVES when the split moves: on Steane + a redundant X row, D-prime =
    span{D_b,r} + span{D_a,r} + span{P_X + lambda} gives d^D-prime = 3 at R = 2 and 4 at R = 3
    against d^2.7 = 2 (dimension quintuple 28/22/21/12/20). Because the root claim says only "the
    circuit distance" and names no detector space — while V2 did pin the layout and the sector
    aggregation, the other two load-bearing convention axes — this is an unresolved scope caveat
    INSIDE the root claim and is the deciding conditionality for PROVED on this node. DISCHARGED
    SUB-ITEMS (2026-08-25): the former (a)/(b)/(c) proposer-level flags on transfer Prop 3.7, its
    section-8.1 mirror, and transfer Lemma 2.9 are discharged — all three now sit inside
    CIRCDIST.sat.transfer''''s certified claim text by name, hash-bound to sha256:8fb50ff0...
    (artifacts/circdist_transfer_bridgefold_20260823.md; 110/110 F2-identity, 114/114 + 114/114
    direct minimum-weight incl. BB [[18,4,4]] in both sectors), the folded clause was checked
    clause-against-usage to cover both bridge usages of the root assembly, and both bridges were
    independently re-verified by the wave-35 adjudicator on two fresh dependent-generator codes
    (24/24 exact F2 identities with a non-empty Def-2.7 hole in every instance; 36/36 direct
    minimum-weight d^2.7 = d^D; 22385 minimum-weight Def-2.7 witnesses of which 3760 are
    D-detected and 3760/3760 repaired by Pi, zero exceptions; the T-G3 quintuple and wave-33b''''s
    3-effect non-group control both reproduced exactly).'
  - 'R-C5: transfer evidence scope != statement scope (document evidence d = 3, k = 1,
    R <= 3; general case rests on reviewed derivations; partially relieved as corroboration
    only by the instances arm''s independent agreement at d = 5 and on BB [[18,4,4]]).'
  - 'R-C6: transfer open minors T-G2/T-G4/T-G5 and the Y-projection''s uniform unit-cost
    dependence.'
  - 'R-C7: external assumption A1 (BCOQ Thm 3.112) cited as published, not re-derived.'
  - 'R-C8: W-G4 open — is R_stab <= d_infinity tight? Gains data from the instances arm, no
    closure; tightness is asymptotic iff the conjectured law holds, and the law is the
    conjectured part.'
  - 'R-C9: instance scope — the hook-misaligned family is the uniform S4 x S4 space only
    (576 -> 96 -> 16); no "no legal schedule does X" statement licensed; the qLDPC arm is one
    code, one schedule, depths 7-11 unscanned, no d_X != d_Z instance.'
  - 'R-C10: two reported cells proposer-level for replication (d = 9 R_stab = 4; d = 7
    standard — its X-sector one undecided MILP cell); neither load-bearing for any root
    clause; d = 9 truncation otherwise closed by assembly Lemma A.1.'
  - 'R-C11: document hygiene, all safe-direction (superseded §11.4 digest; 78 -> 77 classes;
    sector-reduced label; stale §0 node hash).'
  - 'R-C12: the route is NOT a flat conjunction and the premises are NOT independent evidence
    — instances imports window for every statement outside its computed windows (dependency
    window -> instances, transfer alongside); a window defect hits two of three premises; the
    instances arm''s positive W-OPEN answer is a CONSISTENCY CHECK ON THE COMPUTED PREFIXES
    (monotonicity and R_stab <= d_infinity <= d, which are not imported), not an independent
    confirmation of the window theorem''s tail clause.'
  - 'R-C13: explicit exclusions the root neither asserts nor uses — the fitted law
    d_R = max(d - R, (d+1)/2) / R_stab = (d-1)/2; the reading "R_stab is unbounded"; the
    §6.2b interpretive account of WHY R_stab > 1 occurs; reading (C5) as proved emptiness of
    the temporal-boundary mechanism. For the standard surface schedule d_infinity = d, so its
    mechanism label describes the minimum witness, not an obstruction.'
  summary: 'Promoted CONJECTURED -> CERTIFIED* 2026-08-23: the root composition proof
    (artifacts/circdist_sat_root_assembly_20260823.md) passed independent adversarial review
    (artifacts/circdist_sat_root_review_20260823.md) — all 8 clauses discharged from the
    three CERTIFIED* premises (hashes recomputed 3/3 by both assembly and review), six-axis
    convention audit clean with both bridges re-derived and independently recomputed, caveat
    composition audited (R-C12/R-C13 restored). 课题四 (revised question 4) is closed at
    CERTIFIED*: min-plus representation (transfer), finite-window theorem with B = d and no
    r-dependence (window — stronger than the frozen B(r,d)), computed pairs for standard
    surface (d, 1), hook-misaligned surface (3, 2) at d = 5 — the R_stab > 1 discovery,
    reviewed — and BB [[18,4,4]] qLDPC (3, 1), with audited-witness mechanism attribution.
    PROVED refused by the reviewer: three load-bearing bridge steps sit outside the premises''
    certified claim texts (R-C4) and R-C1 is an unresolved scope caveat by construction.
    Claim carries the lead-approved min-form R_stab definition (V1, drafting slip at rescope
    fixed; the frozen commission line 194 uses the min form — decisive). Five corrections and
    the V2 (R1+R2) recommendation recorded in the review; V2 adoption pending lead.'
