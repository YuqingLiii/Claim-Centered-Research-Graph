id: CIRCDIST.sat.window
role: proof
aliases:
- SAT-WINDOW
- SAT-STABILITY
claim: 'For every CSS code Q = [[n,k,d]] with k >= 1 and every fixed legal (conflict-free and measurement-consistent)
  single-round single-ancilla CSS syndrome-extraction schedule M for Q, let C_R^Z(M) and C_R^X(M) be the ideal-boundary
  memory experiments formed by R verbatim repetitions of M with the uniform unit-cost full-Pauli per-location fault
  model, and let d_R(M) be the minimum of their circuit distances measured against, respectively, the canonical
  detector space of Definition 3.5 in the CIRCDIST.sat.transfer proof dossier and its section-8.1 mirror (equivalently
  in value only, not in detector-set equality, the corresponding Definition-2.7 detector sets). Then d_(R+1)(M)
  <= d_R(M) for every R >= 1; d_infinity(M) := lim_{R to infinity} d_R(M) exists; in each memory sector every minimum-weight
  undetectable logical has a same-weight sector-pure representative supported on a contiguous interval of rounds
  whose span is at most its faulty-location weight; and, writing d = min(d_X,d_Z) for the CSS code distance and
  R_stab(M) := min{R_0 >= 1 : d_R(M) = d_infinity(M) for all R >= R_0}, one has R_stab(M) <= d_infinity(M) <= d
  and d_R(M) = d_d(M) = d_infinity(M) for every R >= d. Consequently d_1(M),...,d_d(M) determine both d_infinity(M)
  and R_stab(M).'
assessment:
  level: PROVED
  caveats:
  - 'W-P1: PROVED is confined to CSS codes with k >= 1 and the exact stated model: conflict-free and measurement-consistent
    single-ancilla extraction, ideal initialization and terminal data readout, verbatim round blocks with no cross-round
    compression, uniform unit-cost full Pauli groups at every named fault location, and the Definition-3.5 canonical
    detector space with its section-8.1 mirror.'
  - 'W-P2: The spatial ceiling used by the proof is aggregate: d_R = min(d_R^Z,d_R^X) <= min(d_X,d_Z). No per-sector
    inequality d_R^sigma <= min(d_X,d_Z) is asserted or used; asymmetric CSS codes can violate it.'
  - 'W-P3: Tightness of R_stab <= d_infinity, the fitted hook-misaligned family law, arbitrary detector-split invariance,
    nonuniform or non-group fault costs, and layouts with cross-round compression are outside this claim.'
  summary: Fresh independent end-to-end review verifies the direct boundary-equation proof of the exact repaired
    standalone claim at PROVED. The proof covers both CSS sectors, dependent generators, the named canonical detector
    split, collision-free occupied-location weight, all temporal boundaries, asymmetric code distances, contiguous
    representatives, the aggregate d-window, and the minimal stabilization index. It imports no unresolved theorem
    or premise. Stronger tightness and family-law questions remain outside the claim.
