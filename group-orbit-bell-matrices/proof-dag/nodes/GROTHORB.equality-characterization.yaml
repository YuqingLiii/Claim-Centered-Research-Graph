id: GROTHORB.equality-characterization
role: proof
aliases:
- ORBIT-EQUALITY-CLASSIFICATION
claim: Let A be a nonzero real m by n matrix with top singular value sigma of multiplicity r and paired
  top singular bases U,V. A unit-row vector strategy X,Y attains sigma sqrt(mn) if and only if, for some
  T, one has Y=VT, X=sqrt(m/n)UT, and H=TT^T is positive semidefinite with diag(VHV^T)=1_n and diag(UHU^T)=(n/m)1_m.
  Whenever such strategies exist, the minimum real vector dimension among them is the minimum rank of
  a feasible H.
assessment:
  level: PROVED
  summary: Complete scoped argument passed an independent fresh-context same-model-family adversarial
    review. Both equality conditions, empty feasible sets and qualified minimum dimension, after scope
    repair. Correctness does not assert novelty or formal verification.
  basis:
    evidence:
    - path: group-orbit-bell-matrices/artifacts/complete-extremizer-classification-20260829.md
      kind: text
      locator: GOC-T1 through GOC-T3
    - path: group-orbit-bell-matrices/artifacts/spectral-classification-scope-repair-20260907.md
      kind: text
      locator: SC1 and SC2
    reviews:
