id: GROTHORB.root-classical-equality
role: proof
claim: For every r>=3 and the full D_r root projection A_r=WW^T/[4(r-1)], every pair attaining beta_cl(A_r)
  has s=t with s_w=sign(w dot g*rho), rho=(r-1,r-2,...,0), for a signed coordinate permutation g; conversely
  all such pairs attain the optimum. The number of distinct maximizing sign pairs is 2^(r-1)*r!.
routes:
  support-equality:
    premises:
    - GROTHORB.root-classical
    implication: Equality in the sorted-coordinate support bound fixes the signed-sum direction to a signed
      permutation of rho, whose root inner products are nonzero; equality in the PSD bilinear bound identifies
      both signs.
    assessment:
      level: PROVED
      summary: Author-independent same-model review of this exact implication and supporting assembly passed.
      basis:
        reviews:
        - path: group-orbit-bell-matrices/reviews/root-classical-review-20260907.md
          kind: review
          locator: F2R
          scope: Checked maximal-image equality, termwise sign recovery, the converse, zero-coordinate stabilizer,
            and complete ordered-pair count.
          reviewed_hash: sha256:81878c54dfe7e3b4aec018401e7be9c89d943429321013f5501611711ce02464
