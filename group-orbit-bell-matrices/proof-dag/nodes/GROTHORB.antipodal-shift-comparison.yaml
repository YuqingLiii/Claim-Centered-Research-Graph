id: GROTHORB.antipodal-shift-comparison
role: proof
claim: For every real m by m matrix C and lambda>=0, set D(C)=(1/2)[C,-C;-C,C]. Then beta_cl(D(C)-lambda I_(2m))/2
  equals the maximum over z in {-1,0,1}^m of sum_{i:z_i!=0}|(Cz)_i-lambda*z_i|+ sum_{i:z_i=0}max(|(Cz)_i|,lambda).
  In particular beta_cl(D(C)-lambda I_(2m))>=2*beta_cl(C-lambda I_m), with equality when lambda=0.
