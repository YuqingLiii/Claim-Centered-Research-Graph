id: GROTHORB.transitive-optimum
role: outcome
aliases:
- ORBIT-OPTIMUM
claim: Let a finite group act transitively on the rows and columns of a real m by n matrix A, with P_g
  A Q_g^T = A for every group element. Then beta_vec(A) = sqrt(mn) times the operator norm of A. If A
  is nonzero, this value is attained by normalized rows of paired top left and right singular bases; if
  A is zero, every feasible vector strategy is optimal.
routes:
  balanced-top-space:
    premises:
    - GROTHORB.spectral-upper
    - GROTHORB.balanced-criterion
    - GROTHORB.invariant-projector
    implication: If A is nonzero, equivariance makes the top left and right singular projectors invariant.
      Transitivity makes their diagonals constant, so the balanced criterion supplies an extremizer saturating
      the universal spectral upper bound. If A is zero, both sides vanish and every feasible strategy
      is optimal.
    proof:
      sketch: Apply the invariant-projector lemma to both top singular projectors and then normalize their
        rows.
      sources:
      - path: group-orbit-bell-matrices/artifacts/complete-extremizer-classification-20260829.md
        kind: text
        locator: GOC-T4
      - path: group-orbit-bell-matrices/artifacts/balanced-rank-theorem-draft-20260829.md
        kind: text
        locator: GO-T4
    assessment:
      level: PROVED
      summary: The implication and its current target assembly passed independent adversarial review.
