id: GROTHORB.rch-reduction
role: proof
aliases:
- ORBIT-RCH
claim: >-
  Let a finite group G act by permutation matrices P_g on R^m and Q_g on
  R^n, and let A be a nonzero real m by n matrix with P_g A=A Q_g. Let
  sigma=||A||_op, and let U,V have orthonormal columns spanning its paired
  top singular spaces, with AV=sigma U and A^T U=sigma V. Then
  R_g=V^T Q_g V is an orthogonal representation with P_g U=U R_g.
  Every H>=0 satisfying diag(VHV^T)=1_n and diag(UHU^T)=(n/m)1_m has
  an invariant feasible average |G|^(-1) sum_g R_g H R_g^T. Relative to
  an orthogonal real isotypic decomposition of this representation into
  W_alpha^{oplus t_alpha}, every invariant PSD weight, and only such
  a weight, is represented by Hermitian PSD multiplicity matrices
  B_alpha in M_{t_alpha}(D_alpha), where D_alpha=End_G(W_alpha) is
  R, C, or H, with compatible real adjoint corresponding to conjugate
  transpose on each multiplicity matrix. The two original balance equations
  remain additional constraints on these invariant PSD blocks.
assumptions:
  real-schur-division-algebras:
    kind: external-theorem
    statement: The commutant of an irreducible real representation of a real C-star algebra is isomorphic as a real division algebra to R, C, or H; apply this to the real star-algebra generated by a finite-dimensional orthogonal group representation.
    source:
      path: group-orbit-bell-matrices/artifacts/group-orbit-literature-positioning-20260907.md
      kind: text
      locator: L5, Rosenberg arXiv 1505.04091 Theorem 1.3 and Corollary 1.4, page 2
