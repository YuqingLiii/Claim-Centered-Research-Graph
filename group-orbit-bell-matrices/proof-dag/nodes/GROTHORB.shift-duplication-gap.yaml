id: GROTHORB.shift-duplication-gap
role: obstruction
claim: Let U have rows e_i-e_j and e_i+e_j for 1<=i<j<=3, C=UU^T/4, and D(C)=(1/2)[C,-C;-C,C]. At lambda=1/3,
  beta_cl(D(C)-lambda I_12)=20/3 is strictly larger than 2*beta_cl(C-lambda I_6)=6.
routes:
  exact-comparison:
    premises:
    - GROTHORB.d3-shift-envelope
    - GROTHORB.d3-half-shift-value
    implication: Reordering the full roots as W=[U;-U] identifies A_3 with D(C) up to a simultaneous row and
      column permutation. Evaluating the full envelope at lambda=1/3 gives 20/3, whereas the half-root value
      gives twice 3, and 20/3>6.
    assessment:
      level: PROVED
      summary: Author-independent same-model review of this exact implication and supporting assembly passed.
      basis:
