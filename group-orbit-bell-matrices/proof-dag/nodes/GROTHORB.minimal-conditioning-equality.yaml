id: GROTHORB.minimal-conditioning-equality
role: proof
claim: >-
  Let r>=2 and m>=n>=1 be integers. Let a_i,b_j be unit vectors in R^r
  with positive weights u_i,v_j such that each weighted second moment is I_r,
  m+n=r(r+1)/2+1, and the combined map H -> ((a_i^T H a_i)_i,
  (b_j^T H b_j)_j) is injective on Sym_r. On traceless Sym_r put
  f_i=a_i a_i^T-I_r/r, g_j=b_j b_j^T-I_r/r, F_A=sum_i u_i |f_i><f_i|,
  F_B=sum_j v_j |g_j><g_j|, and c=(r-1)/(m-1), with the Frobenius inner
  product defining these operators. Then lambda_min(F_A+F_B)=c if and
  only if all u_i=r/m, all distinct Alice pairs satisfy
  (a_i^T a_k)^2=(m-r)/(r(m-1)), every cross pair satisfies
  (a_i^T b_j)^2=1/r, and the restriction of F_B to span{g_j} has
  smallest eigenvalue at least c.
