id: GROTHORB.balance-rigidity
role: proof
claim: For a nonzero transitive equivariant real m by n matrix with paired top singular bases U,V of width
  r, define L(K)=(diag(UKU^T),diag(VKV^T)) on Sym_r. The feasible balance weight is unique if and only
  if L is injective; in that case it equals (n/r)I and every optimal real vector strategy has dimension
  at least r. If L is not injective, an optimal strategy exists in dimension at most r-1.
routes:
  balance-kernel:
    premises:
    - GROTHORB.extremizer-classification
    implication: The strictly positive scalar feasible weight can be perturbed along the balance kernel;
      uniqueness and boundary rank reduction translate to vector dimensions through the extremizer classification.
    assessment:
      level: PROVED
      summary: The implication and its current target assembly passed independent adversarial review.
