id: GROTHORB.psd-antipodal-interior-equality
role: proof
claim: Let C be a real symmetric PSD N by N matrix with N>=1 and d_min=min_i C_ii>0, and put D(C)=(1/2)[C,-C;-C,C].
  For every 0<lambda<d_min/2, the ordered sign pairs (a,b) attaining beta_cl(D(C)-lambda I_{2N}) are exactly
  a=b=(z,-z), where z in {+1,-1}^N maximizes z^T C z.
routes:
  strict-gap-coefficients:
    premises:
    - GROTHORB.psd-antipodal-linear-window
    implication: Use the established optimum value and reconstruct the full nonnegative gap identity for arbitrary
      ordered signs. Strictly positive coefficients C_ii-2lambda force every averaged antisymmetric coordinate
      to have square one at equality; recover the full signs and check equivalence to maximizing z^T C z.
    assessment:
      level: PROVED
      summary: The exact implication and every load-bearing input passed author-independent review.
      basis:
        reviews:
