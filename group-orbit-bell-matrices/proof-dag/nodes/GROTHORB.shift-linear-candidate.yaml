id: GROTHORB.shift-linear-candidate
role: proof
claim: For every r>=3 and 0<=lambda<=1/2, the full D_r root projection A_r=WW^T/[4(r-1)], n=2r(r-1), satisfies
  beta_cl(A_r-lambda I)=2r(2r-1)/3-n*lambda.
assessment:
  level: REFUTED
  summary: 'The universal whole-interval formula is false: an explicit full-root D3 pair gives 6 at lambda=1/2,
    while it predicts 4. This does not refute any smaller-domain or other-family theorem.'
  basis:
    counterexamples:
    - &id001
      path: group-orbit-bell-matrices/artifacts/d3-classical-envelope-20260907.md
      kind: counterexample
      locator: D3-4
    reviews:
