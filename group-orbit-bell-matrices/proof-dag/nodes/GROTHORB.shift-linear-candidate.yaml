      kind: review
      locator: F4
      scope: Directly checked the explicit allowed r=3, lambda=1/2 sign pair, whose score 6 exceeds the predicted
        4; no upper-envelope assumption is needed.
      reviewed_hash: sha256:8f149d1b408a8f98ed180b5d0dc1a260d437dc81c46dc91ef77fd58c5b64c269
    evidence:
    - path: group-orbit-bell-matrices/artifacts/d3-classical-envelope-certificate-20260907.json
      kind: text
      locator: linear_proposal_counterexample
    - path: group-orbit-bell-matrices/artifacts/classical-exploration-summary-20260907.md
      kind: text
      locator: STATE
