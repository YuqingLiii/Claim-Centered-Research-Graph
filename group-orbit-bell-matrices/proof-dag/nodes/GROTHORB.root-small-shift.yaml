id: GROTHORB.root-small-shift
role: proof
claim: For every r>=3, n=2r(r-1), and A_r the full D_r root projection, beta_cl(A_r-lambda I)=2r(2r-1)/3-n*lambda
  for every real lambda satisfying 0<=lambda<=1/[2n(r-1)].
routes:
  discrete-gap:
    premises:
    - GROTHORB.root-classical
    - GROTHORB.root-classical-equality
    implication: All maximizing unshifted pairs are diagonal and every unshifted score lies in (1/(r-1))Z,
      so off-diagonal pairs lose at least 1/(r-1). Bounding the shift advantage by 2n*lambda preserves diagonal
      optimality throughout the stated interval.
    assessment:
      level: PROVED
      summary: Author-independent same-model review of this exact implication and supporting assembly passed.
      basis:
        reviews:
        - path: group-orbit-bell-matrices/reviews/root-classical-review-20260907.md
          kind: review
          locator: F3R
          scope: Checked all load-bearing premises, exact parity lattice, off-diagonal loss, shift comparison,
            and both interval endpoints.
          reviewed_hash: sha256:ff5cd598382d45f215c5a4f16c8ed50ab0b964215afeb6e6e9684b171107945c
    proof:
      sketch: Complete implication and its assembled dependencies are checked in the linked proof and independent
        review.
      sources:
