id: GROTHORB.root-frame-dimension
role: proof
claim: For r>=3, let W have the n=2r(r-1) rows given by all vectors +/-e_i +/-e_j for 1<=i<j<=r, and put
  A=WW^T/[4(r-1)]. Then A is a rank-r orthogonal projection equivariant under a transitive permutation
  action on its rows and columns; its vector Bell optimum is n, its balance weight is unique, and its
  minimum optimal real vector dimension is r.
routes:
  root-frame-rigidity:
    premises:
    - GROTHORB.balance-rigidity
    - GROTHORB.transitive-optimum
    implication: The root frame is tight and its outer products span Sym_r, so the balance map is injective
      and the rigidity criterion supplies the result.
    assessment:
      level: PROVED
      summary: The implication and its current target assembly passed independent adversarial review.
      basis:
        reviews:
        - path: group-orbit-bell-matrices/reviews/balance-rigidity-review-20260907.md
