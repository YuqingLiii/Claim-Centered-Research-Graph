id: GROTHORB.invariant-projector
role: proof
aliases:
- ORBIT-PROJECTOR
claim: If a finite group acts transitively by permutation matrices on m points and an orthogonal rank-r
  projector commutes with that action, every diagonal entry of the projector equals r/m.
