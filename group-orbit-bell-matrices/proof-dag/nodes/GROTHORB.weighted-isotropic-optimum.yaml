id: GROTHORB.weighted-isotropic-optimum
role: proof
claim: Let r,m,n be positive integers, a_1,...,a_m and b_1,...,b_n unit vectors in R^r, and u_i,v_j positive
  real weights. Write S=sum_i u_i and T=sum_j v_j. If sum_i u_i a_i a_i^T=(S/r)I_r and sum_j v_j b_j b_j^T=(T/r)I_r,
  then the real vector Bell optimum of M_ij=u_i v_j (a_i dot b_j) is S*T/r, attained by the strategy x_i=a_i,y_j=b_j.
