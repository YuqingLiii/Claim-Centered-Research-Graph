id: GROTHORB.balanced-criterion
role: proof
aliases:
- ORBIT-BALANCE
claim: If paired orthonormal bases U,V of the top singular spaces of a nonzero real m by n matrix A have
  projector diagonals r/m and r/n, then their normalized rows are unit-vector strategies attaining sqrt(mn)
  times the operator norm of A.
