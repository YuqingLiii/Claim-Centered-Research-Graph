id: GROTHORB.psd-antipodal-linear-window
role: proof
claim: Let C be a real symmetric PSD N by N matrix with N>=1, let D(C)=(1/2)[C,-C;-C,C], and define beta_cl(M)=max_{s,t
  in {+1,-1}^k} s^T M t for real square k by k matrices. For every 0<=lambda<=(1/2)min_i C_ii, beta_cl(D(C)-lambda
  I_{2N})=2 beta_cl(C)-2N lambda.
