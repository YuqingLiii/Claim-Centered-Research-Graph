id: GROTHORB.root-shift-window-maximality
role: proof
claim: For every integer r>=3, let W have as its rows all vectors epsilon e_i+eta e_j with 1<=i<j<=r and epsilon,eta
  in {+1,-1}, let n=2r(r-1), and put A_r=WW^T/[4(r-1)]. Among lambda>=0, beta_cl(A_r-lambda I_n)=2r(2r-1)/3-n
  lambda holds if and only if lambda<=1/[2(r-1)]. In particular, for every lambda>1/[2(r-1)] there is an explicit
  ordered sign pair scoring 2r(2r-1)/3-n lambda+4lambda-2/(r-1), strictly above that affine value.
routes:
  height-one-competitor:
    premises:
    - GROTHORB.root-extended-shift-window
    implication: The registered sufficient-window theorem proves equality up to the endpoint. In the positive-root
      order U, with C=UU^T/[2(r-1)] and W=[U;-U], construct a sign pair whose ternary coordinates agree with
      the all-positive pattern except at one height-one root, where both antisymmetric coordinates vanish and
      the symmetric signs are opposite. Direct evaluation must establish the claimed competing affine score
      and its strict improvement beyond the endpoint.
    assessment:
      level: PROVED
      summary: The exact implication and every load-bearing input passed author-independent review.
      basis:
        reviews:
