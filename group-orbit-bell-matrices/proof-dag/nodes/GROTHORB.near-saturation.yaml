id: GROTHORB.near-saturation
role: proof
claim: Let A be nonzero and real, sigma its top singular value, and tau<sigma the operator norm on the
  orthogonal complement of its top right singular space (zero if the complement is zero). For unit-row
  strategies X,Y with objective at least (1-epsilon)sigma sqrt(mn), 0<=epsilon<=1, and normalized x=X/sqrt(m),
  y=Y/sqrt(n), the squared Frobenius mass of y outside the top right singular space is at most (2epsilon-epsilon^2)/(1-(tau/sigma)^2),
  and ||x-Ay/sigma||_F^2 <= 2epsilon.
assessment:
  level: PROVED
  summary: Complete scoped argument passed an independent fresh-context same-model-family adversarial
    review. Universal inequalities, epsilon endpoints, rectangular top spaces and concentration-only scope.
    Correctness does not assert novelty or formal verification.
