id: GROTHORB.robust-dimension-gap
role: proof
claim: Let A be a nonzero real m by n transitive equivariant matrix with top singular value sigma of multiplicity
  r>=2, paired bases U,V, and largest remaining singular value tau<sigma (zero if there is none). Suppose
  L(K)=(diag(UKU^T),diag(VKV^T)) is injective on Sym_r, and set s=min_{||K||_F=1}||L(K)||_2>0 and delta=1-tau/sigma.
  Then every real unit-vector strategy of dimension d<r has value at most (1-delta*s^2/(16*r^2))*sigma*sqrt(m*n).
assessment:
  level: PROVED
  summary: Complete scoped argument passed an independent fresh-context same-model-family adversarial
    review. Dilation spectrum, balance conditioning, rank loss and constants; real-vector dimensions only.
    Correctness does not assert novelty or formal verification.
