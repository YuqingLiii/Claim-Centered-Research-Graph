id: GROTHORB.root-classical
role: proof
claim: For every integer r>=3, let W contain all roots +/-e_i +/-e_j with i<j, n=2r(r-1), and A_r=WW^T/[4(r-1)].
  Then the classical Bell value max_{s,t in {+1,-1}^n} s^T A_r t equals 2r(2r-1)/3.
