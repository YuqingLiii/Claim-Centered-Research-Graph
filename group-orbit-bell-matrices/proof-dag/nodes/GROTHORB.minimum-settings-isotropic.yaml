id: GROTHORB.minimum-settings-isotropic
role: proof
claim: Fix an integer r>=1. Among pairs of nonempty finite positive weighted isotropic unit frames in R^r for
  which the map H -> ((a_i^T H a_i)_i,(b_j^T H b_j)_j) is injective on Sym_r, the minimum total number of frame
  vectors m+n is r(r+1)/2+1. It is attained with Alice vectors e_1,...,e_r of weight 1, Bob vectors (e_i-e_j)/sqrt(2)
  for i<j of weight 2/r, and (1,...,1)/sqrt(r) of weight 1.
