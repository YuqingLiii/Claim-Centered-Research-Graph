id: GROTHORB.minimal-setting-conditioning
role: proof
claim: Let r>=2, m,n>=1 be integers. Suppose two positive weighted unit frames satisfy sum_i u_i a_i a_i^T=sum_j
  v_j b_j b_j^T=I_r, m+n=r(r+1)/2+1, and their combined quadratic evaluation map is injective on Sym_r. On
  traceless Sym_r define f_i=a_i a_i^T-I_r/r, g_j=b_j b_j^T-I_r/r and F(H)=sum_i u_i <f_i,H>_F f_i+ sum_j v_j
  <g_j,H>_F g_j. Then F is positive definite and lambda_min(F)<=(r-1)/max(m-1,n-1).
